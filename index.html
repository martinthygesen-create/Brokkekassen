// Der er IKKE længere nogen ambient nedtælling der selv trykker "gå videre"
// — kun serveren afgør timing (se expireGamePhaseIfDue i api/_lib/gameFlow.js),
// og kun som en synlig konsekvens af et brok (menneske eller Brokspillet),
// aldrig stille. Det eneste der tælles ned her, er visningen af en AKTIV
// brok-nedtælling — ren kosmetik, udløser aldrig selv noget.
const MIN_COMPLAIN_AGE_MS = 30000;
const COMPLAINT_COUNTDOWN_MS = 12000;

function getPendingIdsClient(cur, players){
  if(!cur) return [];
  if(cur.phase === 'results' || cur.phase === 'skipped') return players.filter(id=>!(cur.readyIds||[]).includes(id));
  if(cur.type === 'quiplash' && cur.phase === 'answer') return players.filter(id=>!(cur.answers && cur.answers[id] !== undefined));
  if(cur.type === 'quiplash' && cur.phase === 'vote') return players.filter(id=>!(cur.votes && cur.votes[id] !== undefined));
  if(cur.type === 'truefalse' && cur.phase === 'write') return cur.authorId ? [cur.authorId] : [];
  if(cur.type === 'truefalse' && cur.phase === 'guess'){
    const eligible = cur.authorId ? players.filter(id=>id!==cur.authorId) : players;
    return eligible.filter(id=>!(cur.guesses && cur.guesses[id] !== undefined));
  }
  if(cur.type === 'trivia' && cur.phase === 'answer') return players.filter(id=>!(cur.choices && cur.choices[id] !== undefined));
  if(cur.type === 'guessbrok' && cur.phase === 'write') return cur.authorId ? [cur.authorId] : [];
  if(cur.type === 'guessbrok' && cur.phase === 'guess') return players.filter(id=>id!==cur.authorId).filter(id=>!(cur.guesses && cur.guesses[id] !== undefined));
  return [];
}

// Vises hvor som helst en fase venter på nogen: enten den voksende
// "brok over ..."-knap (kun for spillere der selv allerede er færdige), eller
// selve brok-banneret + nedtælling, når nogen (menneske eller Brokspillet)
// allerede har brokket sig. Ingen tal vises FØR der reelt er brokket over nogen.
function complaintBlockHtml(g, cur){
  if(!cur || !profile || !g.players) return '';
  const pending = getPendingIdsClient(cur, g.players);
  if(!pending.length) return '';
  const myId = profile.memberId;
  if(cur.complaint){
    const byName = cur.complaint.by === 'brokspillet' ? 'Brokspillet' : ((state.members.find(m=>m.id===cur.complaint.by)||{}).name || 'Nogen');
    const targetName = (state.members.find(m=>m.id===cur.complaint.targetId)||{}).name || 'nogen';
    return `
      <div class="complaint-banner">
        <span>${cur.complaint.by === 'brokspillet' ? '🎙️' : '🐌'} <b>${escapeHtml(byName)}</b> brokker sig over at <b>${escapeHtml(targetName)}</b> bruger sin tid</span>
        <span id="complaintCountdown" class="complaint-countdown"></span>
      </div>
    `;
  }
  if(pending.includes(myId)) return ''; // man skal selv være færdig for at kunne brokke sig
  const age = cur.phaseStartedAt ? (Date.now() - cur.phaseStartedAt) : 0;
  if(age < MIN_COMPLAIN_AGE_MS) return '';
  const growth = Math.min(1, (age - MIN_COMPLAIN_AGE_MS) / 30000);
  const targetName = pending.length === 1 ? (state.members.find(m=>m.id===pending[0])||{}).name : null;
  const label = targetName ? `🐌 Brok over ${escapeHtml(targetName)}s tempo` : `🐌 Brok over de langsomme`;
  return `<button class="complain-btn" id="complainBtn" data-target="${pending[0]}" style="transform:scale(${(1+growth*0.16).toFixed(2)}); opacity:${(0.6+growth*0.4).toFixed(2)};">${label}</button>`;
}

function startComplaintCountdown(cur){
  clearInterval(complaintCountdownInterval);
  complaintCountdownInterval = null;
  if(!cur || !cur.complaint) return;
  const deadline = cur.complaint.startedAt + COMPLAINT_COUNTDOWN_MS;
  const tick = ()=>{
    const el = document.getElementById('complaintCountdown');
    if(!el){ clearInterval(complaintCountdownInterval); complaintCountdownInterval = null; return; }
    const left = Math.max(0, Math.ceil((deadline - Date.now())/1000));
    el.textContent = '⏱️ ' + left + 's';
  };
  tick();
  complaintCountdownInterval = setInterval(tick, 1000);
}

const GAME_TAUNTS = [
  n => `😈 ${n} vandt runden — resten kan pakke sammen.`,
  n => `👑 ${n} regerer denne runde. Hån frit.`,
  n => `🔥 ${n} smadrede runden!`,
  n => `🎯 ${n} ramte plet — de andre gjorde ikke.`,
];
function randomTaunt(name){ return GAME_TAUNTS[Math.floor(Math.random()*GAME_TAUNTS.length)](name); }

function fireConfetti(centerEl){
  if(typeof gsap === 'undefined') return;
  const rect = centerEl ? centerEl.getBoundingClientRect() : { left: innerWidth/2, top: 140, width: 0 };
  const cx = rect.left + rect.width/2, cy = rect.top + 20;
  const layer = document.createElement('div');
  layer.className = 'confetti';
  document.body.appendChild(layer);
  for(let i=0;i<28;i++){
    const c = document.createElement('div');
    c.textContent = ['🎉','✨','🪙','🎊','🔥'][Math.floor(Math.random()*5)];
    c.style.cssText = `position:absolute; left:${cx}px; top:${cy}px; font-size:${14+Math.random()*14}px;`;
    layer.appendChild(c);
    const ang = Math.random()*Math.PI*2;
    const dist = 70 + Math.random()*140;
    gsap.set(c, { xPercent:-50, yPercent:-50, opacity:1 });
    gsap.to(c, { x: Math.cos(ang)*dist, y: Math.sin(ang)*dist - 30, rotate: Math.random()*360, duration: 0.9+Math.random()*0.5, ease:'power1.out' });
    gsap.to(c, { opacity:0, duration:0.6, delay:0.5 });
  }
  setTimeout(()=>layer.remove(), 1700);
}

function celebrateGameRound(g){
  const cur = g.current;
  if(!cur) return;
  let winnerNames = [], key = null;
  if(cur.phase === 'results'){
    key = `r${g.round}-${cur.type}`;
    const ids = cur.type === 'quiplash' ? (cur.winnerIds||[]) : (cur.correctGuessers||[]);
    winnerNames = ids.map(id=>state.members.find(m=>m.id===id)).filter(Boolean).map(m=>m.name);
  } else if(cur.type === 'gameover'){
    key = 'gameover';
    winnerNames = (cur.winnerIds||[]).map(id=>state.members.find(m=>m.id===id)).filter(Boolean).map(m=>m.name);
  }
  if(!winnerNames.length || key === lastCelebratedKey) return;
  lastCelebratedKey = key;
  const card = document.getElementById('gameCard') || document.getElementById('gameoverReveal');
  fireConfetti(card);
  if(cur.type === 'gameover'){
    toast(`👑 ${winnerNames.join(' & ')} vandt hele spillet! Hån frit resten af aftenen.`);
    const winnerNameEl = document.getElementById('gameoverWinnerName');
    if(winnerNameEl) winnerNameEl.classList.add('gameover-winner-pop');
    const loserNameEl = document.getElementById('gameoverLoserName');
    if(loserNameEl) loserNameEl.classList.add('gameover-loser-shake');
    const loserEmojiEl = document.getElementById('gameoverLoserEmoji');
    if(loserEmojiEl) loserEmojiEl.classList.add('gameover-loser-droop');
  }else{
    toast(randomTaunt(winnerNames.join(' & ')));
  }
}

function playRoundCountdown(){
  const el = document.createElement('div');
  el.className = 'game-countdown';
  el.innerHTML = `<div class="game-countdown-num">3</div>`;
  document.body.appendChild(el);
  const numEl = el.querySelector('.game-countdown-num');
  const steps = ['3','2','1'];
  let i = 0;
  const tick = ()=>{
    numEl.textContent = steps[i];
    if(typeof gsap !== 'undefined'){
      gsap.fromTo(numEl, { scale:.4, opacity:0 }, { scale:1, opacity:1, duration:.3, ease:'back.out(2)' });
      gsap.to(numEl, { opacity:0, duration:.2, delay:.6 });
    }
    i++;
    if(i < steps.length) setTimeout(tick, 850);
    else setTimeout(()=>el.remove(), 900);
  };
  tick();
}

function renderGameScreen(){
  // Mens en Chancen-afsløring (hjul eller whack-a-mole) reelt spiller af,
  // må intet gen-render røre DOM'en — heller ikke fordi en ANDEN spiller
  // trykkede "klar" og dermed reelt ændrede server-staten. Sådan et
  // gen-render erstatter HELE main-DOM'en, hvilket ødelægger den igangværende
  // CSS-transition midt i spinnet/elimineringen og fik det til at se ud som
  // om det bare hoppede direkte til facit på under et sekund. Genoptages af
  // sig selv når afsløringen er færdig — se playWheelChanceReveal/
  // playMoleChanceReveal's onDone, som nulstiller låsen.
  if(revealAnimationLock) return;
  const g = state.game || { active:false };
  if(g.active && !g.players) g.players = state.members.map(m=>m.id); // forsvar mod ældre spil-state uden players-feltet
  if(g.active && g.current && (g.current.phase === 'answer' || g.current.phase === 'write') && g.round !== lastCountdownRound){
    lastCountdownRound = g.round;
    playRoundCountdown();
  }
  app.innerHTML = `
    <header class="theme-spil">
      <div class="title" style="font-size:30px; display:flex; align-items:center; justify-content:space-between; gap:8px;">
        <span>Brok<span>spillet</span> 👉</span>
        <button id="btnAppMenu" title="Menu" style="width:32px; height:32px; padding:0; display:flex; align-items:center; justify-content:center; font-size:16px; background:rgba(255,247,232,0.08); border:1px solid rgba(255,247,232,0.15); color:rgba(255,247,232,0.85); border-radius:100px; flex:0 0 auto;">☰</button>
      </div>
    </header>
    <main id="main" style="padding:0 16px 40px;">${gameBodyHtml(g)}</main>
  `;
  document.getElementById('btnAppMenu').onclick = openAppMenuSheet;
  bindGameHandlers(g);
  const card = document.getElementById('gameCard') || document.getElementById('gameoverReveal');
  // Kun afspil kort-animationen OG genstarte nedtællingen når runde/fase
  // RENT FAKTISK skifter — ellers sker begge dele ved hvert stille poll (fx
  // når en anden spiller svarer), hvilket så ud som flimren og fik uret til
  // at hoppe tilbage til fuld tid igen og igen i stedet for at tælle ned.
  const animKey = g.active && g.current ? (g.round + ':' + g.current.type + ':' + g.current.phase) : 'lobby';
  const isNewGamePhase = animKey !== lastAnimatedGameKey;
  lastAnimatedGameKey = animKey;
  if(card && typeof gsap !== 'undefined' && isNewGamePhase){
    gsap.fromTo(card, { opacity:0, y:14, scale:.97 }, { opacity:1, y:0, scale:1, duration:.45, ease:'power2.out' });
  }
  const complaintKey = g.active && g.current && g.current.complaint ? (animKey + ':' + g.current.complaint.startedAt) : null;
  if(complaintKey !== lastComplaintKey){
    lastComplaintKey = complaintKey;
    startComplaintCountdown(g.current);
  }
  celebrateGameRound(g);
  if(isNewGamePhase && g.current && g.current.type === 'quiplash' && g.current.phase === 'results' && g.current.randomPick){
    playMoleChanceReveal('chance');
  }
  if(isNewGamePhase && g.current && g.current.type === 'casinobrok' && g.current.phase === 'results'){
    scheduleWheelChanceReveal('chance', g.current.phaseStartedAt);
  }
}

const SLOT_REEL_H = 58;
// Bygger selve spillemaskine-markup'et — samme .slot-cabinet/.slot-window/
// .reel-design som Brokkekassens daglige "dagens gratis brok"-lodtrækning,
// nu genbrugt til Chancen. Reelernes fyld-symboler er tilfældige hver gang
// denne kaldes (harmløst — de ruller ud af syne uanset), men SIDSTE symbol
// på hver reel er altid vinderen, og strip'en er som DEFAULT allerede
// transformeret til den landede position. Det betyder et helt almindeligt
// gen-render (fx fordi en anden spiller trykker "klar" mens man kigger på
// resultatet) viser den korrekte, landede tilstand med det samme — kun den
// FØRSTE visning kører den egentlige spin-animation (se playSlotChanceReveal).
function buildSlotCabinetHtml(prefix, candidates, winner, bannerText){
  if(!winner || !candidates.length) return '';
  function buildStrip(){
    const n = 10 + Math.floor(Math.random()*4);
    const syms = [];
    for(let i=0;i<n;i++) syms.push(candidates[Math.floor(Math.random()*candidates.length)]);
    syms.push(winner);
    return syms;
  }
  const reels = [buildStrip(), buildStrip(), buildStrip()];
  const reelsHtml = reels.map((syms,ri)=>`
    <div class="reel"><div class="reel-strip" id="${prefix}ReelStrip${ri}" style="transform:translateY(-${(syms.length-1)*SLOT_REEL_H}px);">
      ${syms.map(m=>`<div class="reel-symbol"><div class="avatar">${initials(m?m.name:'?')}</div></div>`).join('')}
    </div></div>
  `).join('');
  return `
    <div style="text-align:center;">
      <div class="slot-banner">${bannerText}</div>
      <div class="slot-cabinet win" id="${prefix}Cabinet">
        <div class="slot-window">${reelsHtml}</div>
        <div class="slot-winner-name" id="${prefix}WinnerName" style="opacity:1;">${escapeHtml(winner.name)} vandt! 🍀</div>
      </div>
    </div>
  `;
}

// Spiller selve spin-animationen for et allerede-renderet spillemaskine-kort
// (bygget af buildSlotCabinetHtml) — "unsettler" hjulene til top og lader
// dem rulle ned til den position markup'et allerede sagde de skulle lande
// på. Kører kun én gang pr. ny resultat-fase, styret af isNewGamePhase i
// renderGameScreen — den bagvedliggende vinder er allerede afgjort
// server-side, dette er ren visuel spænding, ikke selve afgørelsen.
function playSlotChanceReveal(prefix){
  const cabinet = document.getElementById(prefix+'Cabinet');
  if(!cabinet) return;
  cabinet.classList.remove('win');
  const nameEl = document.getElementById(prefix+'WinnerName');
  if(nameEl) nameEl.style.opacity = '0';
  const strips = [...cabinet.querySelectorAll('.reel-strip')];
  const durations = [1.0, 1.5, 2.1];
  let doneCount = 0;
  const onAllStopped = ()=>{
    cabinet.classList.add('win');
    if(nameEl){
      if(typeof gsap !== 'undefined') gsap.fromTo(nameEl, {opacity:0, y:6}, {opacity:1, y:0, duration:.4, ease:'power2.out'});
      else nameEl.style.opacity = '1';
    }
    fireConfetti(cabinet);
  };
  strips.forEach((strip, ri) => {
    const distance = strip.children.length ? (strip.children.length-1)*SLOT_REEL_H : 0;
    const duration = durations[ri] || 1.5;
    const finish = ()=>{ doneCount++; if(doneCount >= strips.length) onAllStopped(); };
    if(typeof gsap !== 'undefined'){
      gsap.fromTo(strip, { y: 0 }, { y: -distance, duration, ease: 'power3.out', onComplete: finish });
    }else{
      strip.style.transition = 'none';
      strip.style.transform = 'translateY(0)';
      requestAnimationFrame(()=>{
        strip.style.transition = `transform ${duration}s ease-out`;
        strip.style.transform = `translateY(-${distance}px)`;
      });
      setTimeout(finish, duration*1000);
    }
  });
}

// Chancens NUVÆRENDE standardvisning: et lykkehjul, opdelt i lige store
// stykker (ét pr. kandidat), der snurrer og lander med den server-afgjorte
// vinder under pilen. Samme "landet som default"-mønster som spillemaskinen
// ovenfor: restAngle er den vinkel hjulet SKAL stå i for at vinderen er
// under pilen, gemt som data-attribut, så et almindeligt gen-render (ingen
// animation) altid viser den korrekte, landede tilstand med det samme.
const WHEEL_COLORS = ['#FF6B4A','#FFC93C','#0B4F55','#137a7d','#E8A317','#8a5fb0'];
function wheelPolarPoint(cx, cy, r, angleDeg){
  const rad = angleDeg * Math.PI/180; // 0° = kl. 12 (toppen), stigende med uret
  return { x: cx + r*Math.sin(rad), y: cy - r*Math.cos(rad) };
}
// Vegas-lys rundt om hjulet — statiske pærer (roterer IKKE med hjulet, de
// sidder fast på kabinettet, som på en rigtig lykkehjul-maskine). Hver
// pære får sin egen animation-delay, ellers blinker de i takt og ser
// mekanisk ud i stedet for et rigtigt glimtende lyskæde-mønster.
function wheelLightsHtml(n){
  // Pixel-koordinater matcher .wheel-wrap's egen CSS-størrelse (205x205) —
  // ændres wrap'ens størrelse, skal cx/cy/r ændres tilsvarende, ellers
  // ryger lysene ud af position i forhold til selve hjulet.
  const cx = 102.5, cy = 102.5, r = 100;
  let html = '';
  for (let i = 0; i < n; i++) {
    const p = wheelPolarPoint(cx, cy, r, (360/n)*i);
    html += `<div class="wheel-bulb" style="left:${p.x.toFixed(1)}px; top:${p.y.toFixed(1)}px; animation-delay:${(i%4)*0.25}s;"></div>`;
  }
  return html;
}

function buildWheelChanceHtml(prefix, candidates, winner, bannerText, revealed){
  if(!winner || !candidates.length) return '';
  // revealed=false (kun brugt af Casinobrok, som venter til et fælles
  // tidspunkt før spinnet — se scheduleWheelChanceReveal): hjulets HVILE-
  // vinkel er nødt til at pege på vinderen med det samme (for at kunne stå
  // stille og korrekt ved senere gen-render), men selve AFSLØRINGEN
  // (glødende vinder-stykke, guld-kabinet, navnet) holdes skjult indtil
  // det planlagte tidspunkt — ellers ville folk kunne se svaret i samme
  // øjeblik skærmen åbnes, længe før hjulet overhovedet begynder at snurre.
  if(revealed === undefined) revealed = true;
  // Med kun 2-3 rigtige kandidater ser hjulet kedeligt/mønt-kast-agtigt ud
  // delt i 2-3 store stykker. Gentager kandidaterne til mindst 6 SYNLIGE
  // stykker i stedet — ændrer IKKE de reelle odds, hver kandidat får stadig
  // nøjagtig samme SAMLEDE andel af hjulet, bare fordelt på flere mindre
  // stykker i stedet for én stor kile.
  const MIN_SLICES = 6;
  const repeats = Math.max(1, Math.ceil(MIN_SLICES / candidates.length));
  const visual = [];
  for (let rep = 0; rep < repeats; rep++) visual.push(...candidates);
  const n = visual.length;
  const sliceDeg = 360/n;
  const cx = 110, cy = 110, r = 104;
  // Altid FØRSTE forekomst af vinderen — deterministisk, ikke tilfældig ved
  // hvert render, ellers ville "landet som default"-tilstanden (se
  // playWheelChanceReveal) hoppe til et andet stykke ved hvert stille poll.
  const winnerIdx = Math.max(0, visual.findIndex(c=>c.id===winner.id));
  const midWinner = winnerIdx*sliceDeg + sliceDeg/2;
  // Vinklen hjulet skal roteres til for at vinderens midte lander under
  // pilen (som sidder fast kl. 12, dvs. 0°) — se playWheelChanceReveal.
  const restAngle = ((-midWinner) % 360 + 360) % 360;
  const slicesHtml = visual.map((c,i)=>{
    const start = i*sliceDeg, end = (i+1)*sliceDeg;
    const color = WHEEL_COLORS[i % WHEEL_COLORS.length];
    const p1 = wheelPolarPoint(cx,cy,r,start), p2 = wheelPolarPoint(cx,cy,r,end);
    const largeArc = (end-start) > 180 ? 1 : 0;
    const path = `M${cx},${cy} L${p1.x.toFixed(2)},${p1.y.toFixed(2)} A${r},${r} 0 ${largeArc} 1 ${p2.x.toFixed(2)},${p2.y.toFixed(2)} Z`;
    return `<path d="${path}" fill="${color}" class="wheel-slice${(i===winnerIdx&&revealed)?' wheel-slice-win':''}" stroke="#052024" stroke-width="2"></path>`;
  }).join('');
  const labelsHtml = visual.map((c,i)=>{
    const mid = i*sliceDeg + sliceDeg/2;
    const p = wheelPolarPoint(cx, cy, r*0.62, mid);
    // Kandidater med et eget `.label` (fx et brok-ord) viser den tekst,
    // trunkeret så den kan være på en lille cirkel — ellers falder den
    // tilbage til navne-initialer (den oprindelige brug: en person direkte).
    // Ordet er selve pointen med at kigge på hjulet under en Casinobrok-
    // reveal (modsat initialer, som bare er dekorativ identifikation) — så
    // det skal være markant større/tydeligere, ikke bare passe ind i en
    // lille cirkel. Vigtigt på mobil, hvor hjulet i forvejen er lille.
    const text = c.label ? (c.label.length > 9 ? c.label.slice(0,8)+'…' : c.label) : initials(c.name);
    const labelR = c.label ? 27 : 17;
    const fontSize = c.label ? 13.5 : 14;
    return `<g transform="translate(${p.x.toFixed(2)},${p.y.toFixed(2)})">
      <circle r="${labelR}" fill="rgba(5,32,36,0.55)"></circle>
      <text text-anchor="middle" dominant-baseline="central" font-family="'Baloo 2',sans-serif" font-weight="800" font-size="${fontSize}" fill="#FFF7E8">${escapeHtml(text)}</text>
    </g>`;
  }).join('');
  return `
    <div style="text-align:center;">
      <div class="slot-banner">${bannerText}</div>
      <div class="wheel-cabinet${revealed?' win':''}" id="${prefix}Cabinet">
        <div class="wheel-pointer"></div>
        <div class="wheel-wrap">
          <div class="wheel-lights">${wheelLightsHtml(14)}</div>
          <svg id="${prefix}WheelSvg" class="wheel-svg" viewBox="0 0 220 220" style="transform:rotate(${restAngle}deg);" data-rest-angle="${restAngle}">
            ${slicesHtml}
            ${labelsHtml}
            <circle cx="110" cy="110" r="14" fill="#052024" stroke="${revealed ? WHEEL_COLORS[winnerIdx % WHEEL_COLORS.length] : '#8a6b1f'}" stroke-width="3"></circle>
          </svg>
        </div>
        <div class="slot-winner-name" id="${prefix}WinnerName" style="opacity:${revealed?1:0};">${escapeHtml(winner.name)} vandt! 🍀</div>
      </div>
    </div>
  `;
}

// Spiller selve spin-animationen for et allerede-renderet hjul (bygget af
// buildWheelChanceHtml) — starter hjulet ved 0° og lader det snurre flere
// hele omgange plus den vinkel markup'et allerede sagde det skulle lande
// på (data-rest-angle), så det ALTID lander præcis samme sted som den
// statiske, uanimerede visning. Kører kun én gang pr. ny resultat-fase.

// Hver klient opdager selv en ny resultat-fase på et LIDT forskelligt
// tidspunkt (afhængig af hvornår ens eget 3-sekunders poll lige rammer) —
// starter spinnet man med det samme, kan nogen nå at åbne skærmen efter
// den allerede er landet, og aldrig se selve snurret. I stedet planlægges
// spinnet til at starte på et FÆLLES tidspunkt, udregnet ud fra serverens
// egen cur.phaseStartedAt (som alle klienter allerede får med) — så alle
// telefoner regner sig frem til PRÆCIS samme starttidspunkt, uanset hvornår
// deres eget poll opdagede fasen. Er man allerede for sent på den (fx en
// telefon der lige er kommet tilbage), spilles det bare med det samme.
const WHEEL_REVEAL_DELAY_MS = 8000;
const WHEEL_SPIN_DURATION_MS = 6000; // ægte 5-7 sekunders spin, ikke et hop
function scheduleWheelChanceReveal(prefix, phaseStartedAt){
  clearTimeout(wheelRevealTimeout);
  const target = (phaseStartedAt || Date.now()) + WHEEL_REVEAL_DELAY_MS;
  const delay = Math.max(0, target - Date.now());
  wheelRevealTimeout = setTimeout(()=> playWheelChanceReveal(prefix), delay);
}

// Snurrer hjulet via en almindelig CSS `transition` på `transform`, IKKE
// via GSAP — GSAP's `rotate`-property på et rod-<svg>-element viste sig i
// praksis upålideligt på iOS Safari (nedtællingen/landingen virkede fint,
// men selve spinnet var usynligt — kun den statiske slut-tilstand blev
// vist). Almindelig `transform:rotate()` + `transition` er langt mere
// robust cross-browser, og er allerede den vej der fungerede i test.
function playWheelChanceReveal(prefix){
  const cabinet = document.getElementById(prefix+'Cabinet');
  if(!cabinet) return;
  revealAnimationLock = true; // se renderGameScreen — intet gen-render må afbryde spinnet
  cabinet.classList.remove('win');
  const nameEl = document.getElementById(prefix+'WinnerName');
  if(nameEl) nameEl.style.opacity = '0';
  const svg = document.getElementById(prefix+'WheelSvg');
  if(!svg){ revealAnimationLock = false; return; }
  const restAngle = parseFloat(svg.dataset.restAngle || '0');
  const spins = 8; // flere omgange for at fylde de fulde 6 sekunder ordentligt ud, ikke bare rotere hurtigt forbi
  const finalAngle = restAngle + 360*spins;
  const onDone = ()=>{
    cabinet.classList.add('win');
    if(nameEl){
      if(typeof gsap !== 'undefined') gsap.fromTo(nameEl, {opacity:0, y:6}, {opacity:1, y:0, duration:.4, ease:'power2.out'});
      else nameEl.style.opacity = '1';
    }
    fireConfetti(cabinet);
    revealAnimationLock = false; // gen-render må nu godt køre igen (fx en anden spillers "klar"-tryk imens vi ventede)
  };
  svg.style.transition = 'none';
  svg.style.transform = 'rotate(0deg)';
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      svg.style.transition = `transform ${WHEEL_SPIN_DURATION_MS/1000}s cubic-bezier(.16,.84,.28,1)`;
      svg.style.transform = `rotate(${finalAngle}deg)`;
    });
  });
  setTimeout(onDone, WHEEL_SPIN_DURATION_MS);
}

// Chancens standard-visning ved uafgjort/2-spiller-skip: whack-a-mole. Ren
// tilfældig elimination, ingen valg involveret — matcher hvad Chancen
// FAKTISK er lige nu (se CSS-kommentaren ovenfor). Vinderens muldvarp er
// markeret med data-winner, så JS'en kan finde den uanset klasse-ændringer
// undervejs. Samme "landet som default"-mønster som hjul/spillemaskine:
// markup'et viser allerede den endelige tilstand (taberne nede, vinderen
// oppe og fejrer), så et almindeligt gen-render ikke nulstiller visningen.
function buildMoleChanceHtml(prefix, candidates, winner, bannerText){
  if(!winner || !candidates.length) return '';
  const holes = candidates.map(c=>{
    const isWin = c.id === winner.id;
    // Kandidater med et eget `.label` (fx quiplash-svaret bag hver mole)
    // viser en kort smagsprøve under hullet — kun en teaser, ikke fuld
    // læsbarhed, for med 4+ moles er der ikke plads til mere end få tegn.
    // Den fulde tekst står allerede i listen under hele reveal'en.
    const caption = c.label ? (c.label.length > 11 ? c.label.slice(0,10)+'…' : c.label) : '';
    return `
      <div class="mole-hole-wrap">
        <div class="mole-hole"><div class="mole ${isWin?'mole-up mole-win':'mole-down'}" data-mole-id="${c.id}" ${isWin?'data-winner="1"':''}><div class="avatar">${initials(c.name)}</div></div></div>
        ${caption ? `<div class="mole-caption">"${escapeHtml(caption)}"</div>` : ''}
      </div>`;
  }).join('');
  return `
    <div style="text-align:center;">
      <div class="slot-banner">${bannerText}</div>
      <div class="mole-cabinet win" id="${prefix}Cabinet">
        <div class="mole-grid" id="${prefix}MoleGrid">${holes}</div>
        <div class="slot-winner-name" id="${prefix}WinnerName" style="opacity:1;">${escapeHtml(winner.name)} vandt! 🍀</div>
      </div>
    </div>
  `;
}

// Spiller elimination-animationen: alle popper op, så bankes taberne ned
// én ad gangen i tilfældig rækkefølge (rent visuel spænding — vinderen er
// allerede afgjort server-side), til kun vinderens muldvarp står tilbage
// og fejrer. Kører kun én gang pr. ny resultat-fase.
// Fast total varighed på ~6 sekunder UANSET hvor mange kandidater der er —
// med kun 1 taber ville den gamle version være færdig på under et sekund
// (én hurtig bank, ingen reel spænding). Nu er der altid en ordentlig
// optakt før den første bankes ned, og en kort pause før vinderen fejrer,
// så det føles som en rigtig afsløring uanset gruppestørrelse.
const MOLE_PREROLL_MS = 2200;
const MOLE_KNOCK_BUDGET_MS = 2600;
const MOLE_POST_PAUSE_MS = 1200;
function playMoleChanceReveal(prefix){
  const cabinet = document.getElementById(prefix+'Cabinet');
  if(!cabinet) return;
  revealAnimationLock = true; // se renderGameScreen — intet gen-render må afbryde elimineringen
  cabinet.classList.remove('win');
  const nameEl = document.getElementById(prefix+'WinnerName');
  if(nameEl) nameEl.style.opacity = '0';
  const moles = [...cabinet.querySelectorAll('.mole')];
  if(!moles.length){ revealAnimationLock = false; return; }
  const winnerMole = moles.find(m => m.dataset.winner === '1');
  const losers = moles.filter(m => m.dataset.winner !== '1');
  moles.forEach(m => { m.classList.remove('mole-down', 'mole-win'); m.classList.add('mole-up'); });
  const order = losers.slice().sort(() => Math.random() - 0.5);
  const perKnockDelay = order.length ? Math.max(450, MOLE_KNOCK_BUDGET_MS / order.length) : 0;
  let i = 0;
  const finish = () => {
    cabinet.classList.add('win');
    if(winnerMole) winnerMole.classList.add('mole-win');
    if(nameEl){
      if(typeof gsap !== 'undefined') gsap.fromTo(nameEl, {opacity:0, y:6}, {opacity:1, y:0, duration:.4, ease:'power2.out'});
      else nameEl.style.opacity = '1';
    }
    fireConfetti(cabinet);
    revealAnimationLock = false; // gen-render må nu godt køre igen
  };
  const whackNext = () => {
    if(i < order.length){
      order[i].classList.remove('mole-up');
      order[i].classList.add('mole-down');
      i++;
      setTimeout(whackNext, perKnockDelay);
    }else{
      setTimeout(finish, MOLE_POST_PAUSE_MS);
    }
  };
  setTimeout(whackNext, MOLE_PREROLL_MS);
}

function gameBodyHtml(g){
  if(!g.active || !g.current) return gameLobbyHtml();
  const cur = g.current;
  if(cur.type !== 'gameover' && profile && g.players && !g.players.includes(profile.memberId)){
    return `
      <div class="game-badge">Runde ${g.round}/${g.totalRounds} · 👀 Du kigger med</div>
      <div class="empty-state"><span class="emoji">🍿</span><b>Du er ikke med i denne omgang</b>De andre spiller videre — du er velkommen næste spil.</div>
    `;
  }
  if(cur.type === 'gameover') return gameOverHtml(g, cur);
  if(cur.type === 'quiplash') return quiplashHtml(g, cur);
  if(cur.type === 'truefalse') return truefalseHtml(g, cur);
  if(cur.type === 'trivia') return triviaHtml(g, cur);
  if(cur.type === 'guessbrok') return guessBrokHtml(g, cur);
  if(cur.type === 'casinobrok') return casinobrokHtml(g, cur);
  return '';
}

function gameHighscoreHtml(){
  const stats = state.gameStats || {};
  const ranked = state.members
    .filter(m => stats[m.id] && stats[m.id].played > 0)
    .sort((a,b) => (stats[b.id].wins - stats[a.id].wins) || (stats[b.id].played - stats[a.id].played));
  if(!ranked.length) return '';
  const rows = ranked.map((m,i)=>`
    <div class="bal-row">
      <div class="avatar" style="width:34px;height:34px;font-size:12.5px;">${i===0?'🏆':(i+1)}</div>
      <div class="feed-body"><div class="bal-name">${escapeHtml(m.name)}</div><div style="font-size:12px; color:rgba(255,247,232,0.68);">${stats[m.id].played} spillet</div></div>
      <div class="bal-amt">${stats[m.id].wins} sejre</div>
    </div>
  `).join('');
  return `<div class="section-label">🏆 Highscore</div>${rows}`;
}

function gameProgressHtml(count, total, label){
  const pct = total ? Math.min(100, Math.round((count/total)*100)) : 0;
  return `<div class="game-progress"><span>${count}/${total} ${label}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div></div>`;
}

// Bruges i resultat-pausen mellem runder — hver spiller trykker selv "klar"
// i stedet for at én person kan tvinge alle videre; runden skifter først
// når alle har trykket (eller nedtællingen løber ud som nødbremse).
function gameReadyHtml(g, cur){
  const already = profile && (cur.readyIds||[]).includes(profile.memberId);
  const readyCount = (cur.readyIds||[]).length;
  return `
    ${gameProgressHtml(readyCount, g.players.length, 'er klar')}
    ${already
      ? `<div class="waiting-pill"><span class="waiting-dot"></span> Venter på de andre...</div>`
      : `<button class="game-btn" id="readyBtn">✅ Klar til næste runde</button>`}
    ${complaintBlockHtml(g, cur)}
  `;
}

function gameLobbyHtml(){
  const allIds = state.members.map(m=>m.id);
  if(!gameSelectedPlayers || !gameKnownMemberIds){
    gameSelectedPlayers = allIds.slice();
  }else{
    const newcomers = allIds.filter(id=>!gameKnownMemberIds.includes(id));
    // Fjerner ID'er på medlemmer der ikke længere er i rummet — ellers
    // tæller "Start spillet (X spillere)"-knappen dem stadig med, så den
    // ser aktiv/nok ud selvom kun de RESTERENDE, faktiske medlemmer er for
    // få, og serveren afviser starten et øjeblik efter med "vælg mindst..."
    gameSelectedPlayers = [...gameSelectedPlayers.filter(id=>allIds.includes(id)), ...newcomers];
  }
  gameKnownMemberIds = allIds.slice();
  const chips = state.members.map(m=>{
    const on = gameSelectedPlayers.includes(m.id);
    return `<div class="name-pill ${on?'selected':''}" data-player="${m.id}" style="${on?'':'opacity:.5;'}">${on?'✅':'➖'} ${escapeHtml(m.name)}</div>`;
  }).join('');
  const enough = gameSelectedPlayers.length >= 2;
  const gameSteps = [
    ['🎭', 'Skriv-og-stem: alle skriver et sjovt svar, så stemmer I på det bedste'],
    ['⚖️', 'Sandt/falsk: én skriver et udsagn om en anden — resten gætter'],
    ['🎯', 'Hvilket brok? Én skriver et RIGTIGT brok blandt 3 opdigtede — resten gætter hvilket der er ægte'],
    ['🔍', 'Trivia om jeres egen brok-historik (og lidt verdens-brok ind imellem)'],
    ['🎰', 'Casinobrok: alle skriver ét brok-ord, og hjulet trækker lod om hvis ord der vinder'],
    ['🏆', 'Point tælles på tværs af alle runder — flest point vinder'],
  ];
  if(gameInstructionsOpen === null) gameInstructionsOpen = !localStorage.getItem('bk_game_seen_instructions');
  localStorage.setItem('bk_game_seen_instructions', '1');
  return `
    <div class="empty-state" style="padding-top:18px;">
      <span class="emoji">👉</span>
      <b>Brokspillet</b>
      Skriv, gæt og stem jer igennem jeres egen brok-historie.
    </div>
    <div class="game-card" style="margin:10px 0 10px;">
      <div id="gameInstructionsToggle" style="display:flex; align-items:center; justify-content:space-between; cursor:pointer; ${gameInstructionsOpen?'margin-bottom:8px;':''}">
        <label class="field-label" style="color:rgba(255,247,232,0.7); margin:0;">Sådan foregår det</label>
        <span style="color:rgba(255,247,232,0.5); font-size:13px; transition:transform .2s; display:inline-block; ${gameInstructionsOpen?'transform:rotate(180deg);':''}">⌄</span>
      </div>
      ${gameInstructionsOpen ? gameSteps.map(([icon,text])=>`
        <div style="display:flex; gap:10px; align-items:flex-start; margin-bottom:9px;">
          <span style="font-size:16px; line-height:1.4;">${icon}</span>
          <p style="margin:0; font-size:13px; line-height:1.4; color:rgba(255,247,232,0.8);">${text}</p>
        </div>
      `).join('') : ''}
    </div>
    <div class="game-card" style="margin:10px 0;">
      <label class="field-label" style="color:rgba(255,247,232,0.7);">Hvem er med? (mindst 2)</label>
      <div class="name-grid" id="playerGrid">${chips}</div>
      <label class="field-label" style="color:rgba(255,247,232,0.7);">Spil om</label>
      <div class="segmented" style="margin-bottom:14px;">
        <div class="seg ${gameWager!=='euro'?'active':''}" data-wager="fun">🏅 Æren</div>
        <div class="seg ${gameWager==='euro'?'active':''}" data-wager="euro">💶 1 euro i kassen</div>
      </div>
      <label class="field-label" style="color:rgba(255,247,232,0.7);">Antal runder</label>
      <div class="segmented" style="margin-bottom:0;">
        <div class="seg ${gameRounds===5?'active':''}" data-rounds="5">5</div>
        <div class="seg ${gameRounds===8?'active':''}" data-rounds="8">8</div>
        <div class="seg ${gameRounds===12?'active':''}" data-rounds="12">12</div>
      </div>
    </div>
    <button class="game-btn" id="startGameBtn" ${enough?'':'disabled'}>👉 Start spillet (${gameSelectedPlayers.length} spillere)</button>
    ${enough?'':'<p class="hint" style="text-align:center;">Vælg mindst 2 spillere</p>'}
    ${gameHighscoreHtml()}
  `;
}

function quiplashHtml(g, cur){
  if(cur.phase === 'answer'){
    const answered = Object.keys(cur.answers||{}).length;
    const mine = profile && cur.answers[profile.memberId];
    return `
      <div class="game-badge" style="display:flex; align-items:center; justify-content:space-between; gap:10px;"><span>Runde ${g.round}/${g.totalRounds} · 🎭 Skriv-og-stem</span><span id="gameTimer" style="font-size:16px; font-weight:800; opacity:1;"></span></div>
      <div class="game-card" id="gameCard">
        <p style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:19px; margin:0 0 14px; line-height:1.3;">${escapeHtml(cur.prompt)}</p>
        <textarea id="quipInput" rows="2" maxlength="120" placeholder="Dit svar..." ${mine?'disabled':''}>${mine?escapeHtml(mine):''}</textarea>
        ${mine ? '' : `<button class="game-btn" id="quipSubmitBtn" style="margin-top:10px;">🔒 Lås dit svar</button>`}
      </div>
      ${gameProgressHtml(answered, g.players.length, 'har svaret')}
      ${mine ? `<div class="waiting-pill"><span class="waiting-dot"></span> Venter på de andre...</div>` : ''}
      ${complaintBlockHtml(g, cur)}
    `;
  }
  if(cur.phase === 'vote'){
    const myId = profile && profile.memberId;
    const myAnswer = myId ? cur.answers[myId] : undefined;
    const others = Object.entries(cur.answers||{}).filter(([id])=>id!==myId).map(([id,text])=>({id,text}));
    const decoys = (cur.decoys||[]).map(d=>({id:d.id, text:d.text}));
    // Blander egne + opdigtede svar i én stabil (ikke gen-tilfældig ved
    // hvert poll) rækkefølge, så decoys ikke altid ligger sidst og dermed
    // stikker ud rent visuelt.
    const combined = [...others, ...decoys].sort((a,b)=> a.id < b.id ? -1 : (a.id > b.id ? 1 : 0));
    const myVote = profile && cur.votes[profile.memberId];
    const votedCount = Object.keys(cur.votes||{}).length;
    const rows = combined.map(({id,text},i)=>`
      <div class="bal-row${myVote?'':' game-pick'}" ${myVote?'':`data-vote-for="${id}"`} style="${myVote?'':'cursor:pointer;'} ${myVote===id?'outline:2px solid var(--coin);':''} ${myVote&&myVote!==id?'opacity:.5;':''}">
        <div class="avatar" style="width:34px;height:34px;font-size:12.5px; background:linear-gradient(160deg, var(--coin), var(--coin-dark)); color:var(--ink);">${i+1}</div>
        <div class="feed-body"><div class="bal-name">"${escapeHtml(text)}"</div></div>
        ${myVote===id?'<span style="font-size:18px;">✓</span>':''}
      </div>
    `).join('');
    return `
      <div class="game-badge" style="display:flex; align-items:center; justify-content:space-between; gap:10px;"><span>Runde ${g.round}/${g.totalRounds} · Stem på det bedste svar</span><span id="gameTimer" style="font-size:16px; font-weight:800; opacity:1;"></span></div>
      <p class="hint" style="margin:0 0 10px; color:rgba(255,247,232,0.75);">${escapeHtml(cur.prompt)}</p>

      ${myAnswer ? `<div class="bal-row" style="opacity:.45; cursor:default;">
        <div class="avatar" style="width:34px;height:34px;font-size:12.5px;">✍️</div>
        <div class="feed-body"><div class="bal-name" style="text-decoration:line-through;">"${escapeHtml(myAnswer)}"</div></div>
        <span style="font-size:11px; font-weight:700; opacity:.8;">din — kan ikke stemmes på</span>
      </div>` : ''}
      ${rows || '<p class="hint">Ingen andre svar at stemme på.</p>'}
      ${gameProgressHtml(votedCount, g.players.length, 'har stemt')}
      ${myVote ? `<div class="waiting-pill"><span class="waiting-dot"></span> Venter på de andre...</div>` : ''}
      ${complaintBlockHtml(g, cur)}
    `;
  }
  const decoyWon = (cur.winnerIds||[]).some(id=>id.indexOf('decoy')===0);
  const winners = decoyWon ? [] : (cur.winnerIds||[]).map(id=>state.members.find(m=>m.id===id)).filter(Boolean);
  const allEntries = [
    ...Object.entries(cur.answers||{}).map(([id,text])=>({id, text, name:(state.members.find(m=>m.id===id)||{}).name})),
    ...(cur.decoys||[]).map(d=>({id:d.id, text:d.text, name:null})),
  ];
  return `
    <div class="game-badge" style="display:flex; align-items:center; justify-content:space-between; gap:10px;"><span>Runde ${g.round}/${g.totalRounds} · Resultat</span><span id="gameTimer" style="font-size:16px; font-weight:800; opacity:1;"></span></div>
    <div class="game-card" id="gameCard" style="text-align:center;">
      <p style="margin:0 0 10px;">${escapeHtml(cur.prompt)}</p>
      ${cur.randomPick ? buildMoleChanceHtml('chance',
          (cur.chanceCandidates || Object.keys(cur.answers||{})).map(id=>{
            const mm = state.members.find(x=>x.id===id);
            return mm ? { id: mm.id, name: mm.name, label: (cur.answers||{})[id] } : null;
          }).filter(Boolean),
          state.members.find(m=>m.id===(cur.winnerIds||[])[0]),
          '🎲 CHANCEN AFGØR DET'
        ) : ''}
      ${allEntries.map(({id,text,name})=>{
        const won = (cur.winnerIds||[]).includes(id);
        const isDecoy = !name;
        return `<div class="feed-item${won && cur.randomPick ? ' quip-slot-win' : ''}" style="${won?'border-color:var(--coin); background:rgba(255,201,60,0.16);':''}">
          <div class="avatar">${isDecoy?'🎭':initials(name)}</div>
          <div class="feed-body"><div class="feed-name">${isDecoy?'Opdigtet svar — ingen skrev det':escapeHtml(name)} ${won?'🏆':''}</div><div class="feed-msg">"${escapeHtml(text)}"</div></div>
        </div>`;
      }).join('')}
      <p style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:17px; margin-top:12px; color:var(--coin);">${decoyWon ? '😏 I stemte på et opdigtet svar — ingen point denne gang!' : (winners.length ? '🏆 ' + winners.map(w=>escapeHtml(w.name)).join(' & ') + ' vandt runden!' : 'Ingen stemmer denne gang.')}</p>

}

function casinobrokHtml(g, cur){

    const written = Object.keys(cur.words||{}).length;
    return `
      <div class="game-badge" style="display:flex; align-items:center; justify-content:space-between; gap:10px;"><span>Runde ${g.round}/${g.totalRounds} · 🎰 Casinobrok</span><span id="gameTimer" style="font-size:16px; font-weight:800; opacity:1;"></span></div>

        ${mine ? '' : `<button class="game-btn" id="casinoSubmitBtn" style="margin-top:12px;">🎰 Send ordet</button>`}
      </div>
      ${gameProgressHtml(written, g.players.length, 'har skrevet')}
      ${mine ? `<div class="waiting-pill"><span class="waiting-dot"></span> Venter på de andre...</div>` : ''}
      ${complaintBlockHtml(g, cur)}
    `;
  }
  if(cur.phase === 'skipped'){
    return `
      <div class="game-badge">Runde ${g.round}/${g.totalRounds} · 🎰 Casinobrok</div>
      <div class="empty-state"><span class="emoji">😴</span><b>Ingen nåede at skrive et ord</b>Ingen sag denne gang — vi går videre til næste spørgsmål.</div>
      ${gameReadyHtml(g, cur)}
    `;
  }
  const candidates = Object.entries(cur.words||{}).map(([id,word])=>{
    const m = state.members.find(x=>x.id===id);
    return { id, name: m?m.name:'?', label: word };
  });
  const winner = candidates.find(c=>c.id===cur.winnerId);
  // Vinderen står allerede fast server-side, men må ikke AFSLØRES visuelt
  // (hverken på hjulet eller i listen herunder) før det planlagte fælles
  // spin-tidspunkt — ellers kan man se svaret længe før hjulet overhovedet
  // begynder at snurre. Se scheduleWheelChanceReveal.
  const revealed = !cur.phaseStartedAt || (Date.now() - cur.phaseStartedAt) >= WHEEL_REVEAL_DELAY_MS;
  return `
    <div class="game-badge" style="display:flex; align-items:center; justify-content:space-between; gap:10px;"><span>Runde ${g.round}/${g.totalRounds} · Resultat</span><span id="gameTimer" style="font-size:16px; font-weight:800; opacity:1;"></span></div>
    <div class="game-card" id="gameCard" style="text-align:center;">
      ${buildWheelChanceHtml('chance', candidates, winner, '🎰 CASINOBROK TRÆKKER LOD', revealed)}
      ${candidates.map(c=>{
        const won = revealed && c.id === cur.winnerId;
        return `<div class="feed-item${won?' quip-slot-win':''}" style="${won?'border-color:var(--coin); background:rgba(255,201,60,0.16);':''}">

          <div class="feed-body"><div class="feed-name">${escapeHtml(c.name)} ${won?'🏆':''}</div><div class="feed-msg">"${escapeHtml(c.label)}"</div></div>
        </div>`;
      }).join('')}
    </div>
    ${gameReadyHtml(g, cur)}
  `;
}

function gameOverHtml(g, cur){
  const ranked = state.members.filter(m=>g.players.includes(m.id)).sort((a,b)=>(cur.scores[b.id]||0)-(cur.scores[a.id]||0));
  const losers = (cur.loserIds||[]).map(id=>state.members.find(m=>m.id===id)).filter(Boolean);
  const winners = (cur.winnerIds||[]).map(id=>state.members.find(m=>m.id===id)).filter(Boolean);
  const rows = ranked.map((m,i)=>`
    <div class="bal-row">
      <div class="avatar" style="width:34px;height:34px;font-size:12.5px;">${i===0?'🏆':(i+1)}</div>
      <div class="feed-body"><div class="bal-name">${escapeHtml(m.name)}</div></div>
      <div class="bal-amt">${cur.scores[m.id]||0} point</div>
    </div>
  `).join('');
  return `
    <div class="game-badge">🎉 Spillet er slut!</div>
    ${rows}
    ${winners.length ? `<p class="hint" style="text-align:center; margin-top:10px; color:rgba(255,247,232,0.75);">👑 Vinder: <span id="gameoverWinnerName">${winners.map(m=>escapeHtml(m.name)).join(' & ')}</span></p>` : ''}
    <div class="game-card" id="gameoverReveal" style="text-align:center; margin-top:16px;">

      <p style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:19px; margin:6px 0;">Taberen er... <span id="gameoverLoserName">${losers.map(m=>escapeHtml(m.name)).join(' & ')}</span>!</p>
      ${g.wager==='euro' ? '<p class="hint" style="color:rgba(255,247,232,0.7);">1€ lagt i Brokkekassens pulje.</p>' : '<p class="hint" style="color:rgba(255,247,232,0.7);">Kun for sjov denne gang.</p>'}
    </div>
    ${gameHighscoreHtml()}
    <button class="game-btn" id="playAgainBtn" style="margin-top:16px;">👉 Spil igen</button>

  `;
}

function bindGameHandlers(g){
  const cur = g.current;
  const gameInstrToggle = document.getElementById('gameInstructionsToggle');
  if(gameInstrToggle) gameInstrToggle.onclick = ()=>{ gameInstructionsOpen = !gameInstructionsOpen; render(); };
  document.querySelectorAll('[data-wager]').forEach(el=>{
    el.onclick = ()=>{ gameWager = el.dataset.wager; render(); };
  });
  document.querySelectorAll('[data-rounds]').forEach(el=>{
    el.onclick = ()=>{ gameRounds = parseInt(el.dataset.rounds,10); render(); };
  });
  document.querySelectorAll('[data-player]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.player;
      if(gameSelectedPlayers.includes(id)) gameSelectedPlayers = gameSelectedPlayers.filter(x=>x!==id);
      else gameSelectedPlayers = [...gameSelectedPlayers, id];
      render();
    };
  });
  const startBtn = document.getElementById('startGameBtn');
  if(startBtn) startBtn.onclick = ()=> gameApi('start', { wager: gameWager, playerIds: gameSelectedPlayers, totalRounds: gameRounds });

  const readyBtn = document.getElementById('readyBtn');
  if(readyBtn) readyBtn.onclick = ()=> gameApi('ready', {});

  const complainBtn = document.getElementById('complainBtn');
  if(complainBtn) complainBtn.onclick = ()=> gameApi('complain', { payload: { targetId: complainBtn.dataset.target } });

  const playAgainBtn = document.getElementById('playAgainBtn');
  if(playAgainBtn) playAgainBtn.onclick = ()=>{
    gameApi('end', {}).then(()=> gameApi('start', { wager: gameWager, playerIds: gameSelectedPlayers, totalRounds: gameRounds }));
  };
  const endGameBtn = document.getElementById('endGameBtn');
  if(endGameBtn) endGameBtn.onclick = ()=> gameApi('end', {});

  if(!cur) return;

  if(cur.type === 'quiplash' && cur.phase === 'answer'){
    const btn = document.getElementById('quipSubmitBtn');
    if(btn) btn.onclick = ()=>{
      const text = document.getElementById('quipInput').value.trim();
      if(!text) return;
      lockSubmitBtn(btn, 'Låser svar...');
      gameApi('submit', { payload: { text } });
    };
  }
  if(cur.type === 'quiplash' && cur.phase === 'vote'){
    document.querySelectorAll('[data-vote-for]').forEach(el=>{
      el.onclick = ()=> gameApi('submit', { payload: { votedFor: el.dataset.voteFor } });
    });
  }
  if(cur.type === 'truefalse' && cur.phase === 'write' && profile && profile.memberId === cur.authorId){
    let chosenTarget = null; // skal vælges eksplicit — ingen forudvalgt person, så man aktivt tager stilling til hvem det handler om
    let chosenTruth = null; // skal vælges eksplicit — ingen forudvalgt "sandt", så man ikke sender ved et uheld uden at tage stilling
    const input = document.getElementById('ttStatement');
    const submitBtn = document.getElementById('ttSubmitBtn');
    const updateSubmitState = ()=>{ submitBtn.disabled = !input.value.trim() || chosenTruth === null || chosenTarget === null; };
    document.querySelectorAll('#ttTargetGrid .name-pill').forEach(p=>{
      p.onclick = ()=>{
        document.querySelectorAll('#ttTargetGrid .name-pill').forEach(x=>x.classList.remove('selected'));
        p.classList.add('selected'); chosenTarget = p.dataset.target;
        updateSubmitState();
      };
    });
    document.querySelectorAll('[data-truth]').forEach(seg=>{
      seg.onclick = ()=>{
        document.querySelectorAll('[data-truth]').forEach(x=>x.classList.remove('active'));
        seg.classList.add('active'); chosenTruth = seg.dataset.truth === 'true';
        updateSubmitState();
      };
    });
    input.addEventListener('input', updateSubmitState);
    submitBtn.onclick = ()=>{
      const statement = input.value.trim();
      if(!statement || chosenTruth === null || chosenTarget === null) return;
      lockSubmitBtn(submitBtn, 'Sender...');
      gameApi('submit', { payload: { targetId: chosenTarget, statement, isTrue: chosenTruth } });
    };
  }
  if(cur.type === 'truefalse' && cur.phase === 'guess' && profile && profile.memberId !== cur.authorId){
    document.querySelectorAll('[data-guess]').forEach(btn=>{
      btn.onclick = ()=> gameApi('submit', { payload: { guess: btn.dataset.guess === 'true' } });
    });
  }
  if(cur.type === 'trivia' && cur.phase === 'answer'){
    document.querySelectorAll('[data-choice]').forEach(el=>{
      el.onclick = ()=> gameApi('submit', { payload: { choiceIndex: parseInt(el.dataset.choice,10) } });
    });
  }
  if(cur.type === 'guessbrok' && cur.phase === 'write' && profile && profile.memberId === cur.authorId){
    const input = document.getElementById('gbStatement');
    const submitBtn = document.getElementById('gbSubmitBtn');
    const updateSubmitState = ()=>{ submitBtn.disabled = !input.value.trim(); };
    input.addEventListener('input', updateSubmitState);
    submitBtn.onclick = ()=>{
      const statement = input.value.trim();
      if(!statement) return;
      lockSubmitBtn(submitBtn, 'Sender...');
      gameApi('submit', { payload: { statement } });
    };
  }
  if(cur.type === 'guessbrok' && cur.phase === 'guess' && profile && profile.memberId !== cur.authorId){
    document.querySelectorAll('[data-choice]').forEach(el=>{
      el.onclick = ()=> gameApi('submit', { payload: { choiceIndex: parseInt(el.dataset.choice,10) } });
    });
  }
  if(cur.type === 'casinobrok' && cur.phase === 'write'){
    const wordInput = document.getElementById('casinoWordInput');
    // Ét ord betyder ét ord — fjerner mellemrum mens man skriver, i stedet
    // for bare at bede pænt om det og håbe det bliver overholdt.
    if(wordInput) wordInput.addEventListener('input', ()=>{
      const stripped = wordInput.value.replace(/\s+/g, '');
      if(stripped !== wordInput.value) wordInput.value = stripped;
    });
    const btn = document.getElementById('casinoSubmitBtn');
    if(btn) btn.onclick = ()=>{
      const word = document.getElementById('casinoWordInput').value.replace(/\s+/g, '').trim();
      if(!word) return;
      lockSubmitBtn(btn, 'Sender...');
      gameApi('submit', { payload: { word } });
    };
  }
}

// Nedtælling pr. fase — samme nødbremse-filosofi som Brokspillet: ingen kan
// blokere resten af rummet ved bare at sidde stille.
const MRBROK_PHASE_SECONDS = { 'turn:ask': 30, 'turn:answer': 30, 'guess:guess': 25, 'steal:guessing': 30, 'steal:voting': 25 };
function mrbrokTimerKey(cur){
  if(cur.type === 'steal') return 'steal:' + (cur.guess ? 'voting' : 'guessing');
  if(cur.type === 'turn') return 'turn:' + cur.phase;
  if(cur.type === 'guess') return 'guess:guess';
  return null;
}
function paintMrbrokTimerNow(){
  // Samme flimmer-fix som paintGameTimerNow(): mal den friske #mrbrokTimer-
  // node med det samme efter et stille poll, i stedet for at lade den stå
  // tom indtil den gamle intervals næste tick (op til 1 sekund senere).
  if(!mrbrokTimerDeadline) return;
  const el = document.getElementById('mrbrokTimer');
  if(!el) return;
  const left = Math.max(0, Math.ceil((mrbrokTimerDeadline - Date.now())/1000));
  el.textContent = '⏱️ ' + left + 's';
  el.style.color = left <= 10 ? '#FFD9CC' : '';
  el.classList.toggle('game-timer-urgent', left <= 10 && left > 0);
}
function startMrbrokTimer(cur){
  clearInterval(mrbrokTimerInterval);
  mrbrokTimerInterval = null;
  if(!cur || cur.type === 'gameover') return;
  const key = mrbrokTimerKey(cur);
  const secs = key ? MRBROK_PHASE_SECONDS[key] : null;
  if(!secs){ mrbrokTimerDeadline = null; return; }
  mrbrokTimerDeadline = Date.now() + secs*1000;
  const tick = ()=>{
    const el = document.getElementById('mrbrokTimer');
    const left = Math.max(0, Math.ceil((mrbrokTimerDeadline - Date.now())/1000));
    if(el){
      el.textContent = '⏱️ ' + left + 's';
      el.style.color = left <= 10 ? '#FFD9CC' : '';
      el.classList.toggle('game-timer-urgent', left <= 10 && left > 0);
    }
    if(left <= 0){
      clearInterval(mrbrokTimerInterval);
      mrbrokTimerInterval = null;
      mrbrokApi('advance', {});
    }
  };
  tick();
  mrbrokTimerInterval = setInterval(tick, 1000);
}

function renderMrbrokScreen(){
  const m = state.mrbrok || { active:false };
  app.innerHTML = `
    <header class="theme-mrbrok">
      <div class="title" style="font-size:30px; display:flex; align-items:center; justify-content:space-between; gap:8px;">
        <span>Mr<span>Brok</span> 🕵️</span>
        <button id="btnAppMenu" title="Menu" style="width:32px; height:32px; padding:0; display:flex; align-items:center; justify-content:center; font-size:16px; background:rgba(255,247,232,0.08); border:1px solid rgba(255,247,232,0.15); color:rgba(255,247,232,0.85); border-radius:100px; flex:0 0 auto;">☰</button>
      </div>
    </header>
    <main id="main" style="padding:0 16px 40px;">${mrbrokBodyHtml(m)}</main>
  `;
  document.getElementById('btnAppMenu').onclick = openAppMenuSheet;
  bindMrbrokHandlers(m);
  const card = document.getElementById('mrbrokCard') || document.getElementById('mrbrokReveal');
  // Samme fix som Brokspillet: kun animér/genstart nedtællingen ved et
  // rigtigt fase-skift, ikke ved hvert stille poll — ellers flimrer kortet
  // og uret hopper tilbage til fuld tid hver gang en anden spiller reagerer.
  const mrbrokAnimKey = m.active && m.current ? (m.round + ':' + mrbrokTimerKey(m.current)) : 'lobby';
  const isNewMrbrokPhase = mrbrokAnimKey !== lastAnimatedMrbrokKey;
  lastAnimatedMrbrokKey = mrbrokAnimKey;
  if(card && typeof gsap !== 'undefined' && isNewMrbrokPhase){
    gsap.fromTo(card, { opacity:0, y:14, scale:.97 }, { opacity:1, y:0, scale:1, duration:.45, ease:'power2.out' });
  }
  if(m.active && profile && m.players && m.players.includes(profile.memberId)){
    if(isNewMrbrokPhase || !mrbrokTimerInterval) startMrbrokTimer(m.current);
    else paintMrbrokTimerNow();
  }else{
    clearInterval(mrbrokTimerInterval);
    mrbrokTimerInterval = null;
  }
}

function mrbrokBodyHtml(m){
  if(!m.active || !m.current) return mrbrokLobbyHtml();
  const cur = m.current;
  if(cur.type !== 'gameover' && profile && m.players && !m.players.includes(profile.memberId)){
    return `
      <div class="game-badge">Runde ${m.round}/${m.totalRounds} · 👀 Du kigger med</div>
      <div class="empty-state"><span class="emoji">🍿</span><b>Du er ikke med i denne omgang</b>De andre spiller videre — du er velkommen næste spil.</div>
    `;
  }
  if(cur.type === 'gameover') return mrbrokOverHtml(m, cur);
  if(cur.type === 'turn') return mrbrokTurnHtml(m, cur);
  if(cur.type === 'guess') return mrbrokGuessHtml(m, cur);
  if(cur.type === 'steal') return mrbrokStealHtml(m, cur);
  return '';
}

  const ranked = state.members
    .filter(mm => stats[mm.id] && stats[mm.id].played > 0)
    .sort((a,b) => (stats[b.id].wins - stats[a.id].wins) || (stats[b.id].played - stats[a.id].played));
  if(!ranked.length) return '';
  const rows = ranked.map((mm,i)=>`
    <div class="bal-row">
      <div class="avatar" style="width:34px;height:34px;font-size:12.5px;">${i===0?'🏆':(i+1)}</div>
      <div class="feed-body"><div class="bal-name">${escapeHtml(mm.name)}</div><div style="font-size:12px; color:rgba(255,247,232,0.68);">${stats[mm.id].played} spillet</div></div>
      <div class="bal-amt">${stats[mm.id].wins} sejre</div>
    </div>
  `).join('');
  return `<div class="section-label">🏆 Highscore</div>${rows}`;
}

function mrbrokLobbyHtml(){
  const allIds = state.members.map(mm=>mm.id);
  if(!mrbrokSelectedPlayers || !mrbrokKnownMemberIds){
    mrbrokSelectedPlayers = allIds.slice();

    const newcomers = allIds.filter(id=>!mrbrokKnownMemberIds.includes(id));
    // Samme fix som Brokspillet: fjern ID'er på medlemmer der ikke længere
    // er i rummet, så "Start MrBrok (X spillere)"-knappen matcher hvad der
    // faktisk kan startes med, i stedet for at tælle spøgelses-medlemmer med.
    mrbrokSelectedPlayers = [...mrbrokSelectedPlayers.filter(id=>allIds.includes(id)), ...newcomers];
  }
  mrbrokKnownMemberIds = allIds.slice();
  const chips = state.members.map(mm=>{
    const on = mrbrokSelectedPlayers.includes(mm.id);
    return `<div class="name-pill ${on?'selected':''}" data-mrbrok-player="${mm.id}" style="${on?'':'opacity:.5;'}">${on?'✅':'➖'} ${escapeHtml(mm.name)}</div>`;

    ['🤫', 'Alle undtagen én kender det samme brok-emne'],

    <div class="empty-state" style="padding-top:18px;">
      <span class="emoji">🕵️</span>
      <b>MrBrok</b>
      Find ud af hvem der bluffer — inden de gennemskuer jer.
    </div>
    <div class="game-card" style="margin:10px 0 10px;">
      <div id="mrbrokInstructionsToggle" style="display:flex; align-items:center; justify-content:space-between; cursor:pointer; ${mrbrokInstructionsOpen?'margin-bottom:8px;':''}">

      </div>
      ${mrbrokInstructionsOpen ? steps.map(([icon,text])=>`
        <div style="display:flex; gap:10px; align-items:flex-start; margin-bottom:9px;">

      <label class="field-label" style="color:rgba(255,247,232,0.7);">Hvem er med? (mindst 3)</label>
      <div class="name-grid" id="mrbrokPlayerGrid">${chips}</div>

        <div class="seg ${mrbrokWager==='euro'?'active':''}" data-mrbrok-wager="euro">💶 1 euro i kassen</div>

function mrbrokTurnHtml(m, cur){
  const asker = state.members.find(mm=>mm.id===cur.askerId);
  const target = state.members.find(mm=>mm.id===cur.targetId);
  const isAsker = profile && profile.memberId === cur.askerId;
  const isTarget = profile && profile.memberId === cur.targetId;
  const turnNo = cur.turnIndex + 1, totalTurns = cur.pairing.length;
  const badge = `<div class="game-badge" style="display:flex; align-items:center; justify-content:space-between; gap:10px;"><span>Omgang ${m.round}/${m.totalRounds} · Tur ${turnNo}/${totalTurns}</span><span id="mrbrokTimer" style="font-size:16px; font-weight:800; opacity:1;"></span></div>`;

  if(cur.phase === 'ask'){
    if(isAsker){
      return `
        ${badge}
        ${mrbrokTopicBanner(m)}
        <div class="game-card" id="mrbrokCard">
          <p class="hint" style="margin:0 0 8px; color:rgba(255,247,232,0.7);">Stil ${escapeHtml(target?target.name:'?')} et spørgsmål om emnet — uden at nævne det direkte.</p>
          <textarea id="mrbrokQuestionInput" rows="2" maxlength="140" placeholder="Dit spørgsmål..."></textarea>
          <button class="game-btn" id="mrbrokAskBtn" style="margin-top:10px;">🚀 Send spørgsmål</button>
        </div>
      `;
    }
    return `
      ${badge}
      ${mrbrokTopicBanner(m)}
      <div class="empty-state"><span class="emoji">✍️</span><b>${escapeHtml(asker?asker.name:'?')} spørger ${escapeHtml(target?target.name:'?')}...</b>Vent til spørgsmålet er sendt.</div>
    `;
  }

  // phase === 'answer'
  if(isTarget){
    return `
      ${badge}
      ${mrbrokTopicBanner(m)}
      <div class="game-card" id="mrbrokCard">
        <p class="hint" style="margin:0 0 4px; color:rgba(255,247,232,0.6);">${escapeHtml(asker?asker.name:'?')} spørger:</p>
        <p style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:18px; margin:0 0 12px;">"${escapeHtml(cur.question||'')}"</p>

function mrbrokRecapHtml(m, cur){
  if(!cur.history || !cur.history.length) return '';
  const rows = cur.history.map(h=>{
    const turns = h.turns.map(t=>{
      const asker = state.members.find(mm=>mm.id===t.askerId);
      const target = state.members.find(mm=>mm.id===t.targetId);
      return `<p class="hint" style="margin:2px 0; color:rgba(255,247,232,0.75);">${escapeHtml(asker?asker.name:'?')} → ${escapeHtml(target?target.name:'?')}: "${escapeHtml(t.question||'')}" — "${escapeHtml(t.answer||'')}"</p>`;
    }).join('');
    const guesses = Object.entries(h.guesses||{}).map(([voterId,guessedId])=>{
      const voter = state.members.find(mm=>mm.id===voterId);
      const guessed = state.members.find(mm=>mm.id===guessedId);
      const right = guessedId === cur.mrBrokId;
      return `<span style="display:inline-block; margin:2px 6px 2px 0; padding:3px 9px; border-radius:100px; font-size:11.5px; background:${right?'rgba(255,201,60,0.18)':'rgba(255,247,232,0.08)'};">${escapeHtml(voter?voter.name:'?')} → ${escapeHtml(guessed?guessed.name:'?')} ${right?'✓':''}</span>`;
    }).join('');
    return `<div class="game-card" style="text-align:left; margin-bottom:8px;">
      <p style="font-weight:700; margin:0 0 6px;">Omgang ${h.round}</p>
      ${turns}
      <div style="margin-top:8px;">${guesses}</div>
    </div>`;
  }).join('');
  return `<div class="section-label">📜 Sådan gik det</div>${rows}`;
}

function bindMrbrokHandlers(m){
  const cur = m.current;
  const instrToggle = document.getElementById('mrbrokInstructionsToggle');
  if(instrToggle) instrToggle.onclick = ()=>{ mrbrokInstructionsOpen = !mrbrokInstructionsOpen; render(); };
  document.querySelectorAll('[data-mrbrok-wager]').forEach(el=>{
    el.onclick = ()=>{ mrbrokWager = el.dataset.mrbrokWager; render(); };
  });
  document.querySelectorAll('[data-mrbrok-rounds]').forEach(el=>{
    el.onclick = ()=>{ mrbrokRounds = parseInt(el.dataset.mrbrokRounds,10); render(); };
  });
  document.querySelectorAll('[data-mrbrok-player]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.mrbrokPlayer;
      if(mrbrokSelectedPlayers.includes(id)) mrbrokSelectedPlayers = mrbrokSelectedPlayers.filter(x=>x!==id);
      else mrbrokSelectedPlayers = [...mrbrokSelectedPlayers, id];
      render();
    };
  });
  const startBtn = document.getElementById('startMrbrokBtn');
  if(startBtn) startBtn.onclick = ()=> mrbrokApi('start', { wager: mrbrokWager, playerIds: mrbrokSelectedPlayers, totalRounds: mrbrokRounds });

  const playAgainBtn = document.getElementById('mrbrokPlayAgainBtn');
  if(playAgainBtn) playAgainBtn.onclick = ()=>{
    mrbrokApi('end', {}).then(()=> mrbrokApi('start', { wager: mrbrokWager, playerIds: mrbrokSelectedPlayers, totalRounds: mrbrokRounds }));
  };
  const endBtn = document.getElementById('mrbrokEndBtn');
  if(endBtn) endBtn.onclick = ()=> mrbrokApi('end', {});

  if(!cur) return;

  if(cur.type === 'turn' && cur.phase === 'ask' && profile && profile.memberId === cur.askerId){
    const btn = document.getElementById('mrbrokAskBtn');
    if(btn) btn.onclick = ()=>{
      const question = document.getElementById('mrbrokQuestionInput').value.trim();
      if(!question) return;
      lockSubmitBtn(btn, 'Sender...');
      mrbrokApi('submit', { payload: { question } });
    };
  }
  if(cur.type === 'turn' && cur.phase === 'answer' && profile && profile.memberId === cur.targetId){
    const btn = document.getElementById('mrbrokAnswerBtn');
    if(btn) btn.onclick = ()=>{
      const answer = document.getElementById('mrbrokAnswerInput').value.trim();
      if(!answer) return;
      lockSubmitBtn(btn, 'Sender...');
      mrbrokApi('submit', { payload: { answer } });
    };
  }
  if(cur.type === 'guess'){
    document.querySelectorAll('[data-mrbrok-guess]').forEach(el=>{
      el.onclick = ()=>{
        document.querySelectorAll('[data-mrbrok-guess]').forEach(x=>x.style.opacity='.4');
        el.style.opacity='1'; el.style.outline='2px solid var(--coin)';
        mrbrokApi('submit', { payload: { guessedId: el.dataset.mrbrokGuess } });
      };
    });
  }
  if(cur.type === 'steal' && m.youAreMrBrok && !cur.guess){
    const btn = document.getElementById('mrbrokStealBtn');
    if(btn) btn.onclick = ()=>{
      const guess = document.getElementById('mrbrokStealInput').value.trim();
      if(!guess) return;
      lockSubmitBtn(btn, 'Sender...');
      mrbrokApi('submit', { payload: { guess } });
    };
  }
  if(cur.type === 'steal' && cur.guess && !m.youAreMrBrok){
    document.querySelectorAll('[data-mrbrok-steal-vote]').forEach(el=>{
      el.onclick = ()=> mrbrokApi('submit', { payload: { closeEnough: el.dataset.mrbrokStealVote === 'true' } });
    });
  }
}

function jarSVG(fillPct){
  const fillY = 190 - (fillPct/100)*150;
  return `
  <svg class="jar-svg" viewBox="0 0 220 240" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="coinFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FFE49E"/><stop offset="55%" stop-color="#FFC93C"/><stop offset="100%" stop-color="#E8A317"/>
      </linearGradient>
      <clipPath id="jarClip"><path d="M40 34 Q40 26 50 26 L170 26 Q180 26 180 34 L180 178 Q180 210 150 210 L70 210 Q40 210 40 178 Z"/></clipPath>
    </defs>
    <rect x="72" y="6" width="76" height="20" rx="6" fill="#cfd6d2"/>
    <rect x="72" y="6" width="76" height="8" rx="4" fill="#e8ece9"/>
    <path d="M40 34 Q40 26 50 26 L170 26 Q180 26 180 34 L180 178 Q180 210 150 210 L70 210 Q40 210 40 178 Z" fill="rgba(255,247,232,0.12)" stroke="rgba(255,247,232,0.55)" stroke-width="3"/>
    <g clip-path="url(#jarClip)">
      <rect x="30" y="${fillY}" width="160" height="${230-fillY}" fill="url(#coinFill)"/>
      <path id="waveTop" d="M0 ${fillY} Q30 ${fillY-6} 60 ${fillY} T120 ${fillY} T180 ${fillY} T240 ${fillY} V230 H0 Z" fill="#FFE49E" opacity="0.5"/>
      ${coinDots(fillY)}
    </g>
    <path d="M52 34 Q48 34 48 42 L48 172" stroke="rgba(255,247,232,0.5)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </svg>`;
}
function coinDots(fillY){
  if(fillY >= 208) return '';
  let dots = '';
  const rows = Math.floor((210-fillY)/16);
  for(let i=0;i<Math.min(rows*3, 26);i++){
    const x = 55 + (i*37)%110 + (i%2?8:0);
    const y = fillY + 10 + Math.floor(i/3)*15;
    dots += `<ellipse cx="${x}" cy="${y}" rx="9" ry="4" fill="#E8A317" opacity="0.55"/>`;
  }
  return dots;
}

function bindPendingCardHandlers(){
  document.querySelectorAll('[data-voter]').forEach(el=>{
    el.onclick = async ()=>{
      if(!profile || el.dataset.voter !== profile.memberId) return;
      const pendingId = el.dataset.pending;
      const p = state.pendingList.find(x=>x.id===pendingId);
      const complainer = p && state.members.find(m=>m.id===p.memberId);
      try{
        const r = await api('brok', { action: 'vote', roomId, voterId: profile.memberId, pendingId });
        state = r.state;
        if(r.confirmed){
          launchCoinToJar(()=>{
            if(r.free){
              toast(`🎫 ${complainer ? complainer.name : 'Nogen'} brugte sit gratis brok — denne var på husets regning!`);
            }else{
              toast(`💰 ${complainer ? complainer.name : 'Nogen'} skylder nu 1€ mere — ${randomBanter()}`);
            }
            render();
          });
        }else{
          render();
        }
      }catch(e){ toast(e.message); await refreshState(true); }
    };
  });
  document.querySelectorAll('[data-cancel-pending]').forEach(el=>{
    el.onclick = async ()=>{
      const pendingId = el.dataset.cancelPending;
      try{ const r = await api('brok', { action: 'cancel', roomId, actorId: profile.memberId, pendingId }); state = r.state; render(); }
      catch(e){ toast(e.message); }
    };
  });
}

function renderFeed(main){
  const pendingCards = (state.pendingList||[]).slice().sort((a,b)=>a.openedAt-b.openedAt).map(renderPendingCard).join('');
  const winner = state.freeBrokMemberId ? state.members.find(m=>m.id===state.freeBrokMemberId) : null;
  const winnerBanner = winner ? `<div class="feed-item" style="border-style:dashed; border-color:rgba(255,201,60,0.5); background:rgba(255,201,60,0.1); align-items:center;">
    <div class="avatar" style="background:linear-gradient(160deg,#ffc93c,#e8a317); color:var(--ink);">🍀</div>
    <div class="feed-body"><div class="feed-name">${escapeHtml(winner.name)} har vundet 1 gratis brok i dag</div><div class="feed-msg">Ét brok i dag er på husets regning</div></div>
  </div>` : '';
  // Gammelt brok kan enten stadig ligge i state.events (bare ældre end i dag)
  // eller allerede være arkiveret i historikken (fx fra en tidligere "Gør op",
  // eller fra tiden inden krukken holdt op med at tømme sig selv hver nat).
  const historyEvents = [];
  state.history.forEach(round => (round.events||[]).forEach(e => historyEvents.push(e)));
  const acquittalEvents = (state.acquittals||[]).map(a => ({ ...a, ts: a.expiredAt, acquitted: true }));
  const allEvents = [...historyEvents, ...state.events, ...acquittalEvents];
  if(!allEvents.length && !state.pendingList.length){
    main.innerHTML = winnerBanner + `<div class="empty-state"><span class="emoji">🤐</span><b>Ingen brok endnu</b>Første gang nogen brokker sig, koster det 1€. Hold øje!</div>`;
    return;
  }
  const sorted = allEvents.slice().sort((a,b)=>b.ts-a.ts);
  const fresh = sorted.filter(e=>e.ts >= state.dayBoundary);
  const stale = sorted.filter(e=>e.ts < state.dayBoundary);
  const freshRows = fresh.map(e=>feedItemHtml(e, false)).join('');
  const staleRows = stale.map(e=>feedItemHtml(e, true)).join('');
  const quietToday = !fresh.length && !!stale.length
    ? `<div class="empty-state" style="padding:24px 20px 10px;"><span class="emoji">🤐</span><b>Stille indtil videre i dag</b>Rul ned og nyd gårsdagens elendighed.</div>`
    : '';
  main.innerHTML = pendingCards + winnerBanner + quietToday
    + (fresh.length ? `<div class="section-label">Seneste brok</div>${freshRows}` : '')
    + (stale.length ? `<div class="section-label" style="margin-top:${fresh.length?22:10}px;">📜 Gammelt brok</div>${staleRows}` : '');
  bindPendingCardHandlers();
}
function allTimeTotals(){
  const totals = {};
  state.members.forEach(m=>totals[m.id]=0);
  state.history.forEach(round=>{
    Object.entries(round.totals||{}).forEach(([id,amt])=>{ if(totals[id]!==undefined) totals[id]+=amt; });
  });
  const live = balances();
  Object.entries(live).forEach(([id,amt])=>{ if(totals[id]!==undefined) totals[id]+=amt; });
  return totals;
}

function spotlightCards(vals){
  const members = state.members;
  const maxV = Math.max(0, ...Object.values(vals));
  if(maxV <= 0) return '';
  const minV = Math.min(...members.map(m=>vals[m.id]||0));
  const topNames = members.filter(m=>(vals[m.id]||0) === maxV).map(m=>m.name).join(' & ');
  const saintNames = minV < maxV ? members.filter(m=>(vals[m.id]||0) === minV).map(m=>m.name).join(' & ') : null;
  const card = (title, emoji, names, amt, accent) => `
    <div style="flex:1; background:${accent ? 'rgba(255,107,74,0.14)' : 'rgba(255,247,232,0.07)'}; border:1px solid ${accent ? 'rgba(255,107,74,0.35)' : 'rgba(255,247,232,0.15)'}; border-radius:16px; padding:12px; text-align:center;">
      <div style="font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:rgba(255,247,232,0.68);">${emoji} ${title}</div>
      <div style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:${names.length>14?'12.5':'15'}px; color:var(--cream); margin-top:4px; line-height:1.2;">${escapeHtml(names)}</div>
      <div style="font-size:12px; color:var(--coin);">${amt}€</div>
    </div>`;
  return `<div style="display:flex; gap:10px; margin-bottom:18px;">
    ${card('TopBrokker', '🏆', topNames, maxV, true)}
    ${saintNames ? card('Helgenen', '😇', saintNames, minV, false) : ''}
  </div>`;
}

function renderBalanceToday(main){
  const bal = todayBalances();
  const balValues = Object.values(bal);
  const maxAmt = Math.max(0, ...balValues);
  const minAmt = balValues.length ? Math.min(...balValues) : 0;
  const streaks = state.streaks || {};
  const rows = [...state.members].sort((a,b)=>bal[b.id]-bal[a.id]).map(m=>{
    const amt = bal[m.id]||0;
    const isTop = amt > 0 && amt === maxAmt;
    const isLeast = maxAmt > minAmt && amt === minAmt;
    const crown = isTop ? ' 👑' : (isLeast ? ' 😇' : '');
    const freeTag = state.freeBrokMemberId === m.id ? ' 🎫' : '';
    const streak = streaks[m.id] || 0;
    let sub;
    if(state.freeBrokMemberId === m.id) sub = 'Har dagens gratis brok';
    else if(isTop) sub = 'TopBrokker i dag';
    else if(isLeast) sub = 'Helgenen i dag 😇';
    else if(streak > 0) sub = `🔥 ${streak} dag${streak===1?'':'e'} uden brok`;
    else sub = titleFor(amt);
    return `<div class="bal-row"><div class="avatar" style="width:34px;height:34px;font-size:12.5px;">${initials(m.name)}</div><div class="feed-body"><div class="bal-name ${profile && m.id===profile.memberId?'me':''}">${escapeHtml(m.name)}${crown}${freeTag}</div><div style="font-size:12px; color:rgba(255,247,232,0.68);">${sub}</div></div><div class="bal-amt ${amt===0?'zero':''}">${amt}€</div></div>`;
  }).join('');

  main.innerHTML = spotlightCards(bal) + `<div class="section-label">💸 Dagens regnskab</div>` + rows;
}
function renderAllTimeHistory(main){
  const totals = allTimeTotals();
  const totalValues = Object.values(totals);
  const maxTotal = Math.max(0, ...totalValues);
  const minTotal = totalValues.length ? Math.min(...totalValues) : 0;
  const anyTotal = maxTotal > 0;
  const chart = anyTotal ? (
    spotlightCards(totals) +
    `<div class="section-label">Alle medlemmer — alle tider</div>` +
    [...state.members].sort((a,b)=>totals[b.id]-totals[a.id]).map(m=>{
      const amt = totals[m.id]||0;
      const isTop = amt > 0 && amt === maxTotal;
      const isLeast = maxTotal > minTotal && amt === minTotal;
      const pct = amt > 0 ? Math.max(6, Math.round(amt/maxTotal*100)) : 0;
      const badge = isTop ? ' 🏆' : (isLeast ? ' 😇' : '');
      return `<div class="bar-row"><div class="avatar" style="width:30px;height:30px;font-size:11px;">${initials(m.name)}</div><div class="bar-track"><div class="bar-fill ${isTop?'top':''}" style="width:${pct}%;"></div></div><div class="bar-amt">${amt}€${badge}</div></div>`;
    }).join('')
  ) : '';

  if(!state.history.length){
    // Kun vis den STORE tomme-tilstand hvis der reelt intet er at vise
    // overhovedet (heller ikke et igangværende regnskab) — ellers virkede
    // det modsigende at vise et rigtigt regnskab foroven og "ingen data
    // endnu" lige nedenunder. Med data foroven er en lille fodnote nok.
    main.innerHTML = anyTotal
      ? chart + `<p class="hint" style="text-align:center; margin-top:14px;">📜 Det er den aktive pulje ovenfor — der kommer en "dag for dag"-historik her, når I trykker 💶 "Gør op" første gang.</p>`
      : chart + `<div class="empty-state"><span class="emoji">📜</span><b>Ingen brok registreret endnu</b>Så snart nogen brokker sig, vises regnskabet her.</div>`;
    return;
  }
  const days = `<div class="section-label" style="margin-top:${anyTotal?22:0}px;">🗓️ Dag for dag</div>` + [...state.history].reverse().map(r=>{
    const lines = Object.entries(r.totals).map(([id,amt])=>{
      const m = state.members.find(x=>x.id===id);
      return `<div class="hr-line"><span>${escapeHtml(m?m.name:'?')}</span><span>${amt}€</span></div>`;
    }).join('');
    const start = new Date(r.startedAt).toLocaleDateString('da-DK',{day:'2-digit',month:'short'});
    const end = new Date(r.closedAt).toLocaleDateString('da-DK',{day:'2-digit',month:'short'});
    return `<div class="history-round"><div class="hr-title">${r.total}€ i alt</div><div class="hr-sub">${start} – ${end} · ${r.events.length} brok</div>${lines}</div>`;
  }).join('');
  main.innerHTML = chart + days;
}

function openSheet(html, onOpen){
  let backdrop = document.getElementById('sheetBackdrop');
  if(backdrop) backdrop.remove();
  backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  backdrop.id = 'sheetBackdrop';
  backdrop.innerHTML = `<div class="sheet"><div class="sheet-handle"></div>${html}</div>`;
  backdrop.addEventListener('click', e=>{ if(e.target === backdrop) closeSheet(); });
  document.body.appendChild(backdrop);
  requestAnimationFrame(()=>backdrop.classList.add('show'));
  bindSheetSwipe(backdrop.querySelector('.sheet'));
  if(onOpen) onOpen();
}
function bindSheetSwipe(sheetEl){
  let startY = null, currentY = 0, dragging = false;
  sheetEl.addEventListener('touchstart', e=>{
    if(sheetEl.scrollTop > 0){ startY = null; return; }
    startY = e.touches[0].clientY;
    dragging = false;
  }, { passive:true });
  sheetEl.addEventListener('touchmove', e=>{
    if(startY === null) return;
    const dy = e.touches[0].clientY - startY;
    if(dy <= 0 || sheetEl.scrollTop > 0) return;
    dragging = true;
    currentY = dy;
    sheetEl.style.transition = 'none';
    sheetEl.style.transform = `translateY(${dy}px)`;
  }, { passive:true });
  sheetEl.addEventListener('touchend', ()=>{
    if(dragging){
      if(currentY > 90){
        sheetEl.style.transition = 'transform .2s ease';
        sheetEl.style.transform = 'translateY(100%)';
        setTimeout(closeSheet, 200);
      }else{
        sheetEl.style.transition = '';
        sheetEl.style.transform = '';
      }
    }
    startY = null; dragging = false; currentY = 0;
  }, { passive:true });
}
function closeSheet(){
  const b = document.getElementById('sheetBackdrop');
  if(!b) return;
  b.classList.remove('show');
  setTimeout(()=>b.remove(), 220);
}

  const key = 'bk_lastFreeReveal_' + roomId;

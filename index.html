function bindMrbrokHandlers(m){
  const cur = m.current;
  const instrToggle = document.getElementById('mrbrokInstructionsToggle');
  if(instrToggle) instrToggle.onclick = ()=>{ mrbrokInstructionsOpen = !mrbrokInstructionsOpen; render(); };
  document.querySelectorAll('[data-mrbrok-wager]').forEach(el=>{
    el.onclick = ()=>{ mrbrokWager = el.dataset.mrbrokWager; render(); };
  });
  document.querySelectorAll('[data-mrbrok-rounds]').forEach(el=>{
    el.onclick = ()=>{ mrbrokRounds = parseInt(el.dataset.mrbrokRounds,10); render(); };
  });
  document.querySelectorAll('[data-mrbrok-player]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.mrbrokPlayer;
      if(mrbrokSelectedPlayers.includes(id)) mrbrokSelectedPlayers = mrbrokSelectedPlayers.filter(x=>x!==id);
      else mrbrokSelectedPlayers = [...mrbrokSelectedPlayers, id];
      render();
    };
  });
  const startBtn = document.getElementById('startMrbrokBtn');
  if(startBtn) startBtn.onclick = ()=> mrbrokApi('start', { wager: mrbrokWager, playerIds: mrbrokSelectedPlayers, totalRounds: mrbrokRounds });

  const playAgainBtn = document.getElementById('mrbrokPlayAgainBtn');
  if(playAgainBtn) playAgainBtn.onclick = ()=>{
    mrbrokApi('end', {}).then(()=> mrbrokApi('start', { wager: mrbrokWager, playerIds: mrbrokSelectedPlayers, totalRounds: mrbrokRounds }));
  };
  const endBtn = document.getElementById('mrbrokEndBtn');
  if(endBtn) endBtn.onclick = ()=> mrbrokApi('end', {});

  if(!cur) return;

  if(cur.type === 'turn' && cur.phase === 'ask' && profile && profile.memberId === cur.askerId){
    const btn = document.getElementById('mrbrokAskBtn');
    if(btn) btn.onclick = ()=>{
      const question = document.getElementById('mrbrokQuestionInput').value.trim();
      if(!question) return;
      lockSubmitBtn(btn, 'Sender...');
      mrbrokApi('submit', { payload: { question } });
    };
  }
  if(cur.type === 'turn' && cur.phase === 'answer' && profile && profile.memberId === cur.targetId){
    const btn = document.getElementById('mrbrokAnswerBtn');
    if(btn) btn.onclick = ()=>{
      const answer = document.getElementById('mrbrokAnswerInput').value.trim();
      if(!answer) return;
      lockSubmitBtn(btn, 'Sender...');
      mrbrokApi('submit', { payload: { answer } });
    };
  }
  if(cur.type === 'guess'){
    document.querySelectorAll('[data-mrbrok-guess]').forEach(el=>{
      el.onclick = ()=>{
        document.querySelectorAll('[data-mrbrok-guess]').forEach(x=>x.style.opacity='.4');
        el.style.opacity='1'; el.style.outline='2px solid var(--coin)';
        mrbrokApi('submit', { payload: { guessedId: el.dataset.mrbrokGuess } });
      };
    });
  }
  if(cur.type === 'steal' && m.youAreMrBrok && !cur.guess){
    const btn = document.getElementById('mrbrokStealBtn');
    if(btn) btn.onclick = ()=>{
      const guess = document.getElementById('mrbrokStealInput').value.trim();
      if(!guess) return;
      lockSubmitBtn(btn, 'Sender...');
      mrbrokApi('submit', { payload: { guess } });
    };
  }
  if(cur.type === 'steal' && cur.guess && !m.youAreMrBrok){
    document.querySelectorAll('[data-mrbrok-steal-vote]').forEach(el=>{
      el.onclick = ()=> mrbrokApi('submit', { payload: { closeEnough: el.dataset.mrbrokStealVote === 'true' } });
    });
  }
}

function jarSVG(fillPct){
  const fillY = 190 - (fillPct/100)*150;
  return `
  <svg class="jar-svg" viewBox="0 0 220 240" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="coinFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FFE49E"/><stop offset="55%" stop-color="#FFC93C"/><stop offset="100%" stop-color="#E8A317"/>
      </linearGradient>
      <clipPath id="jarClip"><path d="M40 34 Q40 26 50 26 L170 26 Q180 26 180 34 L180 178 Q180 210 150 210 L70 210 Q40 210 40 178 Z"/></clipPath>
    </defs>
    <rect x="72" y="6" width="76" height="20" rx="6" fill="#cfd6d2"/>
    <rect x="72" y="6" width="76" height="8" rx="4" fill="#e8ece9"/>
    <path d="M40 34 Q40 26 50 26 L170 26 Q180 26 180 34 L180 178 Q180 210 150 210 L70 210 Q40 210 40 178 Z" fill="rgba(255,247,232,0.12)" stroke="rgba(255,247,232,0.55)" stroke-width="3"/>
    <g clip-path="url(#jarClip)">
      <rect x="30" y="${fillY}" width="160" height="${230-fillY}" fill="url(#coinFill)"/>
      <path id="waveTop" d="M0 ${fillY} Q30 ${fillY-6} 60 ${fillY} T120 ${fillY} T180 ${fillY} T240 ${fillY} V230 H0 Z" fill="#FFE49E" opacity="0.5"/>
      ${coinDots(fillY)}
    </g>
    <path d="M52 34 Q48 34 48 42 L48 172" stroke="rgba(255,247,232,0.5)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </svg>`;
}
function coinDots(fillY){
  if(fillY >= 208) return '';
  let dots = '';
  const rows = Math.floor((210-fillY)/16);
  for(let i=0;i<Math.min(rows*3, 26);i++){
    const x = 55 + (i*37)%110 + (i%2?8:0);
    const y = fillY + 10 + Math.floor(i/3)*15;
    dots += `<ellipse cx="${x}" cy="${y}" rx="9" ry="4" fill="#E8A317" opacity="0.55"/>`;
  }
  return dots;
}

function bindPendingCardHandlers(){
  document.querySelectorAll('[data-voter]').forEach(el=>{
    el.onclick = async ()=>{
      if(!profile || el.dataset.voter !== profile.memberId) return;
      const pendingId = el.dataset.pending;
      const p = state.pendingList.find(x=>x.id===pendingId);
      const complainer = p && state.members.find(m=>m.id===p.memberId);
      try{
        const r = await api('brok', { action: 'vote', roomId, voterId: profile.memberId, pendingId });
        state = r.state;
        if(r.confirmed){
          launchCoinToJar(()=>{
            if(r.free){
              toast(`🎫 ${complainer ? complainer.name : 'Nogen'} brugte sit gratis brok — denne var på husets regning!`);
            }else{
              toast(`💰 ${complainer ? complainer.name : 'Nogen'} skylder nu 1€ mere — ${randomBanter()}`);
            }
            render();
          });
        }else{
          render();
        }
      }catch(e){ toast(e.message); await refreshState(true); }
    };
  });
  document.querySelectorAll('[data-cancel-pending]').forEach(el=>{
    el.onclick = async ()=>{
      const pendingId = el.dataset.cancelPending;
      try{ const r = await api('brok', { action: 'cancel', roomId, actorId: profile.memberId, pendingId }); state = r.state; render(); }
      catch(e){ toast(e.message); }
    };
  });
}

  // Gammelt brok kan enten stadig ligge i state.events (bare ældre end i dag)
  // eller allerede være arkiveret i historikken (fx fra en tidligere "Gør op",
  // eller fra tiden inden krukken holdt op med at tømme sig selv hver nat).
  const historyEvents = [];
  state.history.forEach(round => (round.events||[]).forEach(e => historyEvents.push(e)));
  const acquittalEvents = (state.acquittals||[]).map(a => ({ ...a, ts: a.expiredAt, acquitted: true }));
  const allEvents = [...historyEvents, ...state.events, ...acquittalEvents];
  if(!allEvents.length && !state.pendingList.length){
    main.innerHTML = winnerBanner + `<div class="empty-state"><span class="emoji">🤐</span><b>Ingen brok endnu</b>Første gang nogen brokker sig, koster det 1€. Hold øje!</div>`;
    return;
  }
  const sorted = allEvents.slice().sort((a,b)=>b.ts-a.ts);
  const fresh = sorted.filter(e=>e.ts >= state.dayBoundary);
  const stale = sorted.filter(e=>e.ts < state.dayBoundary);
  const freshRows = fresh.map(e=>feedItemHtml(e, false)).join('');
  const staleRows = stale.map(e=>feedItemHtml(e, true)).join('');
  const quietToday = !fresh.length && !!stale.length
    ? `<div class="empty-state" style="padding:24px 20px 10px;"><span class="emoji">🤐</span><b>Stille indtil videre i dag</b>Rul ned og nyd gårsdagens elendighed.</div>`
    : '';
  main.innerHTML = pendingCards + winnerBanner + quietToday
    + (fresh.length ? `<div class="section-label">Seneste brok</div>${freshRows}` : '')
    + (stale.length ? `<div class="section-label" style="margin-top:${fresh.length?22:10}px;">📜 Gammelt brok</div>${staleRows}` : '');
  bindPendingCardHandlers();
}
function allTimeTotals(){
  const totals = {};
  state.members.forEach(m=>totals[m.id]=0);
  state.history.forEach(round=>{
    Object.entries(round.totals||{}).forEach(([id,amt])=>{ if(totals[id]!==undefined) totals[id]+=amt; });
  });
  const live = balances();
  Object.entries(live).forEach(([id,amt])=>{ if(totals[id]!==undefined) totals[id]+=amt; });
  return totals;
}

function spotlightCards(vals){
  const members = state.members;
  const maxV = Math.max(0, ...Object.values(vals));
  if(maxV <= 0) return '';
  const minV = Math.min(...members.map(m=>vals[m.id]||0));
  const topNames = members.filter(m=>(vals[m.id]||0) === maxV).map(m=>m.name).join(' & ');
  const saintNames = minV < maxV ? members.filter(m=>(vals[m.id]||0) === minV).map(m=>m.name).join(' & ') : null;
  const card = (title, emoji, names, amt, accent) => `
    <div style="flex:1; background:${accent ? 'rgba(255,107,74,0.14)' : 'rgba(255,247,232,0.07)'}; border:1px solid ${accent ? 'rgba(255,107,74,0.35)' : 'rgba(255,247,232,0.15)'}; border-radius:16px; padding:12px; text-align:center;">
      <div style="font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:rgba(255,247,232,0.68);">${emoji} ${title}</div>
      <div style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:${names.length>14?'12.5':'15'}px; color:var(--cream); margin-top:4px; line-height:1.2;">${escapeHtml(names)}</div>
      <div style="font-size:12px; color:var(--coin);">${amt}€</div>
    </div>`;
  return `<div style="display:flex; gap:10px; margin-bottom:18px;">
    ${card('TopBrokker', '🏆', topNames, maxV, true)}
    ${saintNames ? card('Helgenen', '😇', saintNames, minV, false) : ''}
  </div>`;
}

function renderBalanceToday(main){
  const bal = todayBalances();
  const balValues = Object.values(bal);
  const maxAmt = Math.max(0, ...balValues);
  const minAmt = balValues.length ? Math.min(...balValues) : 0;
  const streaks = state.streaks || {};
  const rows = [...state.members].sort((a,b)=>bal[b.id]-bal[a.id]).map(m=>{
    const amt = bal[m.id]||0;
    const isTop = amt > 0 && amt === maxAmt;
    const isLeast = maxAmt > minAmt && amt === minAmt;
    const crown = isTop ? ' 👑' : (isLeast ? ' 😇' : '');
    const freeTag = state.freeBrokMemberId === m.id ? ' 🎫' : '';
    const streak = streaks[m.id] || 0;
    let sub;
    if(state.freeBrokMemberId === m.id) sub = 'Har dagens gratis brok';
    else if(isTop) sub = 'TopBrokker i dag';
    else if(isLeast) sub = 'Helgenen i dag 😇';
    else if(streak > 0) sub = `🔥 ${streak} dag${streak===1?'':'e'} uden brok`;
    else sub = titleFor(amt);
    return `<div class="bal-row"><div class="avatar" style="width:34px;height:34px;font-size:12.5px;">${initials(m.name)}</div><div class="feed-body"><div class="bal-name ${profile && m.id===profile.memberId?'me':''}">${escapeHtml(m.name)}${crown}${freeTag}</div><div style="font-size:12px; color:rgba(255,247,232,0.68);">${sub}</div></div><div class="bal-amt ${amt===0?'zero':''}">${amt}€</div></div>`;
  }).join('');

  main.innerHTML = spotlightCards(bal) + `<div class="section-label">💸 Dagens regnskab</div>` + rows;
}
function renderAllTimeHistory(main){
  const totals = allTimeTotals();
  const totalValues = Object.values(totals);
  const maxTotal = Math.max(0, ...totalValues);
  const minTotal = totalValues.length ? Math.min(...totalValues) : 0;
  const anyTotal = maxTotal > 0;
  const chart = anyTotal ? (
    spotlightCards(totals) +
    `<div class="section-label">Alle medlemmer — alle tider</div>` +
    [...state.members].sort((a,b)=>totals[b.id]-totals[a.id]).map(m=>{
      const amt = totals[m.id]||0;
      const isTop = amt > 0 && amt === maxTotal;
      const isLeast = maxTotal > minTotal && amt === minTotal;
      const pct = amt > 0 ? Math.max(6, Math.round(amt/maxTotal*100)) : 0;
      const badge = isTop ? ' 🏆' : (isLeast ? ' 😇' : '');
      return `<div class="bar-row"><div class="avatar" style="width:30px;height:30px;font-size:11px;">${initials(m.name)}</div><div class="bar-track"><div class="bar-fill ${isTop?'top':''}" style="width:${pct}%;"></div></div><div class="bar-amt">${amt}€${badge}</div></div>`;
    }).join('')
  ) : '';

  if(!state.history.length){
    // Kun vis den STORE tomme-tilstand hvis der reelt intet er at vise
    // overhovedet (heller ikke et igangværende regnskab) — ellers virkede
    // det modsigende at vise et rigtigt regnskab foroven og "ingen data
    // endnu" lige nedenunder. Med data foroven er en lille fodnote nok.
    main.innerHTML = anyTotal
      ? chart + `<p class="hint" style="text-align:center; margin-top:14px;">📜 Det er den aktive pulje ovenfor — der kommer en "dag for dag"-historik her, når I trykker 💶 "Gør op" første gang.</p>`
      : chart + `<div class="empty-state"><span class="emoji">📜</span><b>Ingen brok registreret endnu</b>Så snart nogen brokker sig, vises regnskabet her.</div>`;
    return;
  }
  const days = `<div class="section-label" style="margin-top:${anyTotal?22:0}px;">🗓️ Dag for dag</div>` + [...state.history].reverse().map(r=>{
    const lines = Object.entries(r.totals).map(([id,amt])=>{
      const m = state.members.find(x=>x.id===id);
      return `<div class="hr-line"><span>${escapeHtml(m?m.name:'?')}</span><span>${amt}€</span></div>`;
    }).join('');
    const start = new Date(r.startedAt).toLocaleDateString('da-DK',{day:'2-digit',month:'short'});
    const end = new Date(r.closedAt).toLocaleDateString('da-DK',{day:'2-digit',month:'short'});
    return `<div class="history-round"><div class="hr-title">${r.total}€ i alt</div><div class="hr-sub">${start} – ${end} · ${r.events.length} brok</div>${lines}</div>`;
  }).join('');
  main.innerHTML = chart + days;
}

function openSheet(html, onOpen){
  let backdrop = document.getElementById('sheetBackdrop');
  if(backdrop) backdrop.remove();
  backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  backdrop.id = 'sheetBackdrop';
  backdrop.innerHTML = `<div class="sheet"><div class="sheet-handle"></div>${html}</div>`;
  backdrop.addEventListener('click', e=>{ if(e.target === backdrop) closeSheet(); });
  document.body.appendChild(backdrop);
  requestAnimationFrame(()=>backdrop.classList.add('show'));
  bindSheetSwipe(backdrop.querySelector('.sheet'));
  if(onOpen) onOpen();
}
function bindSheetSwipe(sheetEl){
  let startY = null, currentY = 0, dragging = false;
  sheetEl.addEventListener('touchstart', e=>{
    if(sheetEl.scrollTop > 0){ startY = null; return; }
    startY = e.touches[0].clientY;
    dragging = false;
  }, { passive:true });
  sheetEl.addEventListener('touchmove', e=>{
    if(startY === null) return;
    const dy = e.touches[0].clientY - startY;
    if(dy <= 0 || sheetEl.scrollTop > 0) return;
    dragging = true;
    currentY = dy;
    sheetEl.style.transition = 'none';
    sheetEl.style.transform = `translateY(${dy}px)`;
  }, { passive:true });
  sheetEl.addEventListener('touchend', ()=>{
    if(dragging){
      if(currentY > 90){
        sheetEl.style.transition = 'transform .2s ease';
        sheetEl.style.transform = 'translateY(100%)';
        setTimeout(closeSheet, 200);
      }else{
        sheetEl.style.transition = '';
        sheetEl.style.transform = '';
      }
    }
    startY = null; dragging = false; currentY = 0;
  }, { passive:true });
}
function closeSheet(){
  const b = document.getElementById('sheetBackdrop');
  if(!b) return;
  b.classList.remove('show');
  setTimeout(()=>b.remove(), 220);
}

function checkFreeBrokReveal(){
  if(!state || !state.freeBrokMemberId || !state.members.length) return;
  const marker = String(state.freeBrokDrawnAt || state.dayBoundary);
  const key = 'bk_lastFreeReveal_' + roomId;
  if(localStorage.getItem(key) === marker) return; // denne trækning er allerede vist
  if(document.getElementById('sheetBackdrop')) return; // vent — prøves igen næste render, når dialogen er lukket
  localStorage.setItem(key, marker); // marker først NU, når vi rent faktisk viser den (undgår at "spise" den uset)
  playFreeBrokDraw();
}

function playFreeBrokDraw(previewWinnerId, isPreview){
  const winner = state.members.find(m=>m.id===(previewWinnerId || state.freeBrokMemberId));
  if(!winner) return;
  const members = state.members;
  const REEL_H = 58;

  function buildStrip(){
    const n = 14 + Math.floor(Math.random()*4);
    const syms = [];
    for(let i=0;i<n;i++) syms.push(members[Math.floor(Math.random()*members.length)]);
    syms.push(winner); // sidste symbol i strimlen — det reel'en lander på
    return syms;
  }

  const reels = [buildStrip(), buildStrip(), buildStrip()];
  const reelsHtml = reels.map((syms,ri)=>`
    <div class="reel"><div class="reel-strip" id="reelStrip${ri}">
      ${syms.map(m=>`<div class="reel-symbol"><div class="avatar">${initials(m.name)}</div></div>`).join('')}
    </div></div>
  `).join('');

  openSheet(`
    <div style="text-align:center; padding:4px 0 6px;">
      <div id="slotBanner" class="slot-banner">🎰 DAGENS GRATIS BROK${isPreview ? ' (test)' : ''}</div>
      <div class="slot-cabinet" id="slotCabinet">
        <div class="slot-window">${reelsHtml}</div>
        <button class="slot-lever" id="pullLever">🎰 Træk i håndtaget!</button>
        <div class="slot-winner-name" id="slotWinnerName">${escapeHtml(winner.name)} vandt! 🍀</div>
      </div>
    </div>
    <button class="sheet-btn ghost" id="drawCloseBtn" style="display:none; margin-top:10px;">Luk</button>
  `, ()=>{
    const cabinet = document.getElementById('slotCabinet');
    const banner = document.getElementById('slotBanner');
    const lever = document.getElementById('pullLever');
    const winnerNameEl = document.getElementById('slotWinnerName');
    const closeBtn = document.getElementById('drawCloseBtn');
    closeBtn.onclick = ()=>{
      closeSheet();
      if(!isPreview) setTimeout(()=>toast(`☀️ Dag ${dayCount()} er skudt i gang — af sted!`), 260);
    };

    if(typeof gsap !== 'undefined'){
      gsap.to(banner, { rotate: 2.5, duration: 1.1, ease: 'sine.inOut', yoyo: true, repeat: -1 });
    }

    function winConfetti(){
      const rect = cabinet.getBoundingClientRect();
      const cx = rect.left + rect.width/2, cy = rect.top + 24;
      const layer = document.createElement('div');
      layer.className = 'confetti';
      document.body.appendChild(layer);
      for(let i=0;i<24;i++){
        const c = document.createElement('div');
        c.textContent = ['🎉','✨','🪙','🎊'][Math.floor(Math.random()*4)];
        c.style.cssText = `position:absolute; left:${cx}px; top:${cy}px; font-size:${14+Math.random()*12}px;`;
        layer.appendChild(c);
        const ang = Math.random()*Math.PI - Math.PI/2 - Math.PI/2; // opad-fan
        const dist = 60 + Math.random()*120;
        if(typeof gsap !== 'undefined'){
          gsap.set(c, { xPercent:-50, yPercent:-50, opacity:1 });
          gsap.to(c, { x: Math.cos(ang)*dist, y: Math.sin(ang)*dist + 40, rotate: Math.random()*360, duration: 0.9+Math.random()*0.4, ease:'power1.out' });
          gsap.to(c, { opacity:0, duration:0.6, delay:0.5 });
        }
      }
      setTimeout(()=>layer.remove(), 1600);
    }

    function onAllStopped(){
      cabinet.classList.add('win');
      winConfetti();
      if(typeof gsap !== 'undefined'){
        gsap.fromTo(winnerNameEl, {opacity:0, y:6}, {opacity:1, y:0, duration:.4, ease:'power2.out'});
      }else{
        winnerNameEl.style.opacity = '1';
      }
      closeBtn.style.display = 'block';
      toast(`🍀 ${winner.name} har dagens gratis brok!`);
    }

    lever.onclick = ()=>{
      lever.disabled = true;
      const durations = [1.0, 1.5, 2.1];
      let doneCount = 0;
      reels.forEach((syms, ri)=>{
        const strip = document.getElementById('reelStrip'+ri);
        const distance = (syms.length-1) * REEL_H;
        const finish = ()=>{ doneCount++; if(doneCount === reels.length) onAllStopped(); };
        if(typeof gsap !== 'undefined'){
          gsap.fromTo(strip, { y: 0 }, { y: -distance, duration: durations[ri], ease: 'power3.out', onComplete: finish });
        }else{
          strip.style.transition = `transform ${durations[ri]}s ease-out`;
          strip.style.transform = `translateY(-${distance}px)`;
          setTimeout(finish, durations[ri]*1000);
        }
      });
    };
  });
}

function bounceJar(){
  const jarSvg = document.querySelector('.jar-svg');
  if(!jarSvg) return;
  const rot = Math.random() * 6 - 3;
  if(typeof gsap === 'undefined'){
    jarSvg.style.transition = 'transform .28s cubic-bezier(.34,1.56,.64,1)';
    jarSvg.style.transform = `scale(1.05) rotate(${rot}deg)`;
    setTimeout(()=>{ jarSvg.style.transform = 'scale(1) rotate(0deg)'; }, 170);
    return;
  }
  gsap.set(jarSvg, { transformOrigin: '50% 100%' });
  gsap.timeline()
    .to(jarSvg, { scale: 1.09, rotate: rot, duration: 0.14, ease: 'power2.out' })
    .to(jarSvg, { scale: 1, rotate: 0, duration: 0.7, ease: 'elastic.out(1, 0.4)' });
}

function launchCoinToJar(onDone){
  const jarWrap = document.querySelector('.jar-wrap');
  const rect = jarWrap ? jarWrap.getBoundingClientRect() : null;
  const endX = rect ? rect.left + rect.width/2 : window.innerWidth/2;
  const endY = rect ? rect.top + rect.height*0.62 : window.innerHeight*0.35;
  const startX = window.innerWidth/2;
  const startY = 64;

  const layer = document.createElement('div');
  layer.className = 'confetti';
  document.body.appendChild(layer);

  if(typeof gsap === 'undefined'){
    // Fallback uden GSAP, hvis scriptet af en eller anden grund ikke loadede
    layer.remove();
    if(onDone) onDone();
    return;
  }

  const coin = document.createElement('div');
  coin.textContent = '🪙';
  coin.style.cssText = `position:absolute; left:${startX}px; top:${startY}px; font-size:36px; z-index:2;`;
  layer.appendChild(coin);
  gsap.set(coin, { xPercent: -50, yPercent: -50, scale: 0.5, rotate: 0 });

  const impact = () => {
    // lille møntsprøjt ved nedslaget
    for(let i=0;i<9;i++){
      const c = document.createElement('div');
      c.textContent = Math.random() > 0.5 ? '🪙' : '✨';
      const ang = Math.random()*Math.PI*2, dist = 24+Math.random()*46;
      c.style.cssText = `position:absolute; left:${endX}px; top:${endY}px; font-size:${12+Math.random()*10}px;`;
      layer.appendChild(c);
      gsap.set(c, { xPercent: -50, yPercent: -50, scale: 0.6, opacity: 1 });
      gsap.to(c, {
        x: Math.cos(ang)*dist, y: Math.sin(ang)*dist - 18, rotate: Math.random()*360, scale: 1,
        duration: 0.6, ease: 'power2.out',
      });
      gsap.to(c, { opacity: 0, duration: 0.5, delay: 0.25 });
    }
    // krukken "hopper" ved nedslaget
    const jarSvg = document.querySelector('.jar-svg');
    if(jarSvg){
      gsap.set(jarSvg, { transformOrigin: '50% 100%' });
      gsap.timeline()
        .to(jarSvg, { scale: 1.09, y: 2, duration: 0.16, ease: 'power2.out' })
        .to(jarSvg, { scale: 1, y: 0, duration: 0.65, ease: 'elastic.out(1, 0.4)' });
    }
    if(onDone) onDone();
  };

  gsap.timeline()
    .to(coin, { left: endX, top: endY, scale: 1.15, rotate: 480, duration: 0.7, ease: 'power2.in' })
    .to(coin, { opacity: 0, duration: 0.2 }, '-=0.05')
    .add(impact);

  setTimeout(()=>layer.remove(), 1500);
}

  // NB: margin-top skal ALDRIG være negativ her — det trak tidligere
  // teksten op OVER/IND I den runde knap ovenover (piller har ikke ekstra
  // luft ved bunden, så en negativ margin lagde teksten oveni knappens
  // farvede baggrund i stedet for under den).
  const hintStyle = 'font-size:11.5px; color:rgba(5,32,36,0.45); margin:6px 4px 6px;';
  openSheet(`
    <h2>Admin ⚙️</h2>
    <p class="hint">Kun du styrer puljen og historikken herfra.</p>

    <div class="divider">værktøjer</div>
    <button class="sheet-btn primary" id="adminGoalBtn">🎯 Sæt mål for potten</button>
    <button class="sheet-btn primary" id="adminBroadcastBtn">📣 Send besked til alle</button>
    ${state.events.length ? `<button class="sheet-btn ghost" id="adminRemoveEventBtn">🫤 Markér mistænkt snyd</button>` : ''}
    <button class="sheet-btn gold" id="adminTestDrawBtn">🎰 Test spillemaskinen</button>

    <div class="divider">afregning</div>
    <button class="sheet-btn primary" id="adminSettleBtn">💶 Gør op (tøm puljen)</button>
    <p class="hint" style="${hintStyle}">Arkiverer og tømmer puljen. Kan fortrydes bagefter.</p>
    ${state.history.length ? `<button class="sheet-btn ghost" id="adminUndoBtn">↩️ Fortryd seneste opgørelse</button>` : ''}
    <button class="sheet-btn ghost" id="adminBackdateBtn">⏪ Ryk dagstæller én dag tilbage</button>

    <div class="divider">kan ikke fortrydes</div>
    <button class="sheet-btn danger" id="adminResetBtn">🧹 Nulstil alt</button>
    <p class="hint" style="${hintStyle}">Sletter regnskab og historik. Rummet består.</p>
    <button class="sheet-btn danger" id="adminFinalCloseBtn">🔒 Luk denne brokkekasse for altid</button>
    <p class="hint" style="${hintStyle}">Arkiverer og lukker for nyt brok. Historik bevares.</p>
    <button class="sheet-btn danger" id="adminDeleteRoomBtn">🗑️ Slet dette rum permanent</button>
    <p class="hint" style="${hintStyle}">Sletter alt med det samme. Ingen fortrydelse.</p>

    <button class="sheet-btn ghost" id="adminMenuCloseBtn">Luk menu</button>
    <p class="hint" style="text-align:center; font-size:10.5px; opacity:.4; margin-top:6px;">🔧 ${pushDebugInfo()} · ${BUILD_TAG}</p>
  `, ()=>{
    document.getElementById('adminGoalBtn').onclick = ()=>{ closeSheet(); setTimeout(openGoalSheet, 230); };
    document.getElementById('adminBroadcastBtn').onclick = ()=>{ closeSheet(); setTimeout(openBroadcastSheet, 230); };
    document.getElementById('adminSettleBtn').onclick = ()=>{ closeSheet(); setTimeout(openSettleSheet, 230); };
    const removeBtn = document.getElementById('adminRemoveEventBtn');
    if(removeBtn) removeBtn.onclick = ()=>{ closeSheet(); setTimeout(openRemoveEventSheet, 230); };
    document.getElementById('adminTestDrawBtn').onclick = ()=>{
      if(state.members.length < 2){ toast('kræver mindst 2 medlemmer for at vise dette'); return; }
      const previewWinner = state.members[Math.floor(Math.random()*state.members.length)];
      closeSheet();
      setTimeout(()=>playFreeBrokDraw(previewWinner.id, true), 230);
    };
    const undoBtn = document.getElementById('adminUndoBtn');
    if(undoBtn) undoBtn.onclick = ()=>{ closeSheet(); setTimeout(openUndoArchiveSheet, 230); };
    document.getElementById('adminBackdateBtn').onclick = async ()=>{
      try{
        const r = await api('admin', { action: 'backdate', roomId, actorId: profile.memberId });
        state = r.state;
        closeSheet();
        toast(`☀️ Dagstæller rykket — nu dag ${dayCount()}`);
      }catch(e){ toast(e.message); }
    };
    document.getElementById('adminResetBtn').onclick = ()=>{ closeSheet(); setTimeout(openResetSheet, 230); };
    document.getElementById('adminFinalCloseBtn').onclick = ()=>{ closeSheet(); setTimeout(openFinalCloseSheet, 230); };
    document.getElementById('adminDeleteRoomBtn').onclick = ()=>{ closeSheet(); setTimeout(openDeleteRoomSheet, 230); };
    document.getElementById('adminMenuCloseBtn').onclick = closeSheet;
  });
}

function openRemoveEventSheet(){
  const rows = state.events.slice().sort((a,b)=>b.ts-a.ts).map(e=>{
    const m = state.members.find(x=>x.id===e.memberId);
    const time = new Date(e.ts).toLocaleString('da-DK',{day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
    return `<div class="bal-row" style="${e.voided?'opacity:.6;':''}">
      <div class="avatar" style="width:34px;height:34px;font-size:12.5px;">${initials(m?m.name:'?')}</div>
      <div class="feed-body">
        <div class="bal-name">${escapeHtml(m?m.name:'?')}${e.free?' 🎫':''}${e.voided?' 🫤':''}</div>
        <div style="font-size:12px; color:rgba(5,32,36,0.55);">${time}${e.message?' · "'+escapeHtml(e.message)+'"':''}</div>
      </div>
      <button class="sheet-btn ghost" style="width:auto; margin:0; padding:6px 10px; font-size:12px;" data-flag-event="${e.id}" data-voided="${e.voided ? '0' : '1'}">${e.voided ? 'Fortryd' : 'Markér'}</button>
    </div>`;
  }).join('');
  openSheet(`
    <h2>Markér mistænkt snyd 🫤</h2>
    <p class="hint">Et markeret brok bliver stående i feedet, men gråtonet og streget over — og tæller ikke længere med i puljen. Ingen anklage, bare en synlig mistanke, så folk selv regulerer det. Fortryd markeringen igen hvis den var forkert.</p>
    ${rows || '<p class="hint">Ingen brok i den aktive pulje lige nu.</p>'}
    <button class="sheet-btn ghost" id="cancelRemoveEvent">Luk</button>
  `, ()=>{
    document.getElementById('cancelRemoveEvent').onclick = closeSheet;
    document.querySelectorAll('[data-flag-event]').forEach(btn=>{
      btn.onclick = async ()=>{
        try{
          const r = await api('admin', { action: 'flagEvent', roomId, actorId: profile.memberId, eventId: btn.dataset.flagEvent, voided: btn.dataset.voided === '1' });
          state = r.state;
          closeSheet();
          toast(btn.dataset.voided === '1' ? '🫤 Markeret som mistænkt' : '↩️ Markering fortrudt');
        }catch(e){ toast(e.message); }
      };
    });
  });
}

function openUndoArchiveSheet(){
  const last = state.history[state.history.length-1];
  if(!last) return;
  openSheet(`
    <h2>Fortryd seneste opgørelse ↩️</h2>
    <p class="hint">Lægger de seneste ${last.total}€ (fra ${new Date(last.startedAt).toLocaleDateString('da-DK',{day:'2-digit',month:'short'})}–${new Date(last.closedAt).toLocaleDateString('da-DK',{day:'2-digit',month:'short'})}) tilbage i den aktive pulje, som om opgørelsen aldrig skete. Kun til at rette fejl — brug det ikke bare fordi nogen fortrød en betaling.</p>
    <button class="sheet-btn danger" id="doUndo">Ja, læg det tilbage</button>
    <button class="sheet-btn ghost" id="cancelUndo">Annuller</button>
  `, ()=>{
    document.getElementById('cancelUndo').onclick = closeSheet;
    document.getElementById('doUndo').onclick = async ()=>{
      try{
        const r = await api('admin', { action: 'undoArchive', roomId, actorId: profile.memberId });
        state = r.state;
        closeSheet();
        toast('↩️ Opgørelsen er fortrudt — puljen er tilbage');
        activeTab = 'feed';
        render();
      }catch(e){ toast(e.message); }
    };
  });
}

function openGoalSheet(){
  openSheet(`
    <h2>Sæt mål for potten 🎯</h2>
    <p class="hint">Kort fri tekst der vises for alle under krukken. Fx "Fælles middag sidste aften". Kan ændres når som helst.</p>
    <input type="text" id="goalInput" maxlength="100" placeholder="Fx: Fælles middag sidste aften" value="${escapeHtml(state.goal||'')}" />
    <button class="sheet-btn primary" id="doGoal">Gem</button>
    <button class="sheet-btn ghost" id="cancelGoal">Annuller</button>
  `, ()=>{
    document.getElementById('cancelGoal').onclick = closeSheet;
    document.getElementById('doGoal').onclick = async ()=>{
      const goal = document.getElementById('goalInput').value.trim();
      try{ const r = await api('admin', { action: 'goal', roomId, actorId: profile.memberId, goal }); state = r.state; closeSheet(); toast('🎯 Mål opdateret'); render(); }
      catch(e){ toast(e.message); }
    };

function openBroadcastSheet(){
  openSheet(`
    <h2>Send besked til alle 📣</h2>
    <p class="hint">Sendes som en rigtig push-notifikation til alle der har slået notifikationer til (🔔).</p>
    <textarea id="broadcastInput" rows="3" maxlength="200" placeholder="Fx: Kære familie – nu kører det! I morgen kan du enten vinde dagens gratis brok, eller også er det bare dig der brokker dig for meget 😉"></textarea>
    <button class="sheet-btn primary" id="doBroadcast">Send</button>
    <button class="sheet-btn ghost" id="cancelBroadcast">Annuller</button>
  `, ()=>{
    document.getElementById('cancelBroadcast').onclick = closeSheet;
    document.getElementById('doBroadcast').onclick = async ()=>{
      const message = document.getElementById('broadcastInput').value.trim();
      if(!message){ toast('Skriv en besked først'); return; }

        closeSheet();

function openSettleSheet(){
  if(!state.events.length){ toast('Puljen er tom — intet at gøre op endnu 🙂'); return; }
  const bal = balances();
  const rows = state.members.map(m=>`<div class="hr-line"><span>${escapeHtml(m.name)}</span><span>${bal[m.id]||0}€</span></div>`).join('');
  openSheet(`
    <h2>Gør op 💶</h2>
    <p class="hint">Total i puljen: <b>${totalPool()}€</b>. Dette arkiverer hele puljen i historikken og starter helt forfra. Streaks og gratis brok opdateres som normalt.</p>
    ${rows}
    <button class="sheet-btn danger" id="doSettle">Bekræft og gør op</button>

  `, ()=>{
    document.getElementById('cancelSettle').onclick = closeSheet;
    document.getElementById('doSettle').onclick = async ()=>{
      try{
        const r = await api('admin', { action: 'settle', roomId, actorId: profile.memberId });
        state = r.state;
        closeSheet();
        toast('✅ Puljen er gjort op — helt tømt igen!');
        activeTab='broklisten'; brokListSubTab='alltime';

    <button class="sheet-btn danger" id="doDeleteRoom">Ja, slet permanent</button>
    <button class="sheet-btn ghost" id="cancelDeleteRoom">Annuller</button>
  `, ()=>{
    document.getElementById('cancelDeleteRoom').onclick = closeSheet;

      try{
        await api('admin', { action: 'deleteRoom', roomId, actorId: profile.memberId });

/* ============ TRÆK-NED-FOR-AT-OPDATERE ============ */
(function setupPullToRefresh(){
  const THRESHOLD = 70;
  let startY = null, pulling = false, indicator = null;

  function ensureIndicator(){
    if(indicator) return indicator;
    indicator = document.createElement('div');
    indicator.style.cssText = 'position:fixed; top:10px; left:50%; transform:translateX(-50%) scale(.6); opacity:0; z-index:90; width:34px; height:34px; border-radius:50%; background:rgba(255,247,232,0.95); display:flex; align-items:center; justify-content:center; font-size:16px; pointer-events:none; box-shadow:0 4px 12px rgba(0,0,0,.25);';
    indicator.textContent = '🔄';
    document.body.appendChild(indicator);
    return indicator;
  }
  function reset(){
    if(indicator){ indicator.style.opacity = '0'; indicator.style.transform = 'translateX(-50%) scale(.6)'; }
    startY = null; pulling = false;
  }

  document.addEventListener('touchstart', e=>{
    const main = document.getElementById('main');
    if(!main || !roomId || main.scrollTop > 0){ startY = null; return; }
    startY = e.touches[0].clientY;
    pulling = false;
  }, { passive:true });

  document.addEventListener('touchmove', e=>{
    if(startY === null) return;
    const main = document.getElementById('main');
    if(!main || main.scrollTop > 0) return;
    const dy = e.touches[0].clientY - startY;
    if(dy <= 0) return;
    pulling = true;
    const ind = ensureIndicator();
    const pull = Math.min(dy, 120);
    ind.style.transition = 'none';
    ind.style.opacity = Math.min(1, pull / THRESHOLD);
    ind.style.transform = `translateX(-50%) translateY(${Math.min(pull,60)}px) scale(${0.6 + Math.min(pull/THRESHOLD,1)*0.4}) rotate(${pull*2}deg)`;
  }, { passive:true });

  document.addEventListener('touchend', ()=>{
    if(pulling && indicator){
      indicator.style.transition = 'opacity .2s, transform .2s';
      const pulledEnough = parseFloat(indicator.style.opacity || '0') >= 1;
      if(pulledEnough){
        indicator.textContent = '⏳';
        refreshState(true).finally(()=>{ reset(); setTimeout(()=>{ if(indicator) indicator.textContent = '🔄'; }, 300); });
        return;
      }
    }
    reset();
  }, { passive:true });
})();

/* ============ INIT ============ */
boot();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    // Tjek for opdatering med det samme ved åbning, ikke kun når appen senere
    // kommer i forgrunden igen — ellers kræver en opdatering altid mindst én
    // baggrund/forgrund-cyklus efter en frisk åbning, før den overhovedet
    // opdages.
    reg.update().catch(()=>{});
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) reg.update().catch(()=>{}); });
    reg.addEventListener('updatefound', ()=>{
      const nw = reg.installing;
      if(!nw) return;
      nw.addEventListener('statechange', ()=>{
        if(nw.state === 'installed' && navigator.serviceWorker.controller){
          toast('🔄 Ny version klar — opdaterer...');
          setTimeout(()=>location.reload(), 900);
        }
      });
    });
  }).catch(()=>{});
  let swRefreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(swRefreshed) return;
    swRefreshed = true;
    location.reload();
  });
}

<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B4F55" />
<title>Brokkekassen</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Brokkekassen" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sea-deep:#073B40; --sea:#0B4F55; --sea-light:#137a7d;
    --coin:#FFC93C; --coin-dark:#E8A317; --coral:#FF6B4A;
    --cream:#FFF7E8; --ink:#052024; --ink-soft:#0b3a3f;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Work Sans', system-ui, sans-serif;
    background:
      radial-gradient(ellipse at 20% -10%, #12666b 0%, transparent 100%),
      radial-gradient(ellipse at 100% 0%, #0e5a5f 0%, transparent 100%),
      linear-gradient(180deg, var(--sea) 0%, var(--sea-deep) 100%);
    background-attachment: fixed;
    color:var(--cream); min-height:100dvh; overflow-x:hidden;
    -webkit-tap-highlight-color: transparent; user-select:none;
    -webkit-overflow-scrolling: touch;
  }
  h1,h2,h3,.display{font-family:'Baloo 2', sans-serif;}
  button{font-family:inherit;}
  #app{ max-width:480px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; position:relative; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }

  header{ padding:20px 20px 6px; display:flex; flex-direction:column; gap:4px; }
  header .title{ font-size:26px; font-weight:800; letter-spacing:-0.02em; white-space:nowrap; }
  header .title-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  header .title span{color:var(--coin);}
  .day-chip{ display:inline-block; font-size:12px; font-weight:600; background:rgba(255,247,232,0.1); border:1px solid rgba(255,247,232,0.18); padding:5px 10px; border-radius:100px; white-space:nowrap; vertical-align:middle; }

  .jar-wrap{ position:relative; display:flex; flex-direction:column; align-items:center; padding:6px 20px 4px; }
  .jar-svg{ width: min(72vw, 300px); height:auto; display:block; filter: drop-shadow(0 18px 24px rgba(0,0,0,0.35)); }
  .jar-total{ position:absolute; top:52%; left:50%; transform:translate(-50%,-50%); text-align:center; pointer-events:none; }
  .jar-total .amt{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:38px; color:var(--ink); line-height:1; }
  .jar-total .lbl{ font-size:11px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }

  .tabs{ display:flex; gap:6px; padding:14px 20px 10px; }
  .tab{ flex:1; text-align:center; padding:9px 6px; border-radius:100px; font-size:13px; font-weight:600; background:rgba(255,247,232,0.06); border:1px solid rgba(255,247,232,0.12); color:rgba(255,247,232,0.65); cursor:pointer; transition:all .15s ease; }
  .tab.active{ background:var(--cream); color:var(--sea-deep); border-color:var(--cream); }

  .segmented{ display:flex; gap:2px; background:rgba(255,247,232,0.06); border-radius:100px; padding:3px; margin-bottom:16px; }
  .segmented .seg{ flex:1; text-align:center; padding:7px 6px; border-radius:100px; font-size:12px; font-weight:700; color:rgba(255,247,232,0.5); cursor:pointer; transition:all .15s ease; }
  .segmented .seg.active{ background:rgba(255,247,232,0.15); color:var(--cream); }

  .slot-banner{ display:inline-block; background:linear-gradient(135deg, var(--coral), #e14d2e); color:#fff; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:15px; letter-spacing:.02em; padding:9px 20px; border-radius:8px; margin-bottom:16px; box-shadow:0 8px 18px rgba(255,107,74,.4); clip-path:polygon(4% 0%, 96% 0%, 100% 50%, 96% 100%, 4% 100%, 0% 50%); }
  .slot-cabinet{ background:linear-gradient(160deg,#2e2a24,#141414); border-radius:24px; padding:16px 12px 14px; box-shadow:0 12px 26px rgba(0,0,0,.4), inset 0 0 0 3px #8a6b1f; position:relative; }
  .slot-cabinet::before, .slot-cabinet::after{ content:''; position:absolute; top:10px; width:8px; height:8px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #ffe9a8, #b8860b); box-shadow:0 0 6px rgba(255,201,60,.6); }
  .slot-cabinet::before{ left:12px; } .slot-cabinet::after{ right:12px; }
  .slot-cabinet.win{ box-shadow:0 12px 26px rgba(0,0,0,.4), inset 0 0 0 3px #FFC93C, 0 0 24px rgba(255,201,60,.5); }
  .slot-window{ display:flex; gap:6px; background:#0a0a0a; border-radius:14px; padding:8px; box-shadow:inset 0 3px 14px rgba(0,0,0,.9); }
  .reel{ flex:1; height:58px; overflow:hidden; border-radius:9px; background:rgba(255,255,255,0.03); position:relative; }
  .reel::before{ content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.6), transparent 30%, transparent 70%, rgba(0,0,0,.6)); pointer-events:none; z-index:2; }
  .reel-strip{ position:absolute; top:0; left:0; right:0; }
  .reel-symbol{ height:58px; display:flex; align-items:center; justify-content:center; }
  .reel-symbol .avatar{ width:40px; height:40px; font-size:14px; }
  .slot-lever{ display:block; margin:18px auto 0; background:linear-gradient(160deg, var(--coral), #e14d2e); color:#fff; border:none; border-radius:100px; padding:13px 26px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px; box-shadow:0 8px 18px rgba(255,107,74,.4); cursor:pointer; }
  .slot-lever:active{ transform:scale(.97); }
  .slot-lever:disabled{ opacity:.5; }
  .slot-winner-name{ text-align:center; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:19px; color:var(--coral); margin-top:14px; opacity:0; }

  main{ flex:1; padding:0 16px 130px; overflow-y:auto; -webkit-overflow-scrolling:touch; }

  .feed-item{ background:rgba(255,247,232,0.07); border:1px solid rgba(255,247,232,0.1); border-radius:16px; padding:12px 14px; margin-bottom:10px; display:flex; gap:12px; align-items:flex-start; }
  .avatar{ flex:0 0 auto; width:38px;height:38px; border-radius:50%; background:linear-gradient(160deg, var(--coral), #e14d2e); color:#fff; display:flex;align-items:center;justify-content:center; font-weight:700; font-size:14px; font-family:'Baloo 2',sans-serif; }
  .feed-body{flex:1; min-width:0;}
  .feed-name{font-weight:700; font-size:14.5px; color:var(--cream);}
  .feed-name .amt{color:var(--coin); font-weight:800; margin-left:6px;}
  .feed-msg{font-size:13.5px; color:rgba(255,247,232,0.75); margin-top:2px; word-wrap:break-word;}
  .feed-time{font-size:11px; color:rgba(255,247,232,0.4); margin-top:4px;}
  .empty-state{ text-align:center; padding:50px 20px; color:rgba(255,247,232,0.55); }
  .empty-state .emoji{font-size:38px; display:block; margin-bottom:10px;}
  .empty-state b{color:var(--cream); display:block; font-family:'Baloo 2',sans-serif; font-size:17px; margin-bottom:4px;}

  .bal-row{ display:flex; align-items:center; gap:12px; background:rgba(255,247,232,0.07); border:1px solid rgba(255,247,232,0.1); border-radius:16px; padding:12px 14px; margin-bottom:10px; }
  .bal-name{flex:1; font-weight:600; font-size:14.5px;}
  .bal-amt{font-family:'Baloo 2',sans-serif; font-weight:800; font-size:19px; color:var(--coin);}
  .bal-amt.zero{color:rgba(255,247,232,0.35); font-weight:700;}
  .bal-name.me::after{ content:' (dig)'; font-weight:400; opacity:.6; font-size:12px; }

  .section-label{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:rgba(255,247,232,0.65); margin:14px 4px 10px; }

  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; padding:0 2px; }
  .bar-track{ flex:1; height:14px; background:rgba(255,247,232,0.1); border-radius:10px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:10px; background:linear-gradient(90deg, var(--coin-dark), var(--coin)); transition:width .7s cubic-bezier(.2,.8,.2,1); }
  .bar-fill.top{ background:linear-gradient(90deg, #e14d2e, var(--coral)); }
  .bar-amt{ flex:0 0 auto; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:13.5px; color:var(--coin); min-width:34px; text-align:right; white-space:nowrap; }

  .history-round{ background:rgba(255,247,232,0.05); border:1px solid rgba(255,247,232,0.1); border-radius:16px; padding:14px; margin-bottom:12px; }
  .history-round .hr-title{font-weight:700; font-family:'Baloo 2',sans-serif; font-size:16px; color:var(--coin);}
  .history-round .hr-sub{font-size:12px; color:rgba(255,247,232,0.65); margin-bottom:8px;}
  .hr-line{display:flex; justify-content:space-between; font-size:13.5px; padding:3px 0; color:rgba(255,247,232,0.8);}

  .bottombar{ position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; padding:14px 16px calc(16px + env(safe-area-inset-bottom)); background:linear-gradient(0deg, var(--sea-deep) 60%, rgba(7,59,64,0)); display:flex; gap:10px; }
  .btn-brok{ flex:1; background:linear-gradient(160deg, var(--coral), #e14d2e); color:#fff; border:none; border-radius:100px; padding:16px 10px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:18px; box-shadow:0 8px 18px rgba(255,107,74,0.35); display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-brok:active{transform:scale(0.97);}
  .btn-brok:disabled{opacity:.5;}
  .btn-settle{ flex:0 0 auto; width:52px; background:rgba(255,247,232,0.1); border:1px solid rgba(255,247,232,0.2); color:var(--cream); border-radius:100px; font-size:20px; }
  .btn-share{ flex:0 0 auto; width:52px; background:rgba(255,247,232,0.1); border:1px solid rgba(255,247,232,0.2); color:var(--cream); border-radius:100px; font-size:20px; }

  .sheet-backdrop{ position:fixed; inset:0; background:rgba(3,20,22,0.68); backdrop-filter: blur(2px); display:flex; align-items:flex-end; z-index:50; opacity:0; pointer-events:none; transition:opacity .2s ease; }
  .sheet-backdrop.show{opacity:1; pointer-events:auto;}
  .sheet{ width:100%; max-width:480px; margin:0 auto; background:var(--cream); color:var(--ink); border-radius:26px 26px 0 0; padding:10px 20px calc(24px + env(safe-area-inset-bottom)); transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.9,.3,1.2); max-height:88dvh; overflow-y:auto; }
  .sheet-backdrop.show .sheet{transform:translateY(0);}
  .sheet-handle{ width:40px;height:5px;background:rgba(5,32,36,0.18);border-radius:10px; margin:8px auto 14px; }
  .sheet h2{font-size:20px; margin:0 0 4px; font-weight:800;}
  .sheet p.hint{font-size:13px; color:rgba(5,32,36,0.55); margin:0 0 16px;}

  .name-grid{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .name-pill{ padding:10px 16px; border-radius:100px; border:2px solid rgba(5,32,36,0.12); background:#fff; color:var(--ink); font-weight:700; font-size:14.5px; cursor:pointer; }
  .name-pill.selected{ background:var(--coral); border-color:var(--coral); color:#fff; }
  .name-pill.voted{ background:var(--sea); border-color:var(--sea); color:#fff; }
  .name-pill:disabled{opacity:.4;}

  textarea, input[type=text], input[type=email]{ width:100%; border:2px solid rgba(5,32,36,0.12); border-radius:14px; padding:12px 14px; font-size:15px; font-family:inherit; background:#fff; resize:none; color:var(--ink); margin-bottom:10px; }
  textarea:focus, input:focus{outline:none; border-color:var(--sea);}
  label.field-label{ font-size:12px; font-weight:700; color:rgba(5,32,36,0.5); text-transform:uppercase; letter-spacing:.05em; margin:4px 0 6px; display:block; }

  .sheet-btn{ width:100%; padding:15px; border-radius:100px; border:none; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16px; margin-top:14px; cursor:pointer; }
  .sheet-btn.primary{background:var(--sea); color:#fff;}
  .sheet-btn.primary:disabled{background:rgba(5,32,36,0.15); color:rgba(5,32,36,0.4);}
  .sheet-btn.ghost{background:transparent; color:rgba(5,32,36,0.5); font-weight:600; font-size:14px; padding:8px;}
  .sheet-btn.danger{background:var(--coral); color:#fff;}

  .vote-progress{ display:flex; align-items:center; gap:10px; margin:6px 0 16px; font-size:13.5px; font-weight:600; color:rgba(5,32,36,0.6); }
  .vote-progress .bar{flex:1; height:8px; background:rgba(5,32,36,0.1); border-radius:10px; overflow:hidden;}
  .vote-progress .bar > div{height:100%; background:var(--coral); border-radius:10px; transition:width .25s;}

  .onboard{ padding:60px 26px 30px; text-align:center; }
  .onboard .emoji{font-size:52px;}
  .onboard h1{font-size:28px; margin:10px 0 6px;}
  .onboard p{font-size:14.5px; color:rgba(255,247,232,0.7); line-height:1.5; margin-bottom:26px;}
  .onboard-card{ background:rgba(255,247,232,0.08); border:1px solid rgba(255,247,232,0.15); border-radius:20px; padding:20px; text-align:left; }
  .onboard-card input{ background:rgba(255,247,232,0.95); }
  .divider{ display:flex; align-items:center; gap:10px; color:rgba(255,247,232,0.4); font-size:12px; margin:22px 0; }
  .divider::before, .divider::after{ content:''; flex:1; height:1px; background:rgba(255,247,232,0.15); }

  .toast{ position:fixed; top:16px; left:50%; transform:translateX(-50%) translateY(-6px); background:linear-gradient(160deg, #0d4b52, var(--ink)); color:var(--cream); padding:13px 20px; border-radius:18px; font-size:14px; font-weight:600; z-index:80; box-shadow:0 10px 28px rgba(0,0,0,.35), 0 0 0 1px rgba(255,247,232,0.08) inset; opacity:0; transition:opacity .3s ease, transform .3s cubic-bezier(.2,.9,.3,1.2); pointer-events:none; max-width:88vw; text-align:center; line-height:1.4; }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(6px);}
  .confetti{ position:fixed; inset:0; pointer-events:none; z-index:95; }
  .spinner{ width:16px;height:16px;border-radius:50%; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; display:inline-block; animation:spin .7s linear infinite; }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="gsap.min.js"></script>
<script>
/* ============ CONFIG / IDENTITY ============ */
const params = new URLSearchParams(location.search);
let roomId = (params.get('r') || localStorage.getItem('bk_lastRoom') || null);
if(roomId) roomId = roomId.toLowerCase();
let profile = JSON.parse(localStorage.getItem('bk_profile_' + roomId) || 'null'); // {memberId, name}

let state = null;
let activeTab = 'feed';
let activeApp = 'kasse'; // 'kasse' | 'spil' — hvilken af de to "apps" i samme rum der vises
let gameWager = 'fun'; // 'fun' | 'euro' — valgt i Brokspillets lobby, før spillet startes
let brokListSubTab = 'alltime'; // 'today' | 'alltime' — undersort inde i Broklisten-fanen; alltime er det vigtigste og vises først
let polling = null;
let toastTimer = null;

/* ============ ADMIN ============ */
// Den der opretter en brokkekasse er dens admin (er altid members[0] i det rum).
function isAdmin(){ return !!(state && profile && state.members[0] && state.members[0].id === profile.memberId); }

/* ============ SJOV / BANTER ============ */
const BANTER = [
  'Endnu en for retfærdighedens sejr! ⚖️',
  'Solen skinner, og nu gør puljen også! ☀️',
  'Det der koster altså — velkommen til klubben. 🎟️',
  'Brok registreret, appel afvist. 🧑‍⚖️',
  'Ka det virkelig passe? Tjah, det gjorde det. 💸',
  'En til krukken, en mindre brok i verden (håber vi). 🤞',
  'Beklager, ingen refusion på den slags brok. 🙅',
  'Krukken siger tak for donationen! 🙏',
  'Det var dyrt sagt. Bogstaveligt talt. 💰',
  'Forestil dig en verden helt uden brok... men indtil da: tak for bidraget! 😇',
  'Én dag brokker ingen sig. I dag var ikke den dag. 🌅',
  'Held og lykke med at brokke dig mindre i morgen. 🍀',
  'Verden var lidt bedre for et øjeblik siden. 🙃',
];
function randomBanter(){ return BANTER[Math.floor(Math.random()*BANTER.length)]; }

const TREATS = [
  { cost: 40, label: 'middag ude 🍽️' },
  { cost: 20, label: 'flaske god rom 🥃' },
  { cost: 12, label: 'pizza 🍕' },
  { cost: 8,  label: 'cocktail ved poolen 🍹' },
  { cost: 3,  label: 'øl 🍺' },
  { cost: 2,  label: 'is 🍦' },
];
function whatToBuy(total){
  if(total <= 0) return null;
  const t = TREATS.find(t => total >= t.cost);
  if(!t) return null;
  const n = Math.floor(total / t.cost);
  return `= ${n}× ${t.label}`;
}
function titleFor(count){
  if(count >= 10) return 'Broklegende 👑';
  if(count >= 6) return 'Storbrokker';
  if(count >= 3) return 'Rutineret brokkehoved';
  if(count >= 1) return 'Brokke-nybegynder';
  return 'Pletfri (indtil videre)';
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  const duration = Math.min(7500, Math.max(2800, msg.length * 75));
  toastTimer = setTimeout(()=>t.classList.remove('show'), duration);
}
function shareUrl(){
  const u = new URL(location.href);
  u.search = '?r=' + roomId;
  return u.toString();
}
async function doShare(){
  const url = shareUrl();
  if(navigator.share){
    try{ await navigator.share({ title:'Brokkekassen', text:'Kom med i vores brokkekasse!', url }); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }
  }
  try{ await navigator.clipboard.writeText(url); toast('Link til Brokkekassen kopieret. Send det til deltagere.'); }
  catch(e){ prompt('Kopiér linket manuelt:', url); }
}
/* ============ PUSH-NOTIFIKATIONER ============ */
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
function pushSupported(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function pushEnabledLocally(){ return localStorage.getItem('bk_push_enabled_' + roomId) === '1'; }
async function enablePush(){
  if(!pushSupported()){ toast('Understøttes ikke her (mangler serviceWorker/PushManager/Notification)'); return false; }
  toast('Nuværende tilladelse: ' + Notification.permission + ' — spørger...');
  await new Promise(r=>setTimeout(r, 1300));
  try{
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ toast('Notifikationer blev ikke tilladt (' + perm + ')'); return false; }
    toast('Tilladt! Henter nøgle...');
    const { publicKey } = await api('vapid-public-key');
    if(!publicKey){ toast('Push er ikke sat op på serveren endnu (mangler VAPID-nøgle)'); return false; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){ sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: urlBase64ToUint8Array(publicKey) }); }
    await api('subscribe', { roomId, memberId: profile.memberId, subscription: sub.toJSON() });
    localStorage.setItem('bk_push_enabled_' + roomId, '1');
    toast('🔔 Du får nu besked når nogen brokker sig');
    return true;
  }catch(e){ toast('Fejl: ' + e.message); return false; }
}

function extractRoomId(input){
  input = (input||'').trim();
  if(!input) return null;
  try{
    const u = new URL(input);
    const r = u.searchParams.get('r');
    if(r) return r.toLowerCase();
  }catch(e){}
  return input.toLowerCase();
}
function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function fmtTime(ts){
  const d = new Date(ts), now = new Date();
  const time = d.toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'});
  if(d.toDateString() === now.toDateString()) return 'i dag ' + time;
  return d.toLocaleDateString('da-DK',{day:'2-digit',month:'short'}) + ' ' + time;
}
function dayCount(){
  if(!state || !state.createdAt) return 0;
  return Math.max(1, Math.floor((Date.now() - state.createdAt)/86400000) + 1);
}
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ============ API ============ */
async function api(path, body){
  const r = await fetch('/api/' + path, {
    method: body ? 'POST' : 'GET',
    headers: body ? {'Content-Type':'application/json'} : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error || 'Noget gik galt');
  return data;
}

let lastStateJSON = null;
async function refreshState(silent){
  try{
    const { state: s } = await api('state?room=' + encodeURIComponent(roomId));
    const json = JSON.stringify(s);
    if(silent && json === lastStateJSON) return; // intet nyt — undgå at afbryde en igangværende scroll unødigt
    lastStateJSON = json;
    state = s;
    const typingTag = document.activeElement && document.activeElement.tagName;
    if(silent && activeApp === 'spil' && (typingTag === 'TEXTAREA' || typingTag === 'INPUT')) return; // undgå at nulstille et svar man er ved at skrive i Brokspillet
    render();
  }catch(e){
    if(!silent) toast('Kunne ikke hente data: ' + e.message);
  }
}
function startPolling(){
  if(polling) clearInterval(polling);
  polling = setInterval(()=>refreshState(true), 3000);
}
document.addEventListener('visibilitychange', ()=>{
  if(!roomId) return;
  if(document.hidden){
    if(polling){ clearInterval(polling); polling = null; }
  }else{
    refreshState(true);
    startPolling();
  }
});

/* ============ APP ENTRY ============ */
const app = document.getElementById('app');

async function boot(){
  if(!roomId){
    renderCreateOrJoin();
    return;
  }
  await enterRoom();
}

async function enterRoom(){
  localStorage.setItem('bk_lastRoom', roomId);
  app.innerHTML = `<div class="onboard"><div class="spinner" style="width:28px;height:28px;border-width:3px;margin-top:100px;"></div></div>`;
  try{
    const { state: s } = await api('state?room=' + encodeURIComponent(roomId));
    state = s;
  }catch(e){
    renderCreateOrJoin('Den brokkekasse findes ikke længere. Opret en ny, eller tjek linket.');
    return;
  }
  if(!profile || !state.members.find(m=>m.id===profile.memberId)){
    renderWhoAmI();
    return;
  }
  rememberRoom();
  render();
  startPolling();
}

/* ============ FLERE KASSER (gemt lokalt, ikke i skyen) ============ */
function getMyRooms(){
  try{ return JSON.parse(localStorage.getItem('bk_myRooms') || '{}'); }catch(e){ return {}; }
}
function rememberRoom(){
  if(!roomId || !profile) return;
  const rooms = getMyRooms();
  rooms[roomId] = { name: profile.name, ts: Date.now() };
  localStorage.setItem('bk_myRooms', JSON.stringify(rooms));
}
async function switchToRoom(rid){
  roomId = rid.toLowerCase();
  profile = JSON.parse(localStorage.getItem('bk_profile_' + roomId) || 'null');
  const u = new URL(location.href); u.search = '?r=' + roomId;
  history.replaceState(null,'',u.toString());
  await enterRoom();
}
function leaveRoom(){
  if(polling){ clearInterval(polling); polling = null; }
  localStorage.removeItem('bk_lastRoom');
  roomId = null; profile = null; state = null;
  const u = new URL(location.href); u.search = '';
  history.replaceState(null,'',u.toString());
  closeSheet();
  renderCreateOrJoin();
}
function openLeaveRoomSheet(){
  openSheet(`

}

function totalPool(){ return state.events.filter(e=>!e.free && !e.voided).length; }
// Alle nuværende (endnu ikke afregnede) brok — kan sagtens strække sig over flere dage.
function balances(){
  const map = {}; state.members.forEach(m=>map[m.id]=0);
  state.events.forEach(e=>{ if(!e.free && !e.voided && map[e.memberId]!==undefined) map[e.memberId]++; });
  return map;
}
// Kun dagens brok (siden kl. 04), til "Dagens BigSpender".
function todayBalances(){
  const map = {}; state.members.forEach(m=>map[m.id]=0);
  state.events.forEach(e=>{ if(!e.free && !e.voided && e.ts >= state.dayBoundary && map[e.memberId]!==undefined) map[e.memberId]++; });
  return map;
}

function gameBodyHtml(g){
  if(!g.active || !g.current) return gameLobbyHtml();
  const cur = g.current;
  if(cur.type === 'gameover') return gameOverHtml(g, cur);
  if(cur.type === 'quiplash') return quiplashHtml(g, cur);
  if(cur.type === 'truefalse') return truefalseHtml(g, cur);
  if(cur.type === 'trivia') return triviaHtml(g, cur);
  return '';
}

  return `

function quiplashHtml(g, cur){
  if(cur.phase === 'answer'){
    const answered = Object.keys(cur.answers||{}).length;
    const mine = profile && cur.answers[profile.memberId];
    return `
      <div class="section-label">Runde ${g.round}/${g.totalRounds} · 🎭 Skriv-og-stem</div>
      <div class="onboard-card">
        <p style="font-weight:700; font-size:16px; margin:0 0 14px;">${escapeHtml(cur.prompt)}</p>
        <textarea id="quipInput" rows="2" maxlength="120" placeholder="Dit svar...">${mine?escapeHtml(mine):''}</textarea>
        <button class="sheet-btn primary" id="quipSubmitBtn" style="margin-top:10px;">${mine?'Opdatér svar':'Send svar'}</button>
      </div>
      <p class="hint" style="text-align:center;">${answered}/${state.members.length} har svaret</p>
      <button class="sheet-btn ghost" id="advanceBtn">👉 Gå videre til afstemning</button>
    `;
  }
  if(cur.phase === 'vote'){
    const entries = Object.entries(cur.answers||{}).filter(([id])=>id!==(profile&&profile.memberId));
    const myVote = profile && cur.votes[profile.memberId];
    const votedCount = Object.keys(cur.votes||{}).length;
    const rows = entries.map(([id,text],i)=>`
      <div class="bal-row" data-vote-for="${id}" style="cursor:pointer; ${myVote===id?'outline:2px solid var(--sea);':''}">
        <div class="avatar" style="width:34px;height:34px;font-size:12.5px;">${i+1}</div>
        <div class="feed-body"><div class="bal-name">"${escapeHtml(text)}"</div></div>
        ${myVote===id?'<span style="font-size:18px;">✓</span>':''}
      </div>
    `).join('');
    return `
      <div class="section-label">Runde ${g.round}/${g.totalRounds} · Stem på det bedste svar</div>
      <p class="hint" style="margin:0 0 10px;">${escapeHtml(cur.prompt)}</p>
      ${rows || '<p class="hint">Ingen andre svar at stemme på.</p>'}
      <p class="hint" style="text-align:center;">${votedCount}/${state.members.length} har stemt</p>
      <button class="sheet-btn ghost" id="advanceBtn">👉 Afslør vinderen</button>
    `;
  }
  const winners = (cur.winnerIds||[]).map(id=>state.members.find(m=>m.id===id)).filter(Boolean);
  return `
    <div class="section-label">Runde ${g.round}/${g.totalRounds} · Resultat</div>
    <div class="onboard-card" style="text-align:center;">
      <p style="margin:0 0 10px;">${escapeHtml(cur.prompt)}</p>
      ${Object.entries(cur.answers||{}).map(([id,text])=>{
        const m = state.members.find(x=>x.id===id);
        const won = (cur.winnerIds||[]).includes(id);
        return `<div class="feed-item" style="${won?'border-color:var(--coin); background:rgba(255,201,60,0.1);':''}">
          <div class="avatar">${initials(m?m.name:'?')}</div>
          <div class="feed-body"><div class="feed-name">${escapeHtml(m?m.name:'?')} ${won?'🏆':''}</div><div class="feed-msg">"${escapeHtml(text)}"</div></div>
        </div>`;
      }).join('')}
      <p style="font-weight:700; margin-top:10px;">${winners.length ? '🏆 ' + winners.map(w=>escapeHtml(w.name)).join(' & ') + ' vandt runden!' : 'Ingen stemmer denne gang.'}</p>
    </div>
    <button class="sheet-btn primary" id="advanceBtn">👉 Næste runde</button>
  `;
}

function truefalseHtml(g, cur){
  const author = state.members.find(m=>m.id===cur.authorId);
  const isAuthor = profile && profile.memberId === cur.authorId;
  if(cur.phase === 'write'){
    if(!isAuthor){
      return `
        <div class="section-label">Runde ${g.round}/${g.totalRounds} · ⚖️ Sandt eller falsk</div>

      <div class="section-label">Runde ${g.round}/${g.totalRounds} · ⚖️ Sandt eller falsk</div>
      <div class="onboard-card" style="text-align:center;">

        ${isAuthor ? '<p class="hint">Du skrev det — vent på de andres gæt.</p>' : `
          <div style="display:flex; gap:10px; margin-top:14px;">
            <button class="sheet-btn primary" data-guess="true" style="margin-top:0;">✅ Sandt</button>

  return `

      <p class="hint" style="margin-top:8px;">${correct.length ? '🏆 ' + correct.map(m=>escapeHtml(m.name)).join(', ') + ' gættede rigtigt' : (Object.keys(cur.guesses||{}).length ? 'Ingen gættede rigtigt — point til ' + escapeHtml(author?author.name:'?') + '!' : 'Ingen nåede at gætte.')}</p>

function bindGameHandlers(g){
  const cur = g.current;
  document.querySelectorAll('[data-wager]').forEach(el=>{
    el.onclick = ()=>{ gameWager = el.dataset.wager; render(); };
  });
  const startBtn = document.getElementById('startGameBtn');
  if(startBtn) startBtn.onclick = ()=> gameApi('start', { wager: gameWager });

  const advanceBtn = document.getElementById('advanceBtn');
  if(advanceBtn) advanceBtn.onclick = ()=> gameApi('advance', {});

  const playAgainBtn = document.getElementById('playAgainBtn');
  if(playAgainBtn) playAgainBtn.onclick = ()=>{
    gameApi('end', {}).then(()=> gameApi('start', { wager: gameWager }));
  };
  const endGameBtn = document.getElementById('endGameBtn');
  if(endGameBtn) endGameBtn.onclick = ()=> gameApi('end', {});

  if(!cur) return;

  if(cur.type === 'quiplash' && cur.phase === 'answer'){
    const btn = document.getElementById('quipSubmitBtn');
    if(btn) btn.onclick = ()=>{
      const text = document.getElementById('quipInput').value.trim();
      if(!text) return;
      gameApi('submit', { payload: { text } });
    };
  }
  if(cur.type === 'quiplash' && cur.phase === 'vote'){
    document.querySelectorAll('[data-vote-for]').forEach(el=>{
      el.onclick = ()=> gameApi('submit', { payload: { votedFor: el.dataset.voteFor } });
    });
  }
  if(cur.type === 'truefalse' && cur.phase === 'write' && profile && profile.memberId === cur.authorId){
    let chosenTarget = profile.memberId;
    let chosenTruth = true;
    document.querySelectorAll('#ttTargetGrid .name-pill').forEach(p=>{
      p.onclick = ()=>{
        document.querySelectorAll('#ttTargetGrid .name-pill').forEach(x=>x.classList.remove('selected'));
        p.classList.add('selected'); chosenTarget = p.dataset.target;
      };
    });
    document.querySelectorAll('[data-truth]').forEach(seg=>{
      seg.onclick = ()=>{
        document.querySelectorAll('[data-truth]').forEach(x=>x.classList.remove('active'));
        seg.classList.add('active'); chosenTruth = seg.dataset.truth === 'true';
      };
    });
    const input = document.getElementById('ttStatement');
    const submitBtn = document.getElementById('ttSubmitBtn');
    input.addEventListener('input', ()=>{ submitBtn.disabled = !input.value.trim(); });
    submitBtn.onclick = ()=>{
      const statement = input.value.trim();
      if(!statement) return;
      gameApi('submit', { payload: { targetId: chosenTarget, statement, isTrue: chosenTruth } });
    };
  }
  if(cur.type === 'truefalse' && cur.phase === 'guess' && profile && profile.memberId !== cur.authorId){
    document.querySelectorAll('[data-guess]').forEach(btn=>{
      btn.onclick = ()=> gameApi('submit', { payload: { guess: btn.dataset.guess === 'true' } });
    });
  }
  if(cur.type === 'trivia' && cur.phase === 'answer'){
    document.querySelectorAll('[data-choice]').forEach(el=>{
      el.onclick = ()=> gameApi('submit', { payload: { choiceIndex: parseInt(el.dataset.choice,10) } });
    });
  }
}

function jarSVG(fillPct){
  const fillY = 190 - (fillPct/100)*150;
  return `
  <svg class="jar-svg" viewBox="0 0 220 240" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="coinFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FFE49E"/><stop offset="55%" stop-color="#FFC93C"/><stop offset="100%" stop-color="#E8A317"/>
      </linearGradient>
      <clipPath id="jarClip"><path d="M40 34 Q40 26 50 26 L170 26 Q180 26 180 34 L180 178 Q180 210 150 210 L70 210 Q40 210 40 178 Z"/></clipPath>
    </defs>
    <rect x="72" y="6" width="76" height="20" rx="6" fill="#cfd6d2"/>
    <rect x="72" y="6" width="76" height="8" rx="4" fill="#e8ece9"/>
    <path d="M40 34 Q40 26 50 26 L170 26 Q180 26 180 34 L180 178 Q180 210 150 210 L70 210 Q40 210 40 178 Z" fill="rgba(255,247,232,0.12)" stroke="rgba(255,247,232,0.55)" stroke-width="3"/>
    <g clip-path="url(#jarClip)">
      <rect x="30" y="${fillY}" width="160" height="${230-fillY}" fill="url(#coinFill)"/>
      <path id="waveTop" d="M0 ${fillY} Q30 ${fillY-6} 60 ${fillY} T120 ${fillY} T180 ${fillY} T240 ${fillY} V230 H0 Z" fill="#FFE49E" opacity="0.5"/>
      ${coinDots(fillY)}
    </g>
    <path d="M52 34 Q48 34 48 42 L48 172" stroke="rgba(255,247,232,0.5)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </svg>`;
}
function coinDots(fillY){
  if(fillY >= 208) return '';
  let dots = '';
  const rows = Math.floor((210-fillY)/16);
  for(let i=0;i<Math.min(rows*3, 26);i++){
    const x = 55 + (i*37)%110 + (i%2?8:0);
    const y = fillY + 10 + Math.floor(i/3)*15;
    dots += `<ellipse cx="${x}" cy="${y}" rx="9" ry="4" fill="#E8A317" opacity="0.55"/>`;
  }
  return dots;
}

function bindPendingCardHandlers(){
  document.querySelectorAll('[data-voter]').forEach(el=>{
    el.onclick = async ()=>{
      if(!profile || el.dataset.voter !== profile.memberId) return;
      const pendingId = el.dataset.pending;
      const p = state.pendingList.find(x=>x.id===pendingId);
      const complainer = p && state.members.find(m=>m.id===p.memberId);
      try{
        const r = await api('vote', { roomId, voterId: profile.memberId, pendingId });
        state = r.state;
        if(r.confirmed){
          launchCoinToJar(()=>{
            if(r.free){
              toast(`🎫 ${complainer ? complainer.name : 'Nogen'} brugte sit gratis brok — denne var på husets regning!`);
            }else{
              toast(`💰 ${complainer ? complainer.name : 'Nogen'} skylder nu 1€ mere — ${randomBanter()}`);
            }
            render();
          });
        }else{
          render();

      }catch(e){ toast(e.message); await refreshState(true); }

function renderFeed(main){
  const pendingCards = (state.pendingList||[]).slice().sort((a,b)=>a.openedAt-b.openedAt).map(renderPendingCard).join('');
  const winner = state.freeBrokMemberId ? state.members.find(m=>m.id===state.freeBrokMemberId) : null;
  const winnerBanner = winner ? `<div class="feed-item" style="border-style:dashed; border-color:rgba(255,201,60,0.5); background:rgba(255,201,60,0.1); align-items:center;">
    <div class="avatar" style="background:linear-gradient(160deg,#ffc93c,#e8a317); color:var(--ink);">🍀</div>
    <div class="feed-body"><div class="feed-name">${escapeHtml(winner.name)} har vundet 1 gratis brok i dag</div><div class="feed-msg">Ét brok i dag er på husets regning</div></div>
  </div>` : '';
  // Gammelt brok kan enten stadig ligge i state.events (bare ældre end i dag)
  // eller allerede være arkiveret i historikken (fx fra en tidligere "Gør op",
  // eller fra tiden inden krukken holdt op med at tømme sig selv hver nat).
  const historyEvents = [];
  state.history.forEach(round => (round.events||[]).forEach(e => historyEvents.push(e)));
  const acquittalEvents = (state.acquittals||[]).map(a => ({ ...a, ts: a.expiredAt, acquitted: true }));
  const allEvents = [...historyEvents, ...state.events, ...acquittalEvents];
  if(!allEvents.length && !state.pendingList.length){
    main.innerHTML = winnerBanner + `<div class="empty-state"><span class="emoji">🤐</span><b>Ingen brok endnu</b>Første gang nogen brokker sig, koster det 1€. Hold øje!</div>`;
    return;
  }
  const sorted = allEvents.slice().sort((a,b)=>b.ts-a.ts);
  const fresh = sorted.filter(e=>e.ts >= state.dayBoundary);
  const stale = sorted.filter(e=>e.ts < state.dayBoundary);
  const freshRows = fresh.map(e=>feedItemHtml(e, false)).join('');
  const staleRows = stale.map(e=>feedItemHtml(e, true)).join('');
  const quietToday = !fresh.length && !!stale.length
    ? `<div class="empty-state" style="padding:24px 20px 10px;"><span class="emoji">🤐</span><b>Stille indtil videre i dag</b>Rul ned og nyd gårsdagens elendighed.</div>`
    : '';
  main.innerHTML = pendingCards + winnerBanner + quietToday
    + (fresh.length ? `<div class="section-label">Seneste brok</div>${freshRows}` : '')
    + (stale.length ? `<div class="section-label" style="margin-top:${fresh.length?22:10}px;">📜 Gammelt brok</div>${staleRows}` : '');
  bindPendingCardHandlers();
}
function allTimeTotals(){
  const totals = {};
  state.members.forEach(m=>totals[m.id]=0);
  state.history.forEach(round=>{
    Object.entries(round.totals||{}).forEach(([id,amt])=>{ if(totals[id]!==undefined) totals[id]+=amt; });
  });
  const live = balances();
  Object.entries(live).forEach(([id,amt])=>{ if(totals[id]!==undefined) totals[id]+=amt; });
  return totals;
}

function spotlightCards(vals){
  const members = state.members;
  const maxV = Math.max(0, ...Object.values(vals));
  if(maxV <= 0) return '';
  const minV = Math.min(...members.map(m=>vals[m.id]||0));
  const topNames = members.filter(m=>(vals[m.id]||0) === maxV).map(m=>m.name).join(' & ');
  const saintNames = minV < maxV ? members.filter(m=>(vals[m.id]||0) === minV).map(m=>m.name).join(' & ') : null;
  const card = (title, emoji, names, amt, accent) => `
    <div style="flex:1; background:${accent ? 'rgba(255,107,74,0.14)' : 'rgba(255,247,232,0.07)'}; border:1px solid ${accent ? 'rgba(255,107,74,0.35)' : 'rgba(255,247,232,0.15)'}; border-radius:16px; padding:12px; text-align:center;">
      <div style="font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:rgba(255,247,232,0.68);">${emoji} ${title}</div>
      <div style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:${names.length>14?'12.5':'15'}px; color:var(--cream); margin-top:4px; line-height:1.2;">${escapeHtml(names)}</div>
      <div style="font-size:12px; color:var(--coin);">${amt}€</div>
    </div>`;
  return `<div style="display:flex; gap:10px; margin-bottom:18px;">
    ${card('TopBrokker', '🏆', topNames, maxV, true)}
    ${saintNames ? card('Helgenen', '😇', saintNames, minV, false) : ''}
  </div>`;
}

function renderBalanceToday(main){
  const bal = todayBalances();
  const balValues = Object.values(bal);
  const maxAmt = Math.max(0, ...balValues);
  const minAmt = balValues.length ? Math.min(...balValues) : 0;
  const streaks = state.streaks || {};
  const rows = [...state.members].sort((a,b)=>bal[b.id]-bal[a.id]).map(m=>{
    const amt = bal[m.id]||0;
    const isTop = amt > 0 && amt === maxAmt;
    const isLeast = maxAmt > minAmt && amt === minAmt;
    const crown = isTop ? ' 👑' : (isLeast ? ' 😇' : '');
    const freeTag = state.freeBrokMemberId === m.id ? ' 🎫' : '';
    const streak = streaks[m.id] || 0;
    let sub;
    if(state.freeBrokMemberId === m.id) sub = 'Har dagens gratis brok';
    else if(isTop) sub = 'TopBrokker i dag';
    else if(isLeast) sub = 'Helgenen i dag 😇';
    else if(streak > 0) sub = `🔥 ${streak} dag${streak===1?'':'e'} uden brok`;
    else sub = titleFor(amt);
    return `<div class="bal-row"><div class="avatar" style="width:34px;height:34px;font-size:12.5px;">${initials(m.name)}</div><div class="feed-body"><div class="bal-name ${profile && m.id===profile.memberId?'me':''}">${escapeHtml(m.name)}${crown}${freeTag}</div><div style="font-size:12px; color:rgba(255,247,232,0.68);">${sub}</div></div><div class="bal-amt ${amt===0?'zero':''}">${amt}€</div></div>`;
  }).join('');

  main.innerHTML = spotlightCards(bal) + `<div class="section-label">💸 Dagens regnskab</div>` + rows;
}
function renderAllTimeHistory(main){
  const totals = allTimeTotals();
  const totalValues = Object.values(totals);
  const maxTotal = Math.max(0, ...totalValues);
  const minTotal = totalValues.length ? Math.min(...totalValues) : 0;
  const anyTotal = maxTotal > 0;
  const chart = anyTotal ? (
    spotlightCards(totals) +
    `<div class="section-label">Alle medlemmer — alle tider</div>` +
    [...state.members].sort((a,b)=>totals[b.id]-totals[a.id]).map(m=>{
      const amt = totals[m.id]||0;
      const isTop = amt > 0 && amt === maxTotal;
      const isLeast = maxTotal > minTotal && amt === minTotal;
      const pct = amt > 0 ? Math.max(6, Math.round(amt/maxTotal*100)) : 0;
      const badge = isTop ? ' 🏆' : (isLeast ? ' 😇' : '');
      return `<div class="bar-row"><div class="avatar" style="width:30px;height:30px;font-size:11px;">${initials(m.name)}</div><div class="bar-track"><div class="bar-fill ${isTop?'top':''}" style="width:${pct}%;"></div></div><div class="bar-amt">${amt}€${badge}</div></div>`;
    }).join('')
  ) : '';

  if(!state.history.length){
    main.innerHTML = chart + `<div class="empty-state"><span class="emoji">📜</span><b>Ingen afsluttede dage endnu</b>Dage afsluttes automatisk kl. 04, eller tryk 💶 for at gøre op tidligere.</div>`;
    return;
  }
  const days = `<div class="section-label" style="margin-top:${anyTotal?22:0}px;">🗓️ Dag for dag</div>` + [...state.history].reverse().map(r=>{
    const lines = Object.entries(r.totals).map(([id,amt])=>{
      const m = state.members.find(x=>x.id===id);
      return `<div class="hr-line"><span>${escapeHtml(m?m.name:'?')}</span><span>${amt}€</span></div>`;
    }).join('');
    const start = new Date(r.startedAt).toLocaleDateString('da-DK',{day:'2-digit',month:'short'});
    const end = new Date(r.closedAt).toLocaleDateString('da-DK',{day:'2-digit',month:'short'});
    return `<div class="history-round"><div class="hr-title">${r.total}€ i alt</div><div class="hr-sub">${start} – ${end} · ${r.events.length} brok</div>${lines}</div>`;
  }).join('');
  main.innerHTML = chart + days;
}

function openSheet(html, onOpen){
  let backdrop = document.getElementById('sheetBackdrop');
  if(backdrop) backdrop.remove();
  backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  backdrop.id = 'sheetBackdrop';
  backdrop.innerHTML = `<div class="sheet"><div class="sheet-handle"></div>${html}</div>`;
  backdrop.addEventListener('click', e=>{ if(e.target === backdrop) closeSheet(); });
  document.body.appendChild(backdrop);
  requestAnimationFrame(()=>backdrop.classList.add('show'));
  bindSheetSwipe(backdrop.querySelector('.sheet'));
  if(onOpen) onOpen();
}
function bindSheetSwipe(sheetEl){
  let startY = null, currentY = 0, dragging = false;
  sheetEl.addEventListener('touchstart', e=>{
    if(sheetEl.scrollTop > 0){ startY = null; return; }
    startY = e.touches[0].clientY;
    dragging = false;
  }, { passive:true });
  sheetEl.addEventListener('touchmove', e=>{
    if(startY === null) return;
    const dy = e.touches[0].clientY - startY;
    if(dy <= 0 || sheetEl.scrollTop > 0) return;
    dragging = true;
    currentY = dy;
    sheetEl.style.transition = 'none';
    sheetEl.style.transform = `translateY(${dy}px)`;
  }, { passive:true });
  sheetEl.addEventListener('touchend', ()=>{
    if(dragging){
      if(currentY > 90){
        sheetEl.style.transition = 'transform .2s ease';
        sheetEl.style.transform = 'translateY(100%)';
        setTimeout(closeSheet, 200);
      }else{
        sheetEl.style.transition = '';
        sheetEl.style.transform = '';
      }
    }
    startY = null; dragging = false; currentY = 0;
  }, { passive:true });
}
function closeSheet(){
  const b = document.getElementById('sheetBackdrop');
  if(!b) return;
  b.classList.remove('show');
  setTimeout(()=>b.remove(), 220);
}

function checkFreeBrokReveal(){
  if(!state || !state.freeBrokMemberId || !state.members.length) return;

  const key = 'bk_lastFreeReveal_' + roomId;
  if(localStorage.getItem(key) === marker) return; // denne trækning er allerede vist
  if(document.getElementById('sheetBackdrop')) return; // vent — prøves igen næste render, når dialogen er lukket
  localStorage.setItem(key, marker); // marker først NU, når vi rent faktisk viser den (undgår at "spise" den uset)
  playFreeBrokDraw();
}

function playFreeBrokDraw(previewWinnerId, isPreview){
  const winner = state.members.find(m=>m.id===(previewWinnerId || state.freeBrokMemberId));
  if(!winner) return;
  const members = state.members;
  const REEL_H = 58;

  function buildStrip(){
    const n = 14 + Math.floor(Math.random()*4);
    const syms = [];
    for(let i=0;i<n;i++) syms.push(members[Math.floor(Math.random()*members.length)]);
    syms.push(winner); // sidste symbol i strimlen — det reel'en lander på
    return syms;
  }

  const reels = [buildStrip(), buildStrip(), buildStrip()];
  const reelsHtml = reels.map((syms,ri)=>`
    <div class="reel"><div class="reel-strip" id="reelStrip${ri}">
      ${syms.map(m=>`<div class="reel-symbol"><div class="avatar">${initials(m.name)}</div></div>`).join('')}
    </div></div>
  `).join('');

  openSheet(`
    <div style="text-align:center; padding:4px 0 6px;">
      <div id="slotBanner" class="slot-banner">🎰 DAGENS GRATIS BROK${isPreview ? ' (test)' : ''}</div>
      <div class="slot-cabinet" id="slotCabinet">
        <div class="slot-window">${reelsHtml}</div>
        <button class="slot-lever" id="pullLever">🎰 Træk i håndtaget!</button>
        <div class="slot-winner-name" id="slotWinnerName">${escapeHtml(winner.name)} vandt! 🍀</div>
      </div>
    </div>
    <button class="sheet-btn ghost" id="drawCloseBtn" style="display:none; margin-top:10px;">Luk</button>
  `, ()=>{
    const cabinet = document.getElementById('slotCabinet');
    const banner = document.getElementById('slotBanner');
    const lever = document.getElementById('pullLever');
    const winnerNameEl = document.getElementById('slotWinnerName');
    const closeBtn = document.getElementById('drawCloseBtn');
    closeBtn.onclick = ()=>{
      closeSheet();
      if(!isPreview) setTimeout(()=>toast(`☀️ Dag ${dayCount()} er skudt i gang — af sted!`), 260);
    };

    if(typeof gsap !== 'undefined'){
      gsap.to(banner, { rotate: 2.5, duration: 1.1, ease: 'sine.inOut', yoyo: true, repeat: -1 });
    }

    function winConfetti(){
      const rect = cabinet.getBoundingClientRect();
      const cx = rect.left + rect.width/2, cy = rect.top + 24;
      const layer = document.createElement('div');
      layer.className = 'confetti';
      document.body.appendChild(layer);
      for(let i=0;i<24;i++){
        const c = document.createElement('div');
        c.textContent = ['🎉','✨','🪙','🎊'][Math.floor(Math.random()*4)];
        c.style.cssText = `position:absolute; left:${cx}px; top:${cy}px; font-size:${14+Math.random()*12}px;`;
        layer.appendChild(c);
        const ang = Math.random()*Math.PI - Math.PI/2 - Math.PI/2; // opad-fan
        const dist = 60 + Math.random()*120;
        if(typeof gsap !== 'undefined'){
          gsap.set(c, { xPercent:-50, yPercent:-50, opacity:1 });
          gsap.to(c, { x: Math.cos(ang)*dist, y: Math.sin(ang)*dist + 40, rotate: Math.random()*360, duration: 0.9+Math.random()*0.4, ease:'power1.out' });
          gsap.to(c, { opacity:0, duration:0.6, delay:0.5 });
        }
      }
      setTimeout(()=>layer.remove(), 1600);
    }

    function onAllStopped(){
      cabinet.classList.add('win');
      winConfetti();
      if(typeof gsap !== 'undefined'){
        gsap.fromTo(winnerNameEl, {opacity:0, y:6}, {opacity:1, y:0, duration:.4, ease:'power2.out'});
      }else{
        winnerNameEl.style.opacity = '1';
      }
      closeBtn.style.display = 'block';
      toast(`🍀 ${winner.name} har dagens gratis brok!`);
    }

    lever.onclick = ()=>{
      lever.disabled = true;
      const durations = [1.0, 1.5, 2.1];
      let doneCount = 0;
      reels.forEach((syms, ri)=>{
        const strip = document.getElementById('reelStrip'+ri);
        const distance = (syms.length-1) * REEL_H;
        const finish = ()=>{ doneCount++; if(doneCount === reels.length) onAllStopped(); };
        if(typeof gsap !== 'undefined'){
          gsap.fromTo(strip, { y: 0 }, { y: -distance, duration: durations[ri], ease: 'power3.out', onComplete: finish });
        }else{
          strip.style.transition = `transform ${durations[ri]}s ease-out`;
          strip.style.transform = `translateY(-${distance}px)`;
          setTimeout(finish, durations[ri]*1000);
        }
      });
    };
  });
}

function bounceJar(){
  const jarSvg = document.querySelector('.jar-svg');
  if(!jarSvg) return;
  const rot = Math.random() * 6 - 3;
  if(typeof gsap === 'undefined'){
    jarSvg.style.transition = 'transform .28s cubic-bezier(.34,1.56,.64,1)';
    jarSvg.style.transform = `scale(1.05) rotate(${rot}deg)`;
    setTimeout(()=>{ jarSvg.style.transform = 'scale(1) rotate(0deg)'; }, 170);
    return;
  }
  gsap.set(jarSvg, { transformOrigin: '50% 100%' });
  gsap.timeline()
    .to(jarSvg, { scale: 1.09, rotate: rot, duration: 0.14, ease: 'power2.out' })
    .to(jarSvg, { scale: 1, rotate: 0, duration: 0.7, ease: 'elastic.out(1, 0.4)' });
}

let jarIdleTween = null;
function startJarIdleWave(){

  if(typeof gsap === 'undefined') return;

function launchCoinToJar(onDone){
  const jarWrap = document.querySelector('.jar-wrap');
  const rect = jarWrap ? jarWrap.getBoundingClientRect() : null;
  const endX = rect ? rect.left + rect.width/2 : window.innerWidth/2;
  const endY = rect ? rect.top + rect.height*0.62 : window.innerHeight*0.35;
  const startX = window.innerWidth/2;
  const startY = 64;

  const layer = document.createElement('div');
  layer.className = 'confetti';
  document.body.appendChild(layer);

  if(typeof gsap === 'undefined'){
    // Fallback uden GSAP, hvis scriptet af en eller anden grund ikke loadede
    layer.remove();
    if(onDone) onDone();
    return;
  }

  const coin = document.createElement('div');
  coin.textContent = '🪙';
  coin.style.cssText = `position:absolute; left:${startX}px; top:${startY}px; font-size:36px; z-index:2;`;
  layer.appendChild(coin);
  gsap.set(coin, { xPercent: -50, yPercent: -50, scale: 0.5, rotate: 0 });

  const impact = () => {
    // lille møntsprøjt ved nedslaget
    for(let i=0;i<9;i++){
      const c = document.createElement('div');
      c.textContent = Math.random() > 0.5 ? '🪙' : '✨';
      const ang = Math.random()*Math.PI*2, dist = 24+Math.random()*46;
      c.style.cssText = `position:absolute; left:${endX}px; top:${endY}px; font-size:${12+Math.random()*10}px;`;
      layer.appendChild(c);
      gsap.set(c, { xPercent: -50, yPercent: -50, scale: 0.6, opacity: 1 });
      gsap.to(c, {
        x: Math.cos(ang)*dist, y: Math.sin(ang)*dist - 18, rotate: Math.random()*360, scale: 1,
        duration: 0.6, ease: 'power2.out',
      });
      gsap.to(c, { opacity: 0, duration: 0.5, delay: 0.25 });
    }
    // krukken "hopper" ved nedslaget
    const jarSvg = document.querySelector('.jar-svg');
    if(jarSvg){
      gsap.set(jarSvg, { transformOrigin: '50% 100%' });
      gsap.timeline()
        .to(jarSvg, { scale: 1.09, y: 2, duration: 0.16, ease: 'power2.out' })
        .to(jarSvg, { scale: 1, y: 0, duration: 0.65, ease: 'elastic.out(1, 0.4)' });
    }
    if(onDone) onDone();
  };

  gsap.timeline()
    .to(coin, { left: endX, top: endY, scale: 1.15, rotate: 480, duration: 0.7, ease: 'power2.in' })
    .to(coin, { opacity: 0, duration: 0.2 }, '-=0.05')
    .add(impact);

  setTimeout(()=>layer.remove(), 1500);
}

/* ============ TRÆK-NED-FOR-AT-OPDATERE ============ */
(function setupPullToRefresh(){
  const THRESHOLD = 70;
  let startY = null, pulling = false, indicator = null;

  function ensureIndicator(){
    if(indicator) return indicator;
    indicator = document.createElement('div');
    indicator.style.cssText = 'position:fixed; top:10px; left:50%; transform:translateX(-50%) scale(.6); opacity:0; z-index:90; width:34px; height:34px; border-radius:50%; background:rgba(255,247,232,0.95); display:flex; align-items:center; justify-content:center; font-size:16px; pointer-events:none; box-shadow:0 4px 12px rgba(0,0,0,.25);';
    indicator.textContent = '🔄';
    document.body.appendChild(indicator);
    return indicator;
  }
  function reset(){
    if(indicator){ indicator.style.opacity = '0'; indicator.style.transform = 'translateX(-50%) scale(.6)'; }
    startY = null; pulling = false;
  }

  document.addEventListener('touchstart', e=>{
    const main = document.getElementById('main');
    if(!main || !roomId || main.scrollTop > 0){ startY = null; return; }
    startY = e.touches[0].clientY;
    pulling = false;
  }, { passive:true });

  document.addEventListener('touchmove', e=>{
    if(startY === null) return;
    const main = document.getElementById('main');
    if(!main || main.scrollTop > 0) return;
    const dy = e.touches[0].clientY - startY;
    if(dy <= 0) return;
    pulling = true;
    const ind = ensureIndicator();
    const pull = Math.min(dy, 120);
    ind.style.transition = 'none';
    ind.style.opacity = Math.min(1, pull / THRESHOLD);
    ind.style.transform = `translateX(-50%) translateY(${Math.min(pull,60)}px) scale(${0.6 + Math.min(pull/THRESHOLD,1)*0.4}) rotate(${pull*2}deg)`;
  }, { passive:true });

  document.addEventListener('touchend', ()=>{
    if(pulling && indicator){
      indicator.style.transition = 'opacity .2s, transform .2s';
      const pulledEnough = parseFloat(indicator.style.opacity || '0') >= 1;
      if(pulledEnough){
        indicator.textContent = '⏳';
        refreshState(true).finally(()=>{ reset(); setTimeout(()=>{ if(indicator) indicator.textContent = '🔄'; }, 300); });
        return;
      }
    }
    reset();
  }, { passive:true });
})();

boot();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) reg.update().catch(()=>{}); });
    reg.addEventListener('updatefound', ()=>{
      const nw = reg.installing;
      if(!nw) return;
      nw.addEventListener('statechange', ()=>{
        if(nw.state === 'installed' && navigator.serviceWorker.controller){
          toast('🔄 Ny version klar — opdaterer...');
          setTimeout(()=>location.reload(), 900);
        }
      });
    });
  }).catch(()=>{});
  let swRefreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(swRefreshed) return;
    swRefreshed = true;
    location.reload();
  });
}

<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#12666b" />
<title>Brokkekassen</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Brokkekassen" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sea-deep:#073B40; --sea:#0B4F55; --sea-light:#137a7d;
    --coin:#FFC93C; --coin-dark:#E8A317; --coral:#FF6B4A;
    --cream:#FFF7E8; --ink:#052024; --ink-soft:#0b3a3f;
    --noir:#0A1416; --noir-deep:#050B0C; /* MrBrok-nuance — mørkt "efterforskningslokale", stadig i teal-familien i stedet for en fremmed farve */
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Work Sans', system-ui, sans-serif;
    background: var(--sea-deep);
    color:var(--cream); min-height:100dvh; overflow-x:hidden;
    -webkit-tap-highlight-color: transparent; user-select:none;
    -webkit-overflow-scrolling: touch;
    position:relative;
  }
  /* Selve gradienten ligger på et EGET fast lag i stedet for på body's
     `background-attachment:fixed` — iOS' WebKit er kendt for slet ikke at
     male en `fixed`-baggrund korrekt ind under statusbaren/hakket i en
     installeret ("Føj til hjemmeskærm") PWA, så det område endte med at
     vise bodyens rå baggrundsfarve i stedet for selve gradienten — den
     søm brugerne så øverst på skærmen. Et separat `position:fixed; inset:0`
     lag dækker HELE viewportet inkl. safe area uafhængigt af scroll og af
     WebKits særheder med `background-attachment`. */
  #bgLayer{
    position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(ellipse at 20% -10%, #12666b 0%, transparent 100%),
      radial-gradient(ellipse at 100% 0%, #0e5a5f 0%, transparent 100%),
      linear-gradient(180deg, var(--sea) 0%, var(--sea-deep) 100%);
    transition:background .7s ease;
  }
  /* MrBrok får sit eget mørke "efterforskningslokale" i stedet for det
     fælles teal — sat via en klasse på body, som #bgLayer's baggrund
     lytter til. */
  body.theme-mrbrok #bgLayer{
    background:
      radial-gradient(ellipse at 30% -10%, rgba(255,201,60,0.14) 0%, transparent 55%),
      radial-gradient(ellipse at 100% 0%, rgba(255,201,60,0.06) 0%, transparent 60%),
      linear-gradient(180deg, var(--noir) 0%, var(--noir-deep) 100%);
  }
  h1,h2,h3,.display{font-family:'Baloo 2', sans-serif;}
  button{font-family:inherit;}
  #app{ max-width:480px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; position:relative; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }

  header{ padding:20px 20px 6px; display:flex; flex-direction:column; gap:4px; position:relative; }
  header .title{ font-size:26px; font-weight:800; letter-spacing:-0.02em; white-space:nowrap; }
  header .title-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  header .title span{color:var(--coin);}

  /* Subtil per-app-nuance så man kan se hvilket "rum" man er i uden at
     læse titlen — Brokkekassen er den fælles/neutrale (teal, uændret),
     Brokspillet får en varm guld-glød (matcher mønt-temaet), MrBrok en
     lidt mystisk lilla-glød (matcher detektiv-temaet). Kun headeren
     nuanceres — resten af skærmen holder sig til det fælles tema. */
  header.theme-spil::before, header.theme-mrbrok::before{
    content:''; position:absolute; inset:-10px -10px auto -10px; height:110px; pointer-events:none; z-index:-1;
    -webkit-mask-image:linear-gradient(180deg, #000 0%, transparent 100%); mask-image:linear-gradient(180deg, #000 0%, transparent 100%);
  }
  header.theme-spil::before{ background:radial-gradient(ellipse at 30% 0%, rgba(255,201,60,0.28), transparent 70%); }
  header.theme-mrbrok::before{ background:radial-gradient(ellipse at 30% 0%, rgba(255,201,60,0.2), transparent 70%); }
  header.theme-spil #btnAppMenu, header.theme-spil #btnGameAdminMenu{ border-color:rgba(255,201,60,0.4); }
  header.theme-mrbrok #btnAppMenu, header.theme-mrbrok #btnGameAdminMenu, header.theme-mrbrok #btnMrbrokAdminMenu{ border-color:rgba(255,201,60,0.3); }
  .day-chip{ display:inline-block; font-size:12px; font-weight:600; background:rgba(255,247,232,0.1); border:1px solid rgba(255,247,232,0.18); padding:5px 10px; border-radius:100px; white-space:nowrap; vertical-align:middle; }

  .jar-wrap{ position:relative; display:flex; flex-direction:column; align-items:center; padding:6px 20px 4px; }
  .jar-svg{ width: min(72vw, 300px); height:auto; display:block; filter: drop-shadow(0 18px 24px rgba(0,0,0,0.35)); }
  .jar-total{ position:absolute; top:52%; left:50%; transform:translate(-50%,-50%); text-align:center; pointer-events:none; }
  .jar-total .amt{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:38px; color:var(--ink); line-height:1; }
  .jar-total .lbl{ font-size:11px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }

  .tabs{ display:flex; gap:6px; padding:14px 20px 10px; }
  .tab{ flex:1; text-align:center; padding:9px 6px; border-radius:100px; font-size:13px; font-weight:600; background:rgba(255,247,232,0.06); border:1px solid rgba(255,247,232,0.12); color:rgba(255,247,232,0.65); cursor:pointer; transition:all .15s ease; }
  .tab.active{ background:var(--cream); color:var(--sea-deep); border-color:var(--cream); }

  .segmented{ display:flex; gap:2px; background:rgba(255,247,232,0.06); border-radius:100px; padding:3px; margin-bottom:16px; }
  .segmented .seg{ flex:1; text-align:center; padding:7px 6px; border-radius:100px; font-size:12px; font-weight:700; color:rgba(255,247,232,0.5); cursor:pointer; transition:all .15s ease; }
  .segmented .seg.active{ background:rgba(255,247,232,0.15); color:var(--cream); }

  .slot-banner{ display:inline-block; background:linear-gradient(135deg, var(--coral), #e14d2e); color:#fff; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:15px; letter-spacing:.02em; padding:9px 20px; border-radius:8px; margin-bottom:16px; box-shadow:0 8px 18px rgba(255,107,74,.4); clip-path:polygon(4% 0%, 96% 0%, 100% 50%, 96% 100%, 4% 100%, 0% 50%); }

  .game-badge{ display:inline-block; background:linear-gradient(135deg, var(--coral), #e14d2e); color:#fff; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:12.5px; letter-spacing:.02em; padding:7px 16px; border-radius:100px; margin-bottom:14px; box-shadow:0 6px 14px rgba(255,107,74,.35); }
  @keyframes timerPulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.12); } }
  .game-timer-urgent{ animation:timerPulse .8s ease-in-out infinite; display:inline-block; }
  .waiting-pill{ display:flex; align-items:center; justify-content:center; gap:9px; background:rgba(255,247,232,0.08); border:1px solid rgba(255,247,232,0.18); border-radius:100px; padding:11px 18px; margin-top:12px; font-size:14.5px; font-weight:700; color:rgba(255,247,232,0.85); }
  .waiting-pill .waiting-dot{ width:8px; height:8px; flex:0 0 auto; border-radius:50%; background:var(--coin); animation:waitingBlink 1.1s ease-in-out infinite; }
  @keyframes waitingBlink{ 0%,100%{opacity:.25;} 50%{opacity:1;} }
  @keyframes slotWinPop{ 0%{ transform:scale(1) rotate(0deg); } 30%{ transform:scale(1.06) rotate(-1.5deg); } 55%{ transform:scale(1.03) rotate(1.5deg); } 100%{ transform:scale(1) rotate(0deg); } }
  .quip-slot-win{ animation:slotWinPop .5s ease-out; }
  .game-card{ background:linear-gradient(160deg, rgba(255,201,60,0.18), rgba(255,107,74,0.10)); border:1px solid rgba(255,201,60,0.35); border-radius:22px; padding:20px; box-shadow:0 10px 24px rgba(0,0,0,.18); }
  .game-card p{ color:var(--cream); }
  .game-btn{ display:block; width:100%; background:linear-gradient(160deg, var(--coral), #e14d2e); color:#fff; border:none; border-radius:100px; padding:15px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16px; box-shadow:0 8px 18px rgba(255,107,74,0.35); cursor:pointer; margin-top:14px; }
  .game-btn:active{ transform:scale(.98); }
  .game-btn:disabled{ background:rgba(255,247,232,0.12); color:rgba(255,247,232,0.4); box-shadow:none; cursor:not-allowed; }
  .game-btn.ghost{ background:transparent; box-shadow:none; color:rgba(255,247,232,0.75); font-weight:600; font-size:14px; padding:10px; }
  .game-progress{ display:flex; align-items:center; gap:10px; margin:14px 4px; font-size:12.5px; font-weight:600; color:rgba(255,247,232,0.65); }
  .game-progress .bar-track{ flex:1; }
  .game-pick{ background:rgba(255,247,232,0.08); border:1px solid rgba(255,247,232,0.15); }
  .game-pick:hover{ background:rgba(255,247,232,0.13); }
  .game-countdown{ position:fixed; inset:0; z-index:96; display:flex; align-items:center; justify-content:center; background:rgba(3,20,22,0.72); pointer-events:none; }
  .game-countdown-num{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:120px; color:var(--coin); text-shadow:0 8px 24px rgba(0,0,0,.4); }
  .slot-cabinet{ background:linear-gradient(160deg,#2e2a24,#141414); border-radius:24px; padding:16px 12px 14px; box-shadow:0 12px 26px rgba(0,0,0,.4), inset 0 0 0 3px #8a6b1f; position:relative; }
  .slot-cabinet::before, .slot-cabinet::after{ content:''; position:absolute; top:10px; width:8px; height:8px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #ffe9a8, #b8860b); box-shadow:0 0 6px rgba(255,201,60,.6); }
  .slot-cabinet::before{ left:12px; } .slot-cabinet::after{ right:12px; }
  .slot-cabinet.win{ box-shadow:0 12px 26px rgba(0,0,0,.4), inset 0 0 0 3px #FFC93C, 0 0 24px rgba(255,201,60,.5); }
  .slot-window{ display:flex; gap:6px; background:#0a0a0a; border-radius:14px; padding:8px; box-shadow:inset 0 3px 14px rgba(0,0,0,.9); }
  .reel{ flex:1; height:58px; overflow:hidden; border-radius:9px; background:rgba(255,255,255,0.03); position:relative; }
  .reel::before{ content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.6), transparent 30%, transparent 70%, rgba(0,0,0,.6)); pointer-events:none; z-index:2; }
  .reel-strip{ position:absolute; top:0; left:0; right:0; }
  .reel-symbol{ height:58px; display:flex; align-items:center; justify-content:center; }
  .reel-symbol .avatar{ width:40px; height:40px; font-size:14px; }
  .slot-lever{ display:block; margin:18px auto 0; background:linear-gradient(160deg, var(--coral), #e14d2e); color:#fff; border:none; border-radius:100px; padding:13px 26px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px; box-shadow:0 8px 18px rgba(255,107,74,.4); cursor:pointer; }
  .slot-lever:active{ transform:scale(.97); }
  .slot-lever:disabled{ opacity:.5; }
  .slot-winner-name{ text-align:center; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:19px; color:var(--coral); margin-top:14px; opacity:0; }

  main{ flex:1; padding:0 16px 130px; overflow-y:auto; -webkit-overflow-scrolling:touch; }

  .feed-item{ background:rgba(255,247,232,0.07); border:1px solid rgba(255,247,232,0.1); border-radius:16px; padding:12px 14px; margin-bottom:10px; display:flex; gap:12px; align-items:flex-start; }
  .avatar{ flex:0 0 auto; width:38px;height:38px; border-radius:50%; background:linear-gradient(160deg, var(--coral), #e14d2e); color:#fff; display:flex;align-items:center;justify-content:center; font-weight:700; font-size:14px; font-family:'Baloo 2',sans-serif; }
  .feed-body{flex:1; min-width:0;}
  .feed-name{font-weight:700; font-size:14.5px; color:var(--cream);}
  .feed-name .amt{color:var(--coin); font-weight:800; margin-left:6px;}
  .feed-msg{font-size:13.5px; color:rgba(255,247,232,0.75); margin-top:2px; word-wrap:break-word;}
  .feed-time{font-size:11px; color:rgba(255,247,232,0.4); margin-top:4px;}
  .empty-state{ text-align:center; padding:50px 20px; color:rgba(255,247,232,0.55); }
  .empty-state .emoji{font-size:38px; display:block; margin-bottom:10px;}
  .empty-state b{color:var(--cream); display:block; font-family:'Baloo 2',sans-serif; font-size:17px; margin-bottom:4px;}

  .bal-row{ display:flex; align-items:center; gap:12px; background:rgba(255,247,232,0.07); border:1px solid rgba(255,247,232,0.1); border-radius:16px; padding:12px 14px; margin-bottom:10px; }
  .bal-name{flex:1; font-weight:600; font-size:14.5px;}
  .bal-amt{font-family:'Baloo 2',sans-serif; font-weight:800; font-size:19px; color:var(--coin);}
  .bal-amt.zero{color:rgba(255,247,232,0.35); font-weight:700;}
  .bal-name.me::after{ content:' (dig)'; font-weight:400; opacity:.6; font-size:12px; }

  .section-label{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:rgba(255,247,232,0.65); margin:14px 4px 10px; }

  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; padding:0 2px; }
  .bar-track{ flex:1; height:14px; background:rgba(255,247,232,0.1); border-radius:10px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:10px; background:linear-gradient(90deg, var(--coin-dark), var(--coin)); transition:width .7s cubic-bezier(.2,.8,.2,1); }
  .bar-fill.top{ background:linear-gradient(90deg, #e14d2e, var(--coral)); }
  .bar-amt{ flex:0 0 auto; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:13.5px; color:var(--coin); min-width:34px; text-align:right; white-space:nowrap; }

  .history-round{ background:rgba(255,247,232,0.05); border:1px solid rgba(255,247,232,0.1); border-radius:16px; padding:14px; margin-bottom:12px; }
  .history-round .hr-title{font-weight:700; font-family:'Baloo 2',sans-serif; font-size:16px; color:var(--coin);}
  .history-round .hr-sub{font-size:12px; color:rgba(255,247,232,0.65); margin-bottom:8px;}
  .hr-line{display:flex; justify-content:space-between; font-size:13.5px; padding:3px 0; color:rgba(255,247,232,0.8);}

  .bottombar{ position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; padding:14px 16px calc(16px + env(safe-area-inset-bottom)); background:linear-gradient(0deg, var(--sea-deep) 60%, rgba(7,59,64,0)); display:flex; gap:10px; }
  .btn-brok{ flex:1; background:linear-gradient(160deg, var(--coral), #e14d2e); color:#fff; border:none; border-radius:100px; padding:16px 10px; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:18px; box-shadow:0 8px 18px rgba(255,107,74,0.35); display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-brok:active{transform:scale(0.97);}
  .btn-brok:disabled{opacity:.5;}
  .btn-share{ flex:0 0 auto; width:52px; background:rgba(255,247,232,0.1); border:1px solid rgba(255,247,232,0.2); color:var(--cream); border-radius:100px; font-size:20px; }

  .sheet-backdrop{ position:fixed; inset:0; background:rgba(3,20,22,0.68); backdrop-filter: blur(2px); display:flex; align-items:flex-end; z-index:50; opacity:0; pointer-events:none; transition:opacity .2s ease; }
  .sheet-backdrop.show{opacity:1; pointer-events:auto;}
  .sheet{ width:100%; max-width:480px; margin:0 auto; background:var(--cream); color:var(--ink); border-radius:26px 26px 0 0; padding:10px 20px calc(24px + env(safe-area-inset-bottom)); transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.9,.3,1.2); max-height:88dvh; overflow-y:auto; }
  .sheet-backdrop.show .sheet{transform:translateY(0);}
  .sheet-handle{ width:40px;height:5px;background:rgba(5,32,36,0.18);border-radius:10px; margin:8px auto 14px; }
  .sheet h2{font-size:20px; margin:0 0 4px; font-weight:800;}
  .sheet p.hint{font-size:13px; color:rgba(5,32,36,0.55); margin:0 0 16px;}

  .name-grid{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .name-pill{ padding:10px 16px; border-radius:100px; border:2px solid rgba(5,32,36,0.12); background:#fff; color:var(--ink); font-weight:700; font-size:14.5px; cursor:pointer; }
  .name-pill.selected{ background:var(--coral); border-color:var(--coral); color:#fff; }
  .name-pill.voted{ background:var(--sea); border-color:var(--sea); color:#fff; }
  .name-pill:disabled{opacity:.4;}

  textarea, input[type=text], input[type=email]{ width:100%; border:2px solid rgba(5,32,36,0.12); border-radius:14px; padding:12px 14px; font-size:15px; font-family:inherit; background:#fff; resize:none; color:var(--ink); margin-bottom:10px; }
  textarea:focus, input:focus{outline:none; border-color:var(--sea);}
  label.field-label{ font-size:12px; font-weight:700; color:rgba(5,32,36,0.5); text-transform:uppercase; letter-spacing:.05em; margin:4px 0 6px; display:block; }

  .sheet-btn{ width:100%; padding:15px; border-radius:100px; border:none; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:16px; margin-top:14px; cursor:pointer; }
  .sheet-btn.primary{background:var(--sea); color:#fff;}
  .sheet-btn.primary:disabled{background:rgba(5,32,36,0.15); color:rgba(5,32,36,0.4);}
  .sheet-btn.ghost{background:transparent; color:rgba(5,32,36,0.5); font-weight:600; font-size:14px; padding:8px;}
  .sheet-btn.danger{background:var(--coral); color:#fff;}
  .sheet-btn.gold{background:linear-gradient(160deg, var(--coin), var(--coin-dark)); color:var(--ink);}

  /* Grupperet handlings-liste i sheets (fx ☰-menuen) — en samlet kortflade
     med ikon-chip + label pr. række, i stedet for løstflydende ghost-knapper
     uden nogen visuel beholder omkring sig. */
  .menu-row-list{ background:rgba(5,32,36,0.045); border-radius:18px; margin-top:14px; overflow:hidden; }
  .menu-row{ display:flex; align-items:center; gap:12px; padding:13px 14px; cursor:pointer; border-bottom:1px solid rgba(5,32,36,0.07); }
  .menu-row:last-child{ border-bottom:none; }
  .menu-row-icon{ width:32px; height:32px; border-radius:10px; background:rgba(5,32,36,0.06); display:flex; align-items:center; justify-content:center; font-size:15px; flex:0 0 auto; }
  .menu-row-label{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14.5px; color:var(--ink); flex:1; }
  .menu-row-chevron{ color:rgba(5,32,36,0.25); font-size:14px; }

  .vote-progress{ display:flex; align-items:center; gap:10px; margin:6px 0 16px; font-size:13.5px; font-weight:600; color:rgba(5,32,36,0.6); }
  .vote-progress .bar{flex:1; height:8px; background:rgba(5,32,36,0.1); border-radius:10px; overflow:hidden;}
  .vote-progress .bar > div{height:100%; background:var(--coral); border-radius:10px; transition:width .25s;}

  .onboard{ padding:60px 26px 30px; text-align:center; }
  .onboard .emoji{font-size:52px;}
  .onboard h1{font-size:28px; margin:10px 0 6px;}
  .onboard p{font-size:14.5px; color:rgba(255,247,232,0.7); line-height:1.5; margin-bottom:26px;}
  .onboard-card{ background:rgba(255,247,232,0.08); border:1px solid rgba(255,247,232,0.15); border-radius:20px; padding:20px; text-align:left; }
  .onboard-pick:not(.selected){ opacity:.35; }
  /* Delt "hvilken app"-kort-stil (onboarding-valg + ☰-menu) — ikonet sidder i
     en fast-høj boks øverst i kortet, så ikonerne altid flugter vandret på
     tværs af rækken uanset om et af navnene (fx "Brokkekassen") knækker om
     på to linjer og et andet (fx "MrBrok") ikke gør. */
  .app-pick{ flex:1; cursor:pointer; text-align:center; padding:22px 6px 18px; border-radius:20px; transition:opacity .15s, transform .08s; }
  .app-pick:active{ transform:scale(.96); }
  .app-pick .app-pick-icon{ height:40px; display:flex; align-items:center; justify-content:center; font-size:34px; line-height:1; }
  .app-pick .app-pick-label{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:13px; line-height:1.25; margin-top:8px; letter-spacing:.01em; }
  .onboard-card input{ background:rgba(255,247,232,0.95); }
  .divider{ display:flex; align-items:center; gap:10px; color:rgba(255,247,232,0.4); font-size:12px; margin:22px 0; }
  .divider::before, .divider::after{ content:''; flex:1; height:1px; background:rgba(255,247,232,0.15); }
  /* .divider er designet til mørke baggrunde (.onboard, spilskærme) — cremet
     tekst på cremet baggrund. Men den bruges også inde i .sheet (☰-menuen,
     admin-menuen), som har en LYS baggrund med mørk tekst — der blev
     "afregning"/"kan ikke fortrydes"-overskrifterne næsten usynlige, så
     knapperne fra forskellige sektioner så ud til at flyde sammen uden nogen
     synlig adskillelse. Denne override retter farverne når .divider sidder
     inde i en .sheet. */
  .sheet .divider{ color:rgba(5,32,36,0.4); }
  .sheet .divider::before, .sheet .divider::after{ background:rgba(5,32,36,0.14); }

  .toast{ position:fixed; top:16px; left:50%; transform:translateX(-50%) translateY(-6px); background:linear-gradient(160deg, #0d4b52, var(--ink)); color:var(--cream); padding:13px 20px; border-radius:18px; font-size:14px; font-weight:600; z-index:80; box-shadow:0 10px 28px rgba(0,0,0,.35), 0 0 0 1px rgba(255,247,232,0.08) inset; opacity:0; transition:opacity .3s ease, transform .3s cubic-bezier(.2,.9,.3,1.2); pointer-events:none; max-width:88vw; text-align:center; line-height:1.4; }

  /* Rolig, ikke-alarmerende banner når nettet mangler — understreger at
     data bare er "sidst kendte" og IKKE væk/nulstillet, i modsætning til
     hvis siden bare stille viste en tom/frisk kasse. */
  .offline-banner{ position:fixed; top:0; left:0; right:0; z-index:90; background:linear-gradient(90deg, var(--coin-dark), var(--coin)); color:var(--ink); font-size:12.5px; font-weight:700; text-align:center; padding:calc(8px + env(safe-area-inset-top)) 16px 8px; transform:translateY(-100%); transition:transform .25s ease; }
  .offline-banner.show{ transform:translateY(0); }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(6px);}
  .confetti{ position:fixed; inset:0; pointer-events:none; z-index:95; }
  .spinner{ width:16px;height:16px;border-radius:50%; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; display:inline-block; animation:spin .7s linear infinite; }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="bgLayer"></div>
<div id="app"></div>
<div class="offline-banner" id="offlineBanner">📡 Ingen forbindelse — viser sidste kendte data</div>
<div class="toast" id="toast"></div>

<script src="gsap.min.js"></script>
<script>
/* ============ CONFIG / IDENTITY ============ */
// Synligt versions-mærke i admin-menuerne, så det altid er utvetydigt om
// en given enhed rent faktisk har hentet den nyeste deployment eller
// stadig viser en cachet version — nyttigt til at fejlsøge PWA/service-
// worker-opdateringsproblemer uden browser-devtools.
const BUILD_TAG = 'build-2026-08-04-5';
const params = new URLSearchParams(location.search);
let roomId = (params.get('r') || localStorage.getItem('bk_lastRoom') || null);
if(roomId) roomId = roomId.toLowerCase();
let profile = JSON.parse(localStorage.getItem('bk_profile_' + roomId) || 'null'); // {memberId, name}

let state = null;
let activeTab = 'feed';
let activeApp = 'kasse'; // 'kasse' | 'spil' | 'mrbrok' — hvilken af de tre "apps" i samme rum der vises
let gameWager = 'fun'; // 'fun' | 'euro' — valgt i Brokspillets lobby, før spillet startes
let gameRounds = 8; // 5 | 8 | 12 — valgt i lobbyen, før spillet startes
let gameSelectedPlayers = null; // memberId[] valgt i lobbyen — sættes til alle medlemmer første gang lobbyen vises
let gameKnownMemberIds = null; // holder styr på hvem der allerede er set, så nytilkomne medlemmer auto-vælges uden at overskrive en bevidst fravalgt
let gameTimerInterval = null;
let gameTimerDeadline = null;
let lastCelebratedKey = null; // undgår at fyre konfetti/hån-toast flere gange for samme rundes resultat
let lastCountdownRound = null; // undgår at afspille 3-2-1-nedtællingen flere gange for samme runde
let lastAnimatedGameKey = null; // undgår at gen-afspille kortets indgangs-animation ved hvert stille poll-opdatering (så det ikke "flimrer")
let lastAnimatedMrbrokKey = null;

let mrbrokWager = 'fun';
let mrbrokRounds = 4; // 3 | 4 | 5
let mrbrokSelectedPlayers = null;
let mrbrokInstructionsOpen = null; // null = ikke afgjort endnu denne session — "sådan foregår det" foldes automatisk ud første gang, sammen efterfølgende
let gameInstructionsOpen = null; // samme mønster for Brokspillets egen lobby
let mrbrokKnownMemberIds = null;
let mrbrokTimerInterval = null;
let mrbrokTimerDeadline = null;
let brokListSubTab = 'alltime'; // 'today' | 'alltime' — undersort inde i Broklisten-fanen; alltime er det vigtigste og vises først
let polling = null;
let toastTimer = null;

/* ============ ADMIN ============ */
// Den der opretter en brokkekasse er dens admin (er altid members[0] i det rum).
function isAdmin(){ return !!(state && profile && state.members[0] && state.members[0].id === profile.memberId); }

/* ============ SJOV / BANTER ============ */
const BANTER = [
  'Endnu en for retfærdighedens sejr! ⚖️',
  'Solen skinner, og nu gør puljen også! ☀️',
  'Det der koster altså — velkommen til klubben. 🎟️',
  'Brok registreret, appel afvist. 🧑‍⚖️',
  'Ka det virkelig passe? Tjah, det gjorde det. 💸',
  'En til krukken, en mindre brok i verden (håber vi). 🤞',
  'Beklager, ingen refusion på den slags brok. 🙅',
  'Krukken siger tak for donationen! 🙏',
  'Det var dyrt sagt. Bogstaveligt talt. 💰',
  'Forestil dig en verden helt uden brok... men indtil da: tak for bidraget! 😇',
  'Én dag brokker ingen sig. I dag var ikke den dag. 🌅',
  'Held og lykke med at brokke dig mindre i morgen. 🍀',
  'Verden var lidt bedre for et øjeblik siden. 🙃',
];
function randomBanter(){ return BANTER[Math.floor(Math.random()*BANTER.length)]; }

const TREATS = [
  { cost: 40, label: 'middag ude 🍽️' },
  { cost: 20, label: 'flaske god rom 🥃' },
  { cost: 12, label: 'pizza 🍕' },
  { cost: 8,  label: 'cocktail ved poolen 🍹' },
  { cost: 3,  label: 'øl 🍺' },
  { cost: 2,  label: 'is 🍦' },
];
function whatToBuy(total){
  if(total <= 0) return null;
  const t = TREATS.find(t => total >= t.cost);
  if(!t) return null;
  const n = Math.floor(total / t.cost);
  return `= ${n}× ${t.label}`;
}
function titleFor(count){
  if(count >= 10) return 'Broklegende 👑';
  if(count >= 6) return 'Storbrokker';
  if(count >= 3) return 'Rutineret brokkehoved';
  if(count >= 1) return 'Brokke-nybegynder';
  return 'Pletfri (indtil videre)';
}

// Giver ØJEBLIKKELIG visuel bekræftelse på et tryk (spinner + deaktiveret),
// FØR netværkskaldet er færdigt — så man aldrig er i tvivl om trykket
// registrerede, uanset hvor lang tid selve requesten tager.
function lockSubmitBtn(btn, label){
  if(!btn) return;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> ' + (label || 'Sender...');
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  const duration = Math.min(7500, Math.max(2800, msg.length * 75));
  toastTimer = setTimeout(()=>t.classList.remove('show'), duration);
}
function shareUrl(){
  const u = new URL(location.href);
  u.search = '?r=' + roomId;
  return u.toString();
}
async function doShare(){
  const url = shareUrl();
  if(navigator.share){
    try{ await navigator.share({ title:'Brokkekassen', text:'Kom med i vores brokkekasse!', url }); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }
  }
  try{ await navigator.clipboard.writeText(url); toast('Link til Brokkekassen kopieret. Send det til deltagere.'); }
  catch(e){ prompt('Kopiér linket manuelt:', url); }
}
/* ============ PUSH-NOTIFIKATIONER ============ */
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
function pushSupported(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function pushEnabledLocally(){ return localStorage.getItem('bk_push_enabled_' + roomId) === '1'; }
async function enablePush(){
  if(!pushSupported()){ toast('Understøttes ikke her (mangler serviceWorker/PushManager/Notification)'); return false; }
  toast('Nuværende tilladelse: ' + Notification.permission + ' — spørger...');
  await new Promise(r=>setTimeout(r, 1300));
  try{
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ toast('Notifikationer blev ikke tilladt (' + perm + ')'); return false; }
    toast('Tilladt! Henter nøgle...');
    const { publicKey } = await api('push');
    if(!publicKey){ toast('Push er ikke sat op på serveren endnu (mangler VAPID-nøgle)'); return false; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){ sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: urlBase64ToUint8Array(publicKey) }); }
    await api('push', { roomId, memberId: profile.memberId, subscription: sub.toJSON() });
    localStorage.setItem('bk_push_enabled_' + roomId, '1');
    toast('🔔 Du får nu besked når nogen brokker sig');
    return true;
  }catch(e){ toast('Fejl: ' + e.message); return false; }
}

function extractRoomId(input){
  input = (input||'').trim();
  if(!input) return null;
  try{
    const u = new URL(input);
    const r = u.searchParams.get('r');
    if(r) return r.toLowerCase();
  }catch(e){}
  return input.toLowerCase();
}
function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function fmtTime(ts){
  const d = new Date(ts), now = new Date();
  const time = d.toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'});
  if(d.toDateString() === now.toDateString()) return 'i dag ' + time;
  return d.toLocaleDateString('da-DK',{day:'2-digit',month:'short'}) + ' ' + time;
}
function dayCount(){
  if(!state || !state.createdAt) return 0;
  return Math.max(1, Math.floor((Date.now() - state.createdAt)/86400000) + 1);
}
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ============ API ============ */
async function api(path, body){
  let r;
  try{
    // Et svagt/hængende signal fejler ikke altid hurtigt af sig selv — uden
    // en øvre grænse kan et fetch-kald hænge langt længere end brugeren
    // gider vente, i stedet for at vise offline-tilstanden. 8 sek er rigeligt
    // for et normalt svar, men kort nok til at føles responsivt.
    const controller = new AbortController();
    const timeoutId = setTimeout(()=>controller.abort(), 8000);
    try{
      r = await fetch('/api/' + path, {
        method: body ? 'POST' : 'GET',
        headers: body ? {'Content-Type':'application/json'} : undefined,
        body: body ? JSON.stringify(body) : undefined,
        signal: controller.signal,
      });
    }finally{ clearTimeout(timeoutId); }
  }catch(networkErr){
    // fetch selv fejlede (offline, DNS, timeout...) — adskil det tydeligt
    // fra et rigtigt API-svar som "ukendt brokkekasse", som er noget helt
    // andet. Bruges bl.a. til IKKE at vise "rummet findes ikke længere" når
    // det bare er nettet der mangler.
    const err = new Error('Ingen forbindelse');
    err.isNetworkError = true;
    throw err;
  }
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error || 'Noget gik galt');
  return data;
}

function setOfflineBanner(show){
  const el = document.getElementById('offlineBanner');
  if(el) el.classList.toggle('show', !!show);
}

let lastStateJSON = null;
async function refreshState(silent){
  try{
    const { state: s } = await api('state?room=' + encodeURIComponent(roomId) + '&member=' + encodeURIComponent((profile && profile.memberId) || ''));
    setOfflineBanner(false);
    const json = JSON.stringify(s);
    if(silent && json === lastStateJSON) return; // intet nyt — undgå at afbryde en igangværende scroll unødigt
    lastStateJSON = json;
    state = s;
    const typingTag = document.activeElement && document.activeElement.tagName;
    if(silent && (activeApp === 'spil' || activeApp === 'mrbrok') && (typingTag === 'TEXTAREA' || typingTag === 'INPUT')) return; // undgå at nulstille et svar man er ved at skrive i Brokspillet/MrBrok
    render();
  }catch(e){
    if(e.isNetworkError){
      // Vis den rolige banner i stedet for en fejl-toast — state rører vi
      // slet ikke, så det der allerede står på skærmen (fx 15€ i puljen)
      // bliver stående uændret, i stedet for at se nulstillet ud.
      setOfflineBanner(true);
      return;
    }
    if(!silent) toast('Kunne ikke hente data: ' + e.message);
  }
}
window.addEventListener('online', ()=>{
  setOfflineBanner(false);
  if(!roomId) return;
  if(!state) enterRoom(); // aldrig kommet ind i rummet endnu — prøv forfra i stedet for bare at polle
  else refreshState(true);
});
window.addEventListener('offline', ()=> setOfflineBanner(true));
function startPolling(){
  if(polling) clearInterval(polling);
  polling = setInterval(()=>refreshState(true), 3000);
}
document.addEventListener('visibilitychange', ()=>{
  if(!roomId) return;
  if(document.hidden){
    if(polling){ clearInterval(polling); polling = null; }
  }else{
    refreshState(true);
    startPolling();
  }
});

function renderOfflineRetry(){
  app.innerHTML = `
    <div class="onboard">
      <div class="emoji">📡</div>
      <h1>Ingen forbindelse</h1>
      <p>Kan ikke hente jeres brokkekasse lige nu — men intet er slettet, den venter bare på serveren. Prøv igen når du har forbindelse.</p>
      <button class="sheet-btn primary" id="offlineRetryBtn" style="margin-top:0;">🔄 Prøv igen</button>
    </div>
  `;
  document.getElementById('offlineRetryBtn').onclick = enterRoom;
}

/* ============ APP ENTRY ============ */
const app = document.getElementById('app');

async function boot(){
  if(!roomId){
    renderCreateOrJoin();
    return;
  }
  await enterRoom();
}

async function enterRoom(){
  localStorage.setItem('bk_lastRoom', roomId);
  app.innerHTML = `<div class="onboard"><div class="spinner" style="width:28px;height:28px;border-width:3px;margin-top:100px;"></div></div>`;
  try{
    const { state: s } = await api('state?room=' + encodeURIComponent(roomId) + '&member=' + encodeURIComponent((profile && profile.memberId) || ''));
    state = s;
  }catch(e){
    if(e.isNetworkError){
      // VIGTIGT: dette er IKKE "rummet findes ikke" — det er bare ingen
      // forbindelse lige nu. At vise "opret et nyt rum" her ville se ud som
      // om alt (fx puljen) var væk, selvom data stadig ligger urørt på
      // serveren og bare ikke kan hentes lige nu.
      renderOfflineRetry();
      return;
    }
    renderCreateOrJoin('Den brokkekasse findes ikke længere. Opret en ny, eller tjek linket.');
    return;
  }
  if(!profile || !state.members.find(m=>m.id===profile.memberId)){
    renderWhoAmI();
    return;
  }
  if(!state.kasseEnabled && state.gameEnabled) activeApp = 'spil';
  else if(!state.kasseEnabled && !state.gameEnabled && state.mrbrokEnabled) activeApp = 'mrbrok';
  else if(state.kasseEnabled) activeApp = 'kasse';
  rememberRoom();
  render();
  startPolling();
}

// Husker navn/e-mail lokalt på tværs af rum (ikke rum-specifikt), så man
// slipper for at skrive det igen næste gang man opretter/joiner et nyt rum
// på samme enhed. Ren bekvemmelighed — ingen konto, intet gemt i skyen.
function getSavedIdentity(){
  try{ return JSON.parse(localStorage.getItem('bk_identity') || 'null') || { name:'', email:'' }; }
  catch(e){ return { name:'', email:'' }; }
}
function saveIdentity(name, email){
  localStorage.setItem('bk_identity', JSON.stringify({ name: name||'', email: email||'' }));
}

/* ============ FLERE KASSER (gemt lokalt, ikke i skyen) ============ */
function getMyRooms(){
  try{ return JSON.parse(localStorage.getItem('bk_myRooms') || '{}'); }catch(e){ return {}; }
}
function rememberRoom(){
  if(!roomId || !profile) return;
  const rooms = getMyRooms();
  rooms[roomId] = { name: profile.name, ts: Date.now() };
  localStorage.setItem('bk_myRooms', JSON.stringify(rooms));
}
async function switchToRoom(rid){
  if(gameTimerInterval){ clearInterval(gameTimerInterval); gameTimerInterval = null; }
  if(mrbrokTimerInterval){ clearInterval(mrbrokTimerInterval); mrbrokTimerInterval = null; }
  activeApp = 'kasse';
  roomId = rid.toLowerCase();
  profile = JSON.parse(localStorage.getItem('bk_profile_' + roomId) || 'null');
  const u = new URL(location.href); u.search = '?r=' + roomId;
  history.replaceState(null,'',u.toString());
  await enterRoom();
}
function leaveRoom(){
  if(polling){ clearInterval(polling); polling = null; }
  if(gameTimerInterval){ clearInterval(gameTimerInterval); gameTimerInterval = null; }
  if(mrbrokTimerInterval){ clearInterval(mrbrokTimerInterval); mrbrokTimerInterval = null; }
  localStorage.removeItem('bk_lastRoom');
  roomId = null; profile = null; state = null;
  const u = new URL(location.href); u.search = '';
  history.replaceState(null,'',u.toString());
  closeSheet();
  renderCreateOrJoin();
}
function openLeaveRoomSheet(){
  openSheet(`
    <h2>Forlad dette rum 🚪</h2>
    <p class="hint">Du er stadig medlem — kom tilbage når som helst med koden <b>${roomId}</b>, eller vælg det fra "Dine kasser" næste gang. Denne enhed åbner det bare ikke automatisk mere.</p>
    <button class="sheet-btn danger" id="doLeave">Ja, forlad rummet</button>
    <button class="sheet-btn ghost" id="cancelLeave">Annuller</button>
  `, ()=>{
    document.getElementById('cancelLeave').onclick = closeSheet;
    document.getElementById('doLeave').onclick = leaveRoom;
  });
}

function isIOSDevice(){ return /iPad|iPhone|iPod/.test(navigator.userAgent); }
function isStandalone(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }
function homeScreenTip(strong){
  if(isStandalone()) return '';
  const how = isIOSDevice() ? 'tryk Del-ikonet i Safari nedenunder → "Føj til hjemmeskærm"' : 'åbn menuen (⋮) i Chrome → "Installér app"';
  return `
    <div class="onboard-card" style="margin:14px 0; background:rgba(255,247,232,0.05); border-style:dashed;">
      <p style="margin:0; font-size:12.5px; color:rgba(255,247,232,0.6); text-align:center; line-height:1.5;">
        📲 <b style="color:rgba(255,247,232,0.8);">Tip:</b> ${strong ? 'Føj til hjemmeskærmen <u>før</u> du skriver dit navn herunder' : 'Føj Brokkekassen til hjemmeskærmen for hurtig adgang'} —
        ${how}${strong ? '. Ellers skal du skrive navnet igen, næste gang du åbner appen fra hjemmeskærmen' : ''}.
      </p>
    </div>
  `;
}

function renderCreateOrJoin(errorMsg){
  const myRooms = getMyRooms();
  const roomIds = Object.keys(myRooms).filter(rid => rid !== roomId).sort((a,b)=>myRooms[b].ts - myRooms[a].ts);
  const myRoomsList = roomIds.length ? `
    <div class="divider">dine kasser</div>
    <div class="onboard-card" style="padding:8px;">
      ${roomIds.map(rid => `
        <div class="bal-row" style="margin-bottom:6px; cursor:pointer;" data-goto-room="${rid}">
          <div class="avatar" style="width:34px;height:34px;font-size:12.5px;">${initials(myRooms[rid].name)}</div>
          <div class="feed-body"><div class="bal-name">${escapeHtml(rid)}</div><div style="font-size:12px; color:rgba(5,32,36,0.55);">som ${escapeHtml(myRooms[rid].name)}</div></div>
        </div>
      `).join('')}
    </div>
  ` : '';
  app.innerHTML = `
    <div class="onboard">
      <div class="emoji">🍯</div>
      <h1>Brokkekassen</h1>
      <p>Ferie-reglen: brokker du dig, koster det 1€. Opret jeres eget rum, eller gå med i et du har fået et link til.</p>
      ${errorMsg ? `<p style="color:var(--coral); font-weight:600; margin-top:-14px;">${errorMsg}</p>` : ''}
      <div class="onboard-card">
        <label class="field-label" style="color:rgba(255,247,232,0.6);">Hvad vil I have med? (vælg en eller begge)</label>
        <div style="display:flex; gap:10px; margin:10px 0 16px;">
          <div class="onboard-pick app-pick selected" data-pick="kasse" style="background:var(--sea); color:#fff;">
            <div class="app-pick-icon">🫙</div>
            <div class="app-pick-label">Brokkekassen</div>
          </div>
          <div class="onboard-pick app-pick selected" data-pick="spil" style="background:var(--sea); color:#fff;">
            <div class="app-pick-icon">👉</div>
            <div class="app-pick-label">Brokspillet</div>
          </div>
          <div class="onboard-pick app-pick selected" data-pick="mrbrok" style="background:var(--sea); color:#fff;">
            <div class="app-pick-icon">🕵️</div>
            <div class="app-pick-label">MrBrok</div>
          </div>
        </div>
        <button class="sheet-btn primary" id="createBtn" style="margin-top:0;">Opret nyt rum</button>
      </div>
      <div class="divider">eller</div>
      <div class="onboard-card">
        <label class="field-label">Har du fået et link?</label>
        <input type="text" id="joinInput" placeholder="Indsæt link eller kode her" autocapitalize="off" autocorrect="off" spellcheck="false" />
        <button class="sheet-btn primary" id="joinRoomBtn" style="margin-top:0;">Gå til brokkekassen</button>
        <p style="margin:10px 0 0; font-size:11.5px; color:rgba(255,247,232,0.45); text-align:center;">Glemt dit rum? Bed et medlem af rummet om koden eller linket igen.</p>
      </div>
      ${myRoomsList}
      ${homeScreenTip(false)}
    </div>
  `;
  document.querySelectorAll('[data-goto-room]').forEach(el=>{
    el.onclick = ()=>switchToRoom(el.dataset.gotoRoom);
  });
  document.querySelectorAll('.onboard-pick').forEach(el=>{
    el.onclick = ()=>{
      const willSelect = !el.classList.contains('selected');
      if(!willSelect){
        const otherSelected = document.querySelectorAll('.onboard-pick.selected').length > 1;
        if(!otherSelected) return; // mindst én skal altid være valgt
      }
      el.classList.toggle('selected');
    };
  });
  const joinInput = document.getElementById('joinInput');
  const goJoin = async ()=>{
    const rid = extractRoomId(joinInput.value);

// Alle nuværende (endnu ikke afregnede) brok — kan sagtens strække sig over flere dage.
function balances(){
  const map = {}; state.members.forEach(m=>map[m.id]=0);
  state.events.forEach(e=>{ if(!e.free && !e.voided && map[e.memberId]!==undefined) map[e.memberId]++; });
  return map;
}

// Auto-fremdrift: hvis en runde bare står stille (ingen svarer/rykker den
// videre), tæller denne ned og trykker selv "gå videre" — så spillet aldrig
// reelt går i stå bare fordi nogen glemmer at trykke.
const GAME_PHASE_SECONDS = {
  'quiplash:answer': 60, 'quiplash:vote': 35, 'quiplash:results': 20,
  'truefalse:write': 60, 'truefalse:guess': 35, 'truefalse:results': 20,
  'trivia:answer': 35, 'trivia:results': 20,
  'guessbrok:write': 60, 'guessbrok:guess': 35, 'guessbrok:results': 20,
};
function paintGameTimerNow(){
  // Hvert stille poll-opdatering (fx en anden spiller der svarer) erstatter
  // HELE main-DOM'en, inkl. #gameTimer-badgen, som i markup'et starter tom.
  // Uden dette blinker uret tomt i op til et helt sekund efter hver sådan
  // gen-render, indtil den GAMLE intervals næste tick tilfældigvis rammer —
  // det er den "flimren" der ellers ses hele tiden på nedtællingen. Ved at
  // male den friske DOM-node med det samme (samme deadline, ingen ny timer)
  // undgås det tomme mellemrum helt.
  if(!gameTimerDeadline) return;
  const el = document.getElementById('gameTimer');
  if(!el) return;
  const left = Math.max(0, Math.ceil((gameTimerDeadline - Date.now())/1000));
  el.textContent = '⏱️ ' + left + 's';
  el.style.color = left <= 10 ? '#FFD9CC' : '';
  el.classList.toggle('game-timer-urgent', left <= 10 && left > 0);
}
function startGameTimer(cur){
  clearInterval(gameTimerInterval);
  gameTimerInterval = null;
  if(!cur || cur.type === 'gameover') return;
  const secs = GAME_PHASE_SECONDS[cur.type + ':' + cur.phase];
  if(!secs){ gameTimerDeadline = null; return; }
  gameTimerDeadline = Date.now() + secs*1000;
  const tick = ()=>{
    const el = document.getElementById('gameTimer');
    const left = Math.max(0, Math.ceil((gameTimerDeadline - Date.now())/1000));
    if(el){
      el.textContent = '⏱️ ' + left + 's';
      // Sidste 10 sekunder skifter til en advarselsfarve og pulserer let,
      // så uret ikke bare er endnu en detalje man overser i badgen.
      el.style.color = left <= 10 ? '#FFD9CC' : '';
      el.classList.toggle('game-timer-urgent', left <= 10 && left > 0);
    }
    if(left <= 0){
      clearInterval(gameTimerInterval);
      gameTimerInterval = null;
      gameApi('advance', {});
    }
  };
  tick();
  gameTimerInterval = setInterval(tick, 1000);
}

const GAME_TAUNTS = [
  n => `😈 ${n} vandt runden — resten kan pakke sammen.`,
  n => `👑 ${n} regerer denne runde. Hån frit.`,
  n => `🔥 ${n} smadrede runden!`,
  n => `🎯 ${n} ramte plet — de andre gjorde ikke.`,
];
function randomTaunt(name){ return GAME_TAUNTS[Math.floor(Math.random()*GAME_TAUNTS.length)](name); }

function fireConfetti(centerEl){
  if(typeof gsap === 'undefined') return;
  const rect = centerEl ? centerEl.getBoundingClientRect() : { left: innerWidth/2, top: 140, width: 0 };
  const cx = rect.left + rect.width/2, cy = rect.top + 20;
  const layer = document.createElement('div');
  layer.className = 'confetti';
  document.body.appendChild(layer);
  for(let i=0;i<28;i++){
    const c = document.createElement('div');
    c.textContent = ['🎉','✨','🪙','🎊','🔥'][Math.floor(Math.random()*5)];
    c.style.cssText = `position:absolute; left:${cx}px; top:${cy}px; font-size:${14+Math.random()*14}px;`;
    layer.appendChild(c);
    const ang = Math.random()*Math.PI*2;
    const dist = 70 + Math.random()*140;
    gsap.set(c, { xPercent:-50, yPercent:-50, opacity:1 });
    gsap.to(c, { x: Math.cos(ang)*dist, y: Math.sin(ang)*dist - 30, rotate: Math.random()*360, duration: 0.9+Math.random()*0.5, ease:'power1.out' });
    gsap.to(c, { opacity:0, duration:0.6, delay:0.5 });
  }
  setTimeout(()=>layer.remove(), 1700);
}

function celebrateGameRound(g){
  const cur = g.current;
  if(!cur) return;
  let winnerNames = [], key = null;
  if(cur.phase === 'results'){
    key = `r${g.round}-${cur.type}`;
    const ids = cur.type === 'quiplash' ? (cur.winnerIds||[]) : (cur.correctGuessers||[]);
    winnerNames = ids.map(id=>state.members.find(m=>m.id===id)).filter(Boolean).map(m=>m.name);
  } else if(cur.type === 'gameover'){
    key = 'gameover';
    winnerNames = (cur.winnerIds||[]).map(id=>state.members.find(m=>m.id===id)).filter(Boolean).map(m=>m.name);
  }
  if(!winnerNames.length || key === lastCelebratedKey) return;
  lastCelebratedKey = key;
  const card = document.getElementById('gameCard') || document.getElementById('gameoverReveal');
  fireConfetti(card);
  if(cur.type === 'gameover'){
    toast(`👑 ${winnerNames.join(' & ')} vandt hele spillet! Hån frit resten af aftenen.`);
  }else{
    toast(randomTaunt(winnerNames.join(' & ')));
  }
}

function playRoundCountdown(){
  const el = document.createElement('div');
  el.className = 'game-countdown';
  el.innerHTML = `<div class="game-countdown-num">3</div>`;
  document.body.appendChild(el);
  const numEl = el.querySelector('.game-countdown-num');
  const steps = ['3','2','1'];
  let i = 0;
  const tick = ()=>{
    numEl.textContent = steps[i];
    if(typeof gsap !== 'undefined'){
      gsap.fromTo(numEl, { scale:.4, opacity:0 }, { scale:1, opacity:1, duration:.3, ease:'back.out(2)' });
      gsap.to(numEl, { opacity:0, duration:.2, delay:.6 });
    }
    i++;
    if(i < steps.length) setTimeout(tick, 850);
    else setTimeout(()=>el.remove(), 900);
  };
  tick();
}

function renderGameScreen(){
  const g = state.game || { active:false };
  if(g.active && !g.players) g.players = state.members.map(m=>m.id); // forsvar mod ældre spil-state uden players-feltet
  if(g.active && g.current && (g.current.phase === 'answer' || g.current.phase === 'write') && g.round !== lastCountdownRound){
    lastCountdownRound = g.round;
    playRoundCountdown();
  }
  app.innerHTML = `
    <header class="theme-spil">
      <div class="title" style="font-size:30px; display:flex; align-items:center; justify-content:space-between; gap:8px;">
        <span>Brok<span>spillet</span> 👉</span>
        <button id="btnAppMenu" title="Menu" style="width:32px; height:32px; padding:0; display:flex; align-items:center; justify-content:center; font-size:16px; background:rgba(255,247,232,0.08); border:1px solid rgba(255,247,232,0.15); color:rgba(255,247,232,0.85); border-radius:100px; flex:0 0 auto;">☰</button>
      </div>
    </header>
    <main id="main" style="padding:0 16px 40px;">${gameBodyHtml(g)}</main>
  `;
  document.getElementById('btnAppMenu').onclick = openAppMenuSheet;
  bindGameHandlers(g);
  const card = document.getElementById('gameCard') || document.getElementById('gameoverReveal');
  // Kun afspil kort-animationen OG genstarte nedtællingen når runde/fase
  // RENT FAKTISK skifter — ellers sker begge dele ved hvert stille poll (fx
  // når en anden spiller svarer), hvilket så ud som flimren og fik uret til
  // at hoppe tilbage til fuld tid igen og igen i stedet for at tælle ned.
  const animKey = g.active && g.current ? (g.round + ':' + g.current.type + ':' + g.current.phase) : 'lobby';
  const isNewGamePhase = animKey !== lastAnimatedGameKey;
  lastAnimatedGameKey = animKey;
  if(card && typeof gsap !== 'undefined' && isNewGamePhase){
    gsap.fromTo(card, { opacity:0, y:14, scale:.97 }, { opacity:1, y:0, scale:1, duration:.45, ease:'power2.out' });
  }
  if(g.active && profile && g.players && g.players.includes(profile.memberId)){
    if(isNewGamePhase || !gameTimerInterval) startGameTimer(g.current);
    else paintGameTimerNow();
  }else{
    clearInterval(gameTimerInterval);
    gameTimerInterval = null;
  }
  celebrateGameRound(g);
}

function gameBodyHtml(g){
  if(!g.active || !g.current) return gameLobbyHtml();
  const cur = g.current;
  if(cur.type !== 'gameover' && profile && g.players && !g.players.includes(profile.memberId)){
    return `
      <div class="game-badge">Runde ${g.round}/${g.totalRounds} · 👀 Du kigger med</div>
      <div class="empty-state"><span class="emoji">🍿</span><b>Du er ikke med i denne omgang</b>De andre spiller videre — du er velkommen næste spil.</div>
    `;
  }
  if(cur.type === 'gameover') return gameOverHtml(g, cur);
  if(cur.type === 'quiplash') return quiplashHtml(g, cur);
  if(cur.type === 'truefalse') return truefalseHtml(g, cur);
  if(cur.type === 'trivia') return triviaHtml(g, cur);
  if(cur.type === 'guessbrok') return guessBrokHtml(g, cur);
  return '';
}

function gameHighscoreHtml(){
  const stats = state.gameStats || {};
  const ranked = state.members
    .filter(m => stats[m.id] && stats[m.id].played > 0)
    .sort((a,b) => (stats[b.id].wins - stats[a.id].wins) || (stats[b.id].played - stats[a.id].played));
  if(!ranked.length) return '';
  const rows = ranked.map((m,i)=>`
    <div class="bal-row">
      <div class="avatar" style="width:34px;height:34px;font-size:12.5px;">${i===0?'🏆':(i+1)}</div>
      <div class="feed-body"><div class="bal-name">${escapeHtml(m.name)}</div><div style="font-size:12px; color:rgba(255,247,232,0.68);">${stats[m.id].played} spillet</div></div>
      <div class="bal-amt">${stats[m.id].wins} sejre</div>
    </div>
  `).join('');
  return `<div class="section-label">🏆 Highscore</div>${rows}`;
}

function gameProgressHtml(count, total, label){
  const pct = total ? Math.min(100, Math.round((count/total)*100)) : 0;
  return `<div class="game-progress"><span>${count}/${total} ${label}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div></div>`;
}

// Bruges i resultat-pausen mellem runder — hver spiller trykker selv "klar"
// i stedet for at én person kan tvinge alle videre; runden skifter først
// når alle har trykket (eller nedtællingen løber ud som nødbremse).
function gameReadyHtml(g, cur){
  const already = profile && (cur.readyIds||[]).includes(profile.memberId);
  const readyCount = (cur.readyIds||[]).length;
  return `
    ${gameProgressHtml(readyCount, g.players.length, 'er klar')}
    ${already
      ? `<div class="waiting-pill"><span class="waiting-dot"></span> Venter på de andre...</div>`
      : `<button class="game-btn" id="readyBtn">✅ Klar til næste runde</button>`}
  `;
}

function gameLobbyHtml(){
  const allIds = state.members.map(m=>m.id);
  if(!gameSelectedPlayers || !gameKnownMemberIds){
    gameSelectedPlayers = allIds.slice();
  }else{
    const newcomers = allIds.filter(id=>!gameKnownMemberIds.includes(id));
    // Fjerner ID'er på medlemmer der ikke længere er i rummet — ellers
    // tæller "Start spillet (X spillere)"-knappen dem stadig med, så den
    // ser aktiv/nok ud selvom kun de RESTERENDE, faktiske medlemmer er for
    // få, og serveren afviser starten et øjeblik efter med "vælg mindst..."
    gameSelectedPlayers = [...gameSelectedPlayers.filter(id=>allIds.includes(id)), ...newcomers];
  }
  gameKnownMemberIds = allIds.slice();
  const chips = state.members.map(m=>{
    const on = gameSelectedPlayers.includes(m.id);
    return `<div class="name-pill ${on?'selected':''}" data-player="${m.id}" style="${on?'':'opacity:.5;'}">${on?'✅':'➖'} ${escapeHtml(m.name)}</div>`;
  }).join('');
  const enough = gameSelectedPlayers.length >= 2;
  const gameSteps = [
    ['🎭', 'Skriv-og-stem: alle skriver et sjovt svar, så stemmer I på det bedste'],
    ['⚖️', 'Sandt/falsk: én skriver et udsagn om en anden — resten gætter'],
    ['🎯', 'Hvilket brok? Én skriver et RIGTIGT brok blandt 3 opdigtede — resten gætter hvilket der er ægte'],
    ['🔍', 'Trivia om jeres egen brok-historik (og lidt verdens-brok ind imellem)'],
    ['🏆', 'Point tælles på tværs af alle runder — flest point vinder'],
  ];
  if(gameInstructionsOpen === null) gameInstructionsOpen = !localStorage.getItem('bk_game_seen_instructions');
  localStorage.setItem('bk_game_seen_instructions', '1');
  return `
    <div class="empty-state" style="padding-top:18px;">
      <span class="emoji">👉</span>
      <b>Brokspillet</b>
      Skriv, gæt og stem jer igennem jeres egen brok-historie.
    </div>
    <div class="game-card" style="margin:10px 0 10px;">
      <div id="gameInstructionsToggle" style="display:flex; align-items:center; justify-content:space-between; cursor:pointer; ${gameInstructionsOpen?'margin-bottom:8px;':''}">
        <label class="field-label" style="color:rgba(255,247,232,0.7); margin:0;">Sådan foregår det</label>
        <span style="color:rgba(255,247,232,0.5); font-size:13px; transition:transform .2s; display:inline-block; ${gameInstructionsOpen?'transform:rotate(180deg);':''}">⌄</span>
      </div>
      ${gameInstructionsOpen ? gameSteps.map(([icon,text])=>`
        <div style="display:flex; gap:10px; align-items:flex-start; margin-bottom:9px;">
          <span style="font-size:16px; line-height:1.4;">${icon}</span>
          <p style="margin:0; font-size:13px; line-height:1.4; color:rgba(255,247,232,0.8);">${text}</p>
        </div>
      `).join('') : ''}
    </div>
    <div class="game-card" style="margin:10px 0;">
      <label class="field-label" style="color:rgba(255,247,232,0.7);">Hvem er med? (mindst 2)</label>
      <div class="name-grid" id="playerGrid">${chips}</div>
      <label class="field-label" style="color:rgba(255,247,232,0.7);">Spil om</label>
      <div class="segmented" style="margin-bottom:14px;">
        <div class="seg ${gameWager!=='euro'?'active':''}" data-wager="fun">🏅 Æren</div>
        <div class="seg ${gameWager==='euro'?'active':''}" data-wager="euro">💶 1 euro i kassen</div>
      </div>
      <label class="field-label" style="color:rgba(255,247,232,0.7);">Antal runder</label>
      <div class="segmented" style="margin-bottom:0;">
        <div class="seg ${gameRounds===5?'active':''}" data-rounds="5">5</div>
        <div class="seg ${gameRounds===8?'active':''}" data-rounds="8">8</div>
        <div class="seg ${gameRounds===12?'active':''}" data-rounds="12">12</div>
      </div>
    </div>
    <button class="game-btn" id="startGameBtn" ${enough?'':'disabled'}>👉 Start spillet (${gameSelectedPlayers.length} spillere)</button>
    ${enough?'':'<p class="hint" style="text-align:center;">Vælg mindst 2 spillere</p>'}
    ${gameHighscoreHtml()}
  `;
}

function quiplashHtml(g, cur){
  if(cur.phase === 'answer'){
    const answered = Object.keys(cur.answers||{}).length;
    const mine = profile && cur.answers[profile.memberId];
    return `
      <div class="game-badge" style="display:flex; align-items:center; justify-content:space-between; gap:10px;"><span>Runde ${g.round}/${g.totalRounds} · 🎭 Skriv-og-stem</span><span id="gameTimer" style="font-size:16px; font-weight:800; opacity:1;"></span></div>
      <div class="game-card" id="gameCard">
        <p style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:19px; margin:0 0 14px; line-height:1.3;">${escapeHtml(cur.prompt)}</p>
        <textarea id="quipInput" rows="2" maxlength="120" placeholder="Dit svar...">${mine?escapeHtml(mine):''}</textarea>
        <button class="game-btn" id="quipSubmitBtn" style="margin-top:10px;">🔒 Lås dit svar</button>
      </div>
      ${gameProgressHtml(answered, g.players.length, 'har svaret')}
      ${mine ? `<div class="waiting-pill"><span class="waiting-dot"></span> Venter på de andre...</div>` : ''}
    `;
  }
  if(cur.phase === 'vote'){
    const entries = Object.entries(cur.answers||{}).filter(([id])=>id!==(profile&&profile.memberId));
    const myVote = profile && cur.votes[profile.memberId];
    const votedCount = Object.keys(cur.votes||{}).length;
    const rows = entries.map(([id,text],i)=>`
      <div class="bal-row game-pick" data-vote-for="${id}" style="cursor:pointer; ${myVote===id?'outline:2px solid var(--coin);':''}">
        <div class="avatar" style="width:34px;height:34px;font-size:12.5px; background:linear-gradient(160deg, var(--coin), var(--coin-dark)); color:var(--ink);">${i+1}</div>
        <div class="feed-body"><div class="bal-name">"${escapeHtml(text)}"</div></div>
        ${myVote===id?'<span style="font-size:18px;">✓</span>':''}
      </div>
    `).join('');
    return `
      <div class="game-badge" style="display:flex; align-items:center; justify-content:space-between; gap:10px;"><span>Runde ${g.round}/${g.totalRounds} · Stem på det bedste svar</span><span id="gameTimer" style="font-size:16px; font-weight:800; opacity:1;"></span></div>
      <p class="hint" style="margin:0 0 10px; color:rgba(255,247,232,0.75);">${escapeHtml(cur.prompt)}</p>
      ${rows || '<p class="hint">Ingen andre svar at stemme på.</p>'}
      ${gameProgressHtml(votedCount, g.players.length, 'har stemt')}
      ${myVote ? `<div class="waiting-pill"><span class="waiting-dot"></span> Venter på de andre...</div>` : ''}
    `;
  }
  const winners = (cur.winnerIds||[]).map(id=>state.members.find(m=>m.id===id)).filter(Boolean);
  return `
    <div class="game-badge" style="display:flex; align-items:center; justify-content:space-between; gap:10px;"><span>Runde ${g.round}/${g.totalRounds} · Resultat</span><span id="gameTimer" style="font-size:16px; font-weight:800; opacity:1;"></span></div>
    <div class="game-card" id="gameCard" style="text-align:center;">
      <p style="margin:0 0 10px;">${escapeHtml(cur.prompt)}</p>
      ${cur.randomPick ? `<p class="hint" style="margin:0 0 10px;">🎰 Kun 2 spillere — I stemmer ikke, vinderen trækkes tilfældigt</p>` : ''}
      ${Object.entries(cur.answers||{}).map(([id,text])=>{
        const m = state.members.find(x=>x.id===id);
        const won = (cur.winnerIds||[]).includes(id);
        return `<div class="feed-item${won && cur.randomPick ? ' quip-slot-win' : ''}" style="${won?'border-color:var(--coin); background:rgba(255,201,60,0.16);':''}">
          <div class="avatar">${initials(m?m.name:'?')}</div>
          <div class="feed-body"><div class="feed-name">${escapeHtml(m?m.name:'?')} ${won?'🏆':''}</div><div class="feed-msg">"${escapeHtml(text)}"</div></div>
        </div>`;
      }).join('')}
      <p style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:17px; margin-top:12px; color:var(--coin);">${winners.length ? '🏆 ' + winners.map(w=>escapeHtml(w.name)).join(' & ') + ' vandt runden!' : 'Ingen stemmer denne gang.'}</p>
    </div>
    ${gameReadyHtml(g, cur)}
  `;
}

function truefalseHtml(g, cur){
  const author = state.members.find(m=>m.id===cur.authorId);
  const isAuthor = profile && profile.memberId === cur.authorId;
  if(cur.phase === 'skipped'){
    return `
      <div class="game-badge">Runde ${g.round}/${g.totalRounds} · ⚖️ Sandt eller falsk</div>
      <div class="empty-state"><span class="emoji">😴</span><b>${escapeHtml(author?author.name:'?')} nåede ikke at skrive et udsagn</b>Ingen sag denne gang — vi går videre til næste spørgsmål.</div>
      ${gameReadyHtml(g, cur)}
    `;
  }
  if(cur.phase === 'write'){
    if(!isAuthor){
      return `
        <div class="game-badge" style="display:flex; align-items:center; justify-content:space-between; gap:10px;"><span>Runde ${g.round}/${g.totalRounds} · ⚖️ Sandt eller falsk</span><span id="gameTimer" style="font-size:16px; font-weight:800; opacity:1;"></span></div>
        <div class="empty-state"><span class="emoji">✍️</span><b>${escapeHtml(author?author.name:'?')} skriver et udsagn...</b>Vent til det er klar, så skal I gætte.</div>
      `;
    }
    const chips = state.members.filter(m=>g.players.includes(m.id)).map(m=>`<div class="name-pill" data-target="${m.id}">${escapeHtml(m.name)}</div>`).join('');
    return `
      <div class="game-badge" style="display:flex; align-items:center; justify-content:space-between; gap:10px;"><span>Runde ${g.round}/${g.totalRounds} · ⚖️ Det er dig der skriver!</span><span id="gameTimer" style="font-size:16px; font-weight:800; opacity:1;"></span></div>
      <div class="game-card" id="gameCard">
        <label class="field-label" style="color:rgba(255,247,232,0.7);">👉 Om hvem? Vælg en person (kan være dig selv)</label>
        <div class="name-grid" id="ttTargetGrid">${chips}</div>
        <label class="field-label" style="color:rgba(255,247,232,0.7);">Udsagnet</label>
        <textarea id="ttStatement" rows="2" maxlength="120" placeholder="Skriv noget sandt eller opdigtet..."></textarea>
        <label class="field-label" style="color:rgba(255,247,232,0.7);">Er det sandt eller opdigtet? (vælg en)</label>
        <div class="segmented" id="ttTruthSeg" style="margin-top:0;">
          <div class="seg" data-truth="true">✅ Det er sandt</div>
          <div class="seg" data-truth="false">🎭 Jeg fandt på det</div>
        </div>
        <button class="game-btn" id="ttSubmitBtn" style="margin-top:12px;" disabled>🚀 Send udsagn</button>
      </div>
    `;
  }
  if(cur.phase === 'guess'){
    const target = state.members.find(m=>m.id===cur.targetId);
    const guessedCount = Object.keys(cur.guesses||{}).length;
    const eligible = cur.isWorld ? g.players.length : g.players.length - 1;
    const myGuess = profile && cur.guesses[profile.memberId] !== undefined;
    const badgeLabel = isAuthor ? '⚖️ Sandt eller falsk' : (myGuess ? '⚖️ Sandt eller falsk' : '⚖️ Stem nu: sandt eller opdigtet?');
    return `
      <div class="game-badge" style="display:flex; align-items:center; justify-content:space-between; gap:10px;"><span>Runde ${g.round}/${g.totalRounds} · ${badgeLabel}</span><span id="gameTimer" style="font-size:16px; font-weight:800; opacity:1;"></span></div>
      <div class="game-card" id="gameCard" style="text-align:center;">
        ${cur.isWorld ? `<p class="hint" style="margin:0 0 6px; color:rgba(255,201,60,0.85); font-weight:600;">🌍 Verdens-brok</p>` : cur.reused ? `<p class="hint" style="margin:0 0 6px; color:rgba(255,201,60,0.85); font-weight:600;">♻️ Genbrugt udsagn fra tidligere</p>` : ''}
        ${cur.isWorld ? '' : `<p class="hint" style="margin:0 0 6px; color:rgba(255,247,232,0.6);">${escapeHtml(author?author.name:'?')} skrev om ${escapeHtml(target?target.name:'?')}:</p>`}
        <p style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:19px;">"${escapeHtml(cur.statement)}"</p>
        ${(!cur.isWorld && isAuthor) ? '<p class="hint" style="color:rgba(255,247,232,0.6);">Du skrev det — vent på de andres gæt.</p>' : (myGuess ? '' : `
          <p style="font-weight:700; margin:10px 0 0; font-size:14px;">🗳️ Din tur — stem: er det sandt eller opdigtet?</p>
          <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="game-btn" data-guess="true" style="margin-top:0; background:linear-gradient(160deg, var(--sea), var(--sea-deep)); box-shadow:0 8px 18px rgba(11,58,63,0.4);">✅ Sandt</button>
            <button class="game-btn" data-guess="false" style="margin-top:0;">🎭 Opdigtet</button>
          </div>
        `)}
      </div>
      ${gameProgressHtml(guessedCount, eligible, 'har gættet')}
      ${(myGuess || (!cur.isWorld && isAuthor)) ? `<div class="waiting-pill"><span class="waiting-dot"></span> Venter på de andre...</div>` : ''}
    `;
  }
  const target = state.members.find(m=>m.id===cur.targetId);
  const correct = (cur.correctGuessers||[]).map(id=>state.members.find(m=>m.id===id)).filter(Boolean);
  return `
    <div class="game-badge" style="display:flex; align-items:center; justify-content:space-between; gap:10px;"><span>Runde ${g.round}/${g.totalRounds} · Resultat</span><span id="gameTimer" style="font-size:16px; font-weight:800; opacity:1;"></span></div>
    <div class="game-card" id="gameCard" style="text-align:center;">
      ${cur.isWorld ? `<p class="hint" style="color:rgba(255,201,60,0.85); font-weight:600;">🌍 Verdens-brok</p>` : `<p class="hint" style="color:rgba(255,247,232,0.6);">${escapeHtml(author?author.name:'?')} skrev om ${escapeHtml(target?target.name:'?')}:</p>`}
      <p style="font-family:'Baloo 2',sans-serif; font-weight:800; font-size:19px;">"${escapeHtml(cur.statement)}"</p>
      <p style="margin-top:10px; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:18px; color:${cur.isTrue?'var(--coin)':'var(--coral)'};">${cur.isTrue ? '✅ Det var faktisk SANDT' : '🎭 Det var OPDIGTET'}</p>
      <p class="hint" style="margin-top:8px; color:rgba(255,247,232,0.7);">${correct.length ? '🏆 ' + correct.map(m=>escapeHtml(m.name)).join(', ') + ' gættede rigtigt (+1)' : 'Ingen gættede rigtigt.'}</p>
      ${cur.authorWon ? `<p class="hint" style="color:rgba(255,201,60,0.85); font-weight:600;">😏 ${escapeHtml(author?author.name:'?')} narrede flertallet (+1)</p>` : ''}
    </div>
    ${gameReadyHtml(g, cur)}
  `;
}

function guessBrokHtml(g, cur){

      <div class="game-badge" style="display:flex; align-items:center; justify-content:space-between; gap:10px;"><span>Runde ${g.round}/${g.totalRounds} · ${badgeLabel}</span><span id="gameTimer" style="font-size:16px; font-weight:800; opacity:1;"></span></div>

  return `

function bindGameHandlers(g){
  const cur = g.current;
  const gameInstrToggle = document.getElementById('gameInstructionsToggle');
  if(gameInstrToggle) gameInstrToggle.onclick = ()=>{ gameInstructionsOpen = !gameInstructionsOpen; render(); };
  document.querySelectorAll('[data-wager]').forEach(el=>{
    el.onclick = ()=>{ gameWager = el.dataset.wager; render(); };
  });
  document.querySelectorAll('[data-rounds]').forEach(el=>{
    el.onclick = ()=>{ gameRounds = parseInt(el.dataset.rounds,10); render(); };
  });
  document.querySelectorAll('[data-player]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.player;
      if(gameSelectedPlayers.includes(id)) gameSelectedPlayers = gameSelectedPlayers.filter(x=>x!==id);
      else gameSelectedPlayers = [...gameSelectedPlayers, id];
      render();
    };
  });
  const startBtn = document.getElementById('startGameBtn');
  if(startBtn) startBtn.onclick = ()=> gameApi('start', { wager: gameWager, playerIds: gameSelectedPlayers, totalRounds: gameRounds });

  const readyBtn = document.getElementById('readyBtn');
  if(readyBtn) readyBtn.onclick = ()=> gameApi('ready', {});

  const playAgainBtn = document.getElementById('playAgainBtn');
  if(playAgainBtn) playAgainBtn.onclick = ()=>{
    gameApi('end', {}).then(()=> gameApi('start', { wager: gameWager, playerIds: gameSelectedPlayers, totalRounds: gameRounds }));
  };
  const endGameBtn = document.getElementById('endGameBtn');
  if(endGameBtn) endGameBtn.onclick = ()=> gameApi('end', {});

  if(!cur) return;

  if(cur.type === 'quiplash' && cur.phase === 'answer'){
    const btn = document.getElementById('quipSubmitBtn');
    if(btn) btn.onclick = ()=>{
      const text = document.getElementById('quipInput').value.trim();
      if(!text) return;
      lockSubmitBtn(btn, 'Låser svar...');
      gameApi('submit', { payload: { text } });
    };
  }
  if(cur.type === 'quiplash' && cur.phase === 'vote'){
    document.querySelectorAll('[data-vote-for]').forEach(el=>{
      el.onclick = ()=> gameApi('submit', { payload: { votedFor: el.dataset.voteFor } });
    });
  }
  if(cur.type === 'truefalse' && cur.phase === 'write' && profile && profile.memberId === cur.authorId){
    let chosenTarget = null; // skal vælges eksplicit — ingen forudvalgt person, så man aktivt tager stilling til hvem det handler om
    let chosenTruth = null; // skal vælges eksplicit — ingen forudvalgt "sandt", så man ikke sender ved et uheld uden at tage stilling
    const input = document.getElementById('ttStatement');
    const submitBtn = document.getElementById('ttSubmitBtn');
    const updateSubmitState = ()=>{ submitBtn.disabled = !input.value.trim() || chosenTruth === null || chosenTarget === null; };
    document.querySelectorAll('#ttTargetGrid .name-pill').forEach(p=>{
      p.onclick = ()=>{
        document.querySelectorAll('#ttTargetGrid .name-pill').forEach(x=>x.classList.remove('selected'));
        p.classList.add('selected'); chosenTarget = p.dataset.target;
        updateSubmitState();
      };
    });
    document.querySelectorAll('[data-truth]').forEach(seg=>{
      seg.onclick = ()=>{
        document.querySelectorAll('[data-truth]').forEach(x=>x.classList.remove('active'));
        seg.classList.add('active'); chosenTruth = seg.dataset.truth === 'true';
        updateSubmitState();
      };
    });
    input.addEventListener('input', updateSubmitState);
    submitBtn.onclick = ()=>{
      const statement = input.value.trim();
      if(!statement || chosenTruth === null || chosenTarget === null) return;
      lockSubmitBtn(submitBtn, 'Sender...');
      gameApi('submit', { payload: { targetId: chosenTarget, statement, isTrue: chosenTruth } });
    };
  }
  if(cur.type === 'truefalse' && cur.phase === 'guess' && profile && profile.memberId !== cur.authorId){
    document.querySelectorAll('[data-guess]').forEach(btn=>{
      btn.onclick = ()=> gameApi('submit', { payload: { guess: btn.dataset.guess === 'true' } });
    });
  }
  if(cur.type === 'trivia' && cur.phase === 'answer'){
    document.querySelectorAll('[data-choice]').forEach(el=>{
      el.onclick = ()=> gameApi('submit', { payload: { choiceIndex: parseInt(el.dataset.choice,10) } });
    });
  }
  if(cur.type === 'guessbrok' && cur.phase === 'write' && profile && profile.memberId === cur.authorId){
    const input = document.getElementById('gbStatement');
    const submitBtn = document.getElementById('gbSubmitBtn');
    const updateSubmitState = ()=>{ submitBtn.disabled = !input.value.trim(); };
    input.addEventListener('input', updateSubmitState);
    submitBtn.onclick = ()=>{
      const statement = input.value.trim();
      if(!statement) return;
      lockSubmitBtn(submitBtn, 'Sender...');
      gameApi('submit', { payload: { statement } });
    };
  }
  if(cur.type === 'guessbrok' && cur.phase === 'guess' && profile && profile.memberId !== cur.authorId){
    document.querySelectorAll('[data-choice]').forEach(el=>{
      el.onclick = ()=> gameApi('submit', { payload: { choiceIndex: parseInt(el.dataset.choice,10) } });
    });
  }
}

// Nedtælling pr. fase — samme nødbremse-filosofi som Brokspillet: ingen kan
// blokere resten af rummet ved bare at sidde stille.
const MRBROK_PHASE_SECONDS = { 'turn:ask': 30, 'turn:answer': 30, 'guess:guess': 25, 'steal:guessing': 30, 'steal:voting': 25 };
function mrbrokTimerKey(cur){
  if(cur.type === 'steal') return 'steal:' + (cur.guess ? 'voting' : 'guessing');
  if(cur.type === 'turn') return 'turn:' + cur.phase;
  if(cur.type === 'guess') return 'guess:guess';
  return null;
}
function paintMrbrokTimerNow(){
  // Samme flimmer-fix som paintGameTimerNow(): mal den friske #mrbrokTimer-
  // node med det samme efter et stille poll, i stedet for at lade den stå
  // tom indtil den gamle intervals næste tick (op til 1 sekund senere).
  if(!mrbrokTimerDeadline) return;
  const el = document.getElementById('mrbrokTimer');
  if(!el) return;
  const left = Math.max(0, Math.ceil((mrbrokTimerDeadline - Date.now())/1000));
  el.textContent = '⏱️ ' + left + 's';
  el.style.color = left <= 10 ? '#FFD9CC' : '';
  el.classList.toggle('game-timer-urgent', left <= 10 && left > 0);
}
function startMrbrokTimer(cur){
  clearInterval(mrbrokTimerInterval);
  mrbrokTimerInterval = null;
  if(!cur || cur.type === 'gameover') return;
  const key = mrbrokTimerKey(cur);
  const secs = key ? MRBROK_PHASE_SECONDS[key] : null;
  if(!secs){ mrbrokTimerDeadline = null; return; }
  mrbrokTimerDeadline = Date.now() + secs*1000;
  const tick = ()=>{
    const el = document.getElementById('mrbrokTimer');
    const left = Math.max(0, Math.ceil((mrbrokTimerDeadline - Date.now())/1000));
    if(el){
      el.textContent = '⏱️ ' + left + 's';
      el.style.color = left <= 10 ? '#FFD9CC' : '';
      el.classList.toggle('game-timer-urgent', left <= 10 && left > 0);
    }
    if(left <= 0){
      clearInterval(mrbrokTimerInterval);
      mrbrokTimerInterval = null;
      mrbrokApi('advance', {});
    }
  };
  tick();
  mrbrokTimerInterval = setInterval(tick, 1000);
}

function renderMrbrokScreen(){
  const m = state.mrbrok || { active:false };
  app.innerHTML = `
    <header class="theme-mrbrok">
      <div class="title" style="font-size:30px; display:flex; align-items:center; justify-content:space-between; gap:8px;">
        <span>Mr<span>Brok</span> 🕵️</span>

      </div>
    </header>
    <main id="main" style="padding:0 16px 40px;">${mrbrokBodyHtml(m)}</main>
  `;
  document.getElementById('btnAppMenu').onclick = openAppMenuSheet;
  bindMrbrokHandlers(m);
  const card = document.getElementById('mrbrokCard') || document.getElementById('mrbrokReveal');
  // Samme fix som Brokspillet: kun animér/genstart nedtællingen ved et
  // rigtigt fase-skift, ikke ved hvert stille poll — ellers flimrer kortet
  // og uret hopper tilbage til fuld tid hver gang en anden spiller reagerer.
  const mrbrokAnimKey = m.active && m.current ? (m.round + ':' + mrbrokTimerKey(m.current)) : 'lobby';
  const isNewMrbrokPhase = mrbrokAnimKey !== lastAnimatedMrbrokKey;
  lastAnimatedMrbrokKey = mrbrokAnimKey;
  if(card && typeof gsap !== 'undefined' && isNewMrbrokPhase){
    gsap.fromTo(card, { opacity:0, y:14, scale:.97 }, { opacity:1, y:0, scale:1, duration:.45, ease:'power2.out' });
  }
  if(m.active && profile && m.players && m.players.includes(profile.memberId)){
    if(isNewMrbrokPhase || !mrbrokTimerInterval) startMrbrokTimer(m.current);
    else paintMrbrokTimerNow();
  }else{
    clearInterval(mrbrokTimerInterval);
    mrbrokTimerInterval = null;
  }
}

  return '';
}

function mrbrokTurnHtml(m, cur){
  const asker = state.members.find(mm=>mm.id===cur.askerId);
  const target = state.members.find(mm=>mm.id===cur.targetId);
  const isAsker = profile && profile.memberId === cur.askerId;
  const isTarget = profile && profile.memberId === cur.targetId;
  const turnNo = cur.turnIndex + 1, totalTurns = cur.pairing.length;

function mrbrokRecapHtml(m, cur){
  if(!cur.history || !cur.history.length) return '';
  const rows = cur.history.map(h=>{
    const turns = h.turns.map(t=>{
      const asker = state.members.find(mm=>mm.id===t.askerId);
      const target = state.members.find(mm=>mm.id===t.targetId);
      return `<p class="hint" style="margin:2px 0; color:rgba(255,247,232,0.75);">${escapeHtml(asker?asker.name:'?')} → ${escapeHtml(target?target.name:'?')}: "${escapeHtml(t.question||'')}" — "${escapeHtml(t.answer||'')}"</p>`;
    }).join('');
    const guesses = Object.entries(h.guesses||{}).map(([voterId,guessedId])=>{
      const voter = state.members.find(mm=>mm.id===voterId);
      const guessed = state.members.find(mm=>mm.id===guessedId);
      const right = guessedId === cur.mrBrokId;
      return `<span style="display:inline-block; margin:2px 6px 2px 0; padding:3px 9px; border-radius:100px; font-size:11.5px; background:${right?'rgba(255,201,60,0.18)':'rgba(255,247,232,0.08)'};">${escapeHtml(voter?voter.name:'?')} → ${escapeHtml(guessed?guessed.name:'?')} ${right?'✓':''}</span>`;
    }).join('');
    return `<div class="game-card" style="text-align:left; margin-bottom:8px;">
      <p style="font-weight:700; margin:0 0 6px;">Omgang ${h.round}</p>
      ${turns}
      <div style="margin-top:8px;">${guesses}</div>
    </div>`;
  }).join('');
  return `<div class="section-label">📜 Sådan gik det</div>${rows}`;
}

      <p class="hint" style="color:rgba(255,247,232,0.6);">Emnet var: <b style="color:rgba(255,247,232,0.85);">${escapeHtml(cur.topic||'?')}</b></p>

      ${stealLine}

    <button class="game-btn ghost" id="mrbrokEndBtn">Tilbage til lobbyen</button>

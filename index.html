  if(document.getElementById('sheetBackdrop')) return; // vent — prøves igen næste render, når dialogen er lukket
  localStorage.setItem(key, marker); // marker først NU, når vi rent faktisk viser den (undgår at "spise" den uset)
  playFreeBrokDraw();
}

function playFreeBrokDraw(previewWinnerId, isPreview){
  const winner = state.members.find(m=>m.id===(previewWinnerId || state.freeBrokMemberId));
  if(!winner) return;
  const members = state.members;
  const REEL_H = 58;

  function buildStrip(){
    const n = 14 + Math.floor(Math.random()*4);
    const syms = [];
    for(let i=0;i<n;i++) syms.push(members[Math.floor(Math.random()*members.length)]);
    syms.push(winner); // sidste symbol i strimlen — det reel'en lander på
    return syms;
  }

  const reels = [buildStrip(), buildStrip(), buildStrip()];
  const reelsHtml = reels.map((syms,ri)=>`
    <div class="reel"><div class="reel-strip" id="reelStrip${ri}">
      ${syms.map(m=>`<div class="reel-symbol"><div class="avatar">${initials(m.name)}</div></div>`).join('')}
    </div></div>
  `).join('');

  openSheet(`
    <div style="text-align:center; padding:4px 0 6px;">
      <div id="slotBanner" class="slot-banner">🎰 DAGENS GRATIS BROK${isPreview ? ' (test)' : ''}</div>
      <div class="slot-cabinet" id="slotCabinet">
        <div class="slot-window">${reelsHtml}</div>
        <button class="slot-lever" id="pullLever">🎰 Træk i håndtaget!</button>
        <div class="slot-winner-name" id="slotWinnerName">${escapeHtml(winner.name)} vandt! 🍀</div>
      </div>
    </div>
    <button class="sheet-btn ghost" id="drawCloseBtn" style="display:none; margin-top:10px;">Luk</button>
  `, ()=>{
    const cabinet = document.getElementById('slotCabinet');
    const banner = document.getElementById('slotBanner');
    const lever = document.getElementById('pullLever');
    const winnerNameEl = document.getElementById('slotWinnerName');
    const closeBtn = document.getElementById('drawCloseBtn');
    closeBtn.onclick = ()=>{
      closeSheet();
      if(!isPreview) setTimeout(()=>toast(`☀️ Dag ${dayCount()} er skudt i gang — af sted!`), 260);
    };

    if(typeof gsap !== 'undefined'){
      gsap.to(banner, { rotate: 2.5, duration: 1.1, ease: 'sine.inOut', yoyo: true, repeat: -1 });
    }

    function winConfetti(){
      const rect = cabinet.getBoundingClientRect();
      const cx = rect.left + rect.width/2, cy = rect.top + 24;
      const layer = document.createElement('div');
      layer.className = 'confetti';
      document.body.appendChild(layer);
      for(let i=0;i<24;i++){
        const c = document.createElement('div');
        c.textContent = ['🎉','✨','🪙','🎊'][Math.floor(Math.random()*4)];
        c.style.cssText = `position:absolute; left:${cx}px; top:${cy}px; font-size:${14+Math.random()*12}px;`;
        layer.appendChild(c);
        const ang = Math.random()*Math.PI - Math.PI/2 - Math.PI/2; // opad-fan
        const dist = 60 + Math.random()*120;
        if(typeof gsap !== 'undefined'){
          gsap.set(c, { xPercent:-50, yPercent:-50, opacity:1 });
          gsap.to(c, { x: Math.cos(ang)*dist, y: Math.sin(ang)*dist + 40, rotate: Math.random()*360, duration: 0.9+Math.random()*0.4, ease:'power1.out' });
          gsap.to(c, { opacity:0, duration:0.6, delay:0.5 });
        }
      }
      setTimeout(()=>layer.remove(), 1600);
    }

    function onAllStopped(){
      cabinet.classList.add('win');
      winConfetti();
      if(typeof gsap !== 'undefined'){
        gsap.fromTo(winnerNameEl, {opacity:0, y:6}, {opacity:1, y:0, duration:.4, ease:'power2.out'});
      }else{
        winnerNameEl.style.opacity = '1';
      }
      closeBtn.style.display = 'block';
      toast(`🍀 ${winner.name} har dagens gratis brok!`);
    }

    lever.onclick = ()=>{
      lever.disabled = true;
      const durations = [1.0, 1.5, 2.1];
      let doneCount = 0;
      reels.forEach((syms, ri)=>{
        const strip = document.getElementById('reelStrip'+ri);
        const distance = (syms.length-1) * REEL_H;
        const finish = ()=>{ doneCount++; if(doneCount === reels.length) onAllStopped(); };
        if(typeof gsap !== 'undefined'){
          gsap.fromTo(strip, { y: 0 }, { y: -distance, duration: durations[ri], ease: 'power3.out', onComplete: finish });
        }else{
          strip.style.transition = `transform ${durations[ri]}s ease-out`;
          strip.style.transform = `translateY(-${distance}px)`;
          setTimeout(finish, durations[ri]*1000);
        }
      });
    };
  });
}

function bounceJar(){
  const jarSvg = document.querySelector('.jar-svg');
  if(!jarSvg) return;
  const rot = Math.random() * 6 - 3;
  if(typeof gsap === 'undefined'){
    jarSvg.style.transition = 'transform .28s cubic-bezier(.34,1.56,.64,1)';
    jarSvg.style.transform = `scale(1.05) rotate(${rot}deg)`;
    setTimeout(()=>{ jarSvg.style.transform = 'scale(1) rotate(0deg)'; }, 170);
    return;
  }
  gsap.set(jarSvg, { transformOrigin: '50% 100%' });
  gsap.timeline()
    .to(jarSvg, { scale: 1.09, rotate: rot, duration: 0.14, ease: 'power2.out' })
    .to(jarSvg, { scale: 1, rotate: 0, duration: 0.7, ease: 'elastic.out(1, 0.4)' });
}

function launchCoinToJar(onDone){
  const jarWrap = document.querySelector('.jar-wrap');
  const rect = jarWrap ? jarWrap.getBoundingClientRect() : null;
  const endX = rect ? rect.left + rect.width/2 : window.innerWidth/2;
  const endY = rect ? rect.top + rect.height*0.62 : window.innerHeight*0.35;
  const startX = window.innerWidth/2;
  const startY = 64;

  const layer = document.createElement('div');
  layer.className = 'confetti';
  document.body.appendChild(layer);

  if(typeof gsap === 'undefined'){
    // Fallback uden GSAP, hvis scriptet af en eller anden grund ikke loadede
    layer.remove();
    if(onDone) onDone();
    return;
  }

  const coin = document.createElement('div');
  coin.textContent = '🪙';
  coin.style.cssText = `position:absolute; left:${startX}px; top:${startY}px; font-size:36px; z-index:2;`;
  layer.appendChild(coin);
  gsap.set(coin, { xPercent: -50, yPercent: -50, scale: 0.5, rotate: 0 });

  const impact = () => {
    // lille møntsprøjt ved nedslaget
    for(let i=0;i<9;i++){
      const c = document.createElement('div');
      c.textContent = Math.random() > 0.5 ? '🪙' : '✨';
      const ang = Math.random()*Math.PI*2, dist = 24+Math.random()*46;
      c.style.cssText = `position:absolute; left:${endX}px; top:${endY}px; font-size:${12+Math.random()*10}px;`;
      layer.appendChild(c);
      gsap.set(c, { xPercent: -50, yPercent: -50, scale: 0.6, opacity: 1 });
      gsap.to(c, {
        x: Math.cos(ang)*dist, y: Math.sin(ang)*dist - 18, rotate: Math.random()*360, scale: 1,
        duration: 0.6, ease: 'power2.out',
      });
      gsap.to(c, { opacity: 0, duration: 0.5, delay: 0.25 });
    }
    // krukken "hopper" ved nedslaget
    const jarSvg = document.querySelector('.jar-svg');
    if(jarSvg){
      gsap.set(jarSvg, { transformOrigin: '50% 100%' });
      gsap.timeline()
        .to(jarSvg, { scale: 1.09, y: 2, duration: 0.16, ease: 'power2.out' })
        .to(jarSvg, { scale: 1, y: 0, duration: 0.65, ease: 'elastic.out(1, 0.4)' });
    }
    if(onDone) onDone();
  };

  gsap.timeline()
    .to(coin, { left: endX, top: endY, scale: 1.15, rotate: 480, duration: 0.7, ease: 'power2.in' })
    .to(coin, { opacity: 0, duration: 0.2 }, '-=0.05')
    .add(impact);

  setTimeout(()=>layer.remove(), 1500);
}

    <p class="hint" style="${hintStyle}">Sletter alt med det samme. Ingen fortrydelse.</p>

    <button class="sheet-btn ghost" id="adminMenuCloseBtn">Luk menu</button>
    <p class="hint" style="text-align:center; font-size:10.5px; opacity:.4; margin-top:6px;">🔧 ${pushDebugInfo()} · ${BUILD_TAG}</p>
  `, ()=>{
    document.getElementById('adminGoalBtn').onclick = ()=>{ closeSheet(); setTimeout(openGoalSheet, 230); };
    document.getElementById('adminBroadcastBtn').onclick = ()=>{ closeSheet(); setTimeout(openBroadcastSheet, 230); };
    document.getElementById('adminSettleBtn').onclick = ()=>{ closeSheet(); setTimeout(openSettleSheet, 230); };
    const removeBtn = document.getElementById('adminRemoveEventBtn');
    if(removeBtn) removeBtn.onclick = ()=>{ closeSheet(); setTimeout(openRemoveEventSheet, 230); };
    document.getElementById('adminTestDrawBtn').onclick = ()=>{
      if(state.members.length < 2){ toast('kræver mindst 2 medlemmer for at vise dette'); return; }
      const previewWinner = state.members[Math.floor(Math.random()*state.members.length)];
      closeSheet();
      setTimeout(()=>playFreeBrokDraw(previewWinner.id, true), 230);
    };
    const undoBtn = document.getElementById('adminUndoBtn');
    if(undoBtn) undoBtn.onclick = ()=>{ closeSheet(); setTimeout(openUndoArchiveSheet, 230); };
    document.getElementById('adminBackdateBtn').onclick = async ()=>{
      try{
        const r = await api('admin', { action: 'backdate', roomId, actorId: profile.memberId });
        state = r.state;
        closeSheet();
        toast(`☀️ Dagstæller rykket — nu dag ${dayCount()}`);
      }catch(e){ toast(e.message); }
    };
    document.getElementById('adminResetBtn').onclick = ()=>{ closeSheet(); setTimeout(openResetSheet, 230); };
    document.getElementById('adminFinalCloseBtn').onclick = ()=>{ closeSheet(); setTimeout(openFinalCloseSheet, 230); };
    document.getElementById('adminDeleteRoomBtn').onclick = ()=>{ closeSheet(); setTimeout(openDeleteRoomSheet, 230); };
    document.getElementById('adminMenuCloseBtn').onclick = closeSheet;
  });
}

function openRemoveEventSheet(){
  const rows = state.events.slice().sort((a,b)=>b.ts-a.ts).map(e=>{
    const m = state.members.find(x=>x.id===e.memberId);
    const time = new Date(e.ts).toLocaleString('da-DK',{day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
    return `<div class="bal-row" style="${e.voided?'opacity:.6;':''}">
      <div class="avatar" style="width:34px;height:34px;font-size:12.5px;">${initials(m?m.name:'?')}</div>
      <div class="feed-body">
        <div class="bal-name">${escapeHtml(m?m.name:'?')}${e.free?' 🎫':''}${e.voided?' 🫤':''}</div>
        <div style="font-size:12px; color:rgba(5,32,36,0.55);">${time}${e.message?' · "'+escapeHtml(e.message)+'"':''}</div>
      </div>
      <button class="sheet-btn ghost" style="width:auto; margin:0; padding:6px 10px; font-size:12px;" data-flag-event="${e.id}" data-voided="${e.voided ? '0' : '1'}">${e.voided ? 'Fortryd' : 'Markér'}</button>
    </div>`;
  }).join('');
  openSheet(`
    <h2>Markér mistænkt snyd 🫤</h2>
    <p class="hint">Et markeret brok bliver stående i feedet, men gråtonet og streget over — og tæller ikke længere med i puljen. Ingen anklage, bare en synlig mistanke, så folk selv regulerer det. Fortryd markeringen igen hvis den var forkert.</p>
    ${rows || '<p class="hint">Ingen brok i den aktive pulje lige nu.</p>'}
    <button class="sheet-btn ghost" id="cancelRemoveEvent">Luk</button>
  `, ()=>{
    document.getElementById('cancelRemoveEvent').onclick = closeSheet;
    document.querySelectorAll('[data-flag-event]').forEach(btn=>{
      btn.onclick = async ()=>{
        try{
          const r = await api('admin', { action: 'flagEvent', roomId, actorId: profile.memberId, eventId: btn.dataset.flagEvent, voided: btn.dataset.voided === '1' });
          state = r.state;
          closeSheet();
          toast(btn.dataset.voided === '1' ? '🫤 Markeret som mistænkt' : '↩️ Markering fortrudt');
        }catch(e){ toast(e.message); }
      };
    });
  });
}

function openUndoArchiveSheet(){
  const last = state.history[state.history.length-1];
  if(!last) return;
  openSheet(`
    <h2>Fortryd seneste opgørelse ↩️</h2>
    <p class="hint">Lægger de seneste ${last.total}€ (fra ${new Date(last.startedAt).toLocaleDateString('da-DK',{day:'2-digit',month:'short'})}–${new Date(last.closedAt).toLocaleDateString('da-DK',{day:'2-digit',month:'short'})}) tilbage i den aktive pulje, som om opgørelsen aldrig skete. Kun til at rette fejl — brug det ikke bare fordi nogen fortrød en betaling.</p>
    <button class="sheet-btn danger" id="doUndo">Ja, læg det tilbage</button>
    <button class="sheet-btn ghost" id="cancelUndo">Annuller</button>
  `, ()=>{
    document.getElementById('cancelUndo').onclick = closeSheet;
    document.getElementById('doUndo').onclick = async ()=>{
      try{
        const r = await api('admin', { action: 'undoArchive', roomId, actorId: profile.memberId });
        state = r.state;
        closeSheet();
        toast('↩️ Opgørelsen er fortrudt — puljen er tilbage');
        activeTab = 'feed';
        render();
      }catch(e){ toast(e.message); }
    };
  });
}

function openGoalSheet(){
  openSheet(`
    <h2>Sæt mål for potten 🎯</h2>
    <p class="hint">Kort fri tekst der vises for alle under krukken. Fx "Fælles middag sidste aften". Kan ændres når som helst.</p>
    <input type="text" id="goalInput" maxlength="100" placeholder="Fx: Fælles middag sidste aften" value="${escapeHtml(state.goal||'')}" />
    <button class="sheet-btn primary" id="doGoal">Gem</button>
    <button class="sheet-btn ghost" id="cancelGoal">Annuller</button>
  `, ()=>{
    document.getElementById('cancelGoal').onclick = closeSheet;
    document.getElementById('doGoal').onclick = async ()=>{
      const goal = document.getElementById('goalInput').value.trim();
      try{ const r = await api('admin', { action: 'goal', roomId, actorId: profile.memberId, goal }); state = r.state; closeSheet(); toast('🎯 Mål opdateret'); render(); }
      catch(e){ toast(e.message); }
    };
  });
}

function openBroadcastSheet(){
  openSheet(`
    <h2>Send besked til alle 📣</h2>
    <p class="hint">Sendes som en rigtig push-notifikation til alle der har slået notifikationer til (🔔).</p>
    <textarea id="broadcastInput" rows="3" maxlength="200" placeholder="Fx: Kære familie – nu kører det! I morgen kan du enten vinde dagens gratis brok, eller også er det bare dig der brokker dig for meget 😉"></textarea>
    <button class="sheet-btn primary" id="doBroadcast">Send</button>
    <button class="sheet-btn ghost" id="cancelBroadcast">Annuller</button>
  `, ()=>{
    document.getElementById('cancelBroadcast').onclick = closeSheet;
    document.getElementById('doBroadcast').onclick = async ()=>{
      const message = document.getElementById('broadcastInput').value.trim();
      if(!message){ toast('Skriv en besked først'); return; }
      const btn = document.getElementById('doBroadcast');
      btn.innerHTML = '<span class="spinner"></span>';
      try{
        const r = await api('admin', { action: 'broadcast', roomId, actorId: profile.memberId, message });
        closeSheet();
        toast(r.sentTo > 0 ? `📣 Besked sendt til ${r.sentTo}${r.sentTo===1?' person':' personer'}` : 'Sendt — men ingen har slået notifikationer til endnu');
      }catch(e){ toast(e.message); btn.textContent = 'Send'; }
    };
  });
}

function openSettleSheet(){
  if(!state.events.length){ toast('Puljen er tom — intet at gøre op endnu 🙂'); return; }
  const bal = balances();
  const rows = state.members.map(m=>`<div class="hr-line"><span>${escapeHtml(m.name)}</span><span>${bal[m.id]||0}€</span></div>`).join('');
  openSheet(`
    <h2>Gør op 💶</h2>
    <p class="hint">Total i puljen: <b>${totalPool()}€</b>. Dette arkiverer hele puljen i historikken og starter helt forfra. Streaks og gratis brok opdateres som normalt.</p>
    ${rows}
    <button class="sheet-btn danger" id="doSettle">Bekræft og gør op</button>
    <button class="sheet-btn ghost" id="cancelSettle">Annuller</button>
  `, ()=>{
    document.getElementById('cancelSettle').onclick = closeSheet;
    document.getElementById('doSettle').onclick = async ()=>{
      try{
        const r = await api('admin', { action: 'settle', roomId, actorId: profile.memberId });
        state = r.state;
        closeSheet();
        toast('✅ Puljen er gjort op — helt tømt igen!');
        activeTab='broklisten'; brokListSubTab='alltime';
        render();
      }
      catch(e){ toast(e.message); }
    };
  });
}

function openResetSheet(){
  openSheet(`
    <h2>Nulstil alt 🧹</h2>
    <p class="hint">Dette sletter puljen, hele feedet og hele historikken permanent for alle. Medlemmerne bliver — de skal ikke skrive navn igen. Kan ikke fortrydes.</p>
    <button class="sheet-btn danger" id="doReset">Ja, nulstil alt</button>
    <button class="sheet-btn ghost" id="cancelReset">Annuller</button>
  `, ()=>{
    document.getElementById('cancelReset').onclick = closeSheet;
    document.getElementById('doReset').onclick = async ()=>{
      try{ const r = await api('admin', { action: 'reset', roomId, actorId: profile.memberId }); state = r.state; closeSheet(); toast('🧹 Alt er nulstillet'); activeTab='feed'; render(); }
      catch(e){ toast(e.message); }
    };
  });
}

function openFinalCloseSheet(){
  openSheet(`
    <h2>Luk denne brokkekasse for altid 🔒</h2>
    <p class="hint">Gør evt. den sidste åbne pulje op, gemmer den i historikken og lukker denne brokkekasse helt af — ingen kan starte flere brok herefter. I kan stadig se Regnskab og Historik. Kan ikke fortrydes.</p>
    <button class="sheet-btn danger" id="doFinalClose">Ja, luk for altid</button>
    <button class="sheet-btn ghost" id="cancelFinalClose">Annuller</button>
  `, ()=>{
    document.getElementById('cancelFinalClose').onclick = closeSheet;
    document.getElementById('doFinalClose').onclick = async ()=>{
      try{ const r = await api('admin', { action: 'close', roomId, actorId: profile.memberId }); state = r.state; closeSheet(); toast('🔒 Brokkekassen er lukket — tak for turen!'); activeTab='broklisten'; brokListSubTab='alltime'; render(); }
      catch(e){ toast(e.message); }
    };
  });
}

function openDeleteRoomSheet(){
  openSheet(`
    <h2>Slet dette rum permanent 🗑️</h2>
    <p class="hint">Sletter HELE rummet med det samme — regnskab, historik, medlemmer, alt. Koden <b>${roomId}</b> virker ikke mere for nogen. Kan ikke fortrydes. Brug det kun hvis rummet reelt blev oprettet ved en fejl (fx en dublet).</p>
    <button class="sheet-btn danger" id="doDeleteRoom">Ja, slet permanent</button>
    <button class="sheet-btn ghost" id="cancelDeleteRoom">Annuller</button>
  `, ()=>{
    document.getElementById('cancelDeleteRoom').onclick = closeSheet;
    document.getElementById('doDeleteRoom').onclick = async ()=>{
      try{
        await api('admin', { action: 'deleteRoom', roomId, actorId: profile.memberId });
        const rooms = getMyRooms();
        delete rooms[roomId];
        localStorage.setItem('bk_myRooms', JSON.stringify(rooms));
        localStorage.removeItem('bk_profile_' + roomId);
        closeSheet();
        leaveRoom();
        toast('🗑️ Rummet er slettet');
      }catch(e){ toast(e.message); }
    };
  });
}

/* ============ TRÆK-NED-FOR-AT-OPDATERE ============ */
(function setupPullToRefresh(){
  const THRESHOLD = 70;
  let startY = null, pulling = false, indicator = null;

  function ensureIndicator(){
    if(indicator) return indicator;
    indicator = document.createElement('div');
    indicator.style.cssText = 'position:fixed; top:10px; left:50%; transform:translateX(-50%) scale(.6); opacity:0; z-index:90; width:34px; height:34px; border-radius:50%; background:rgba(255,247,232,0.95); display:flex; align-items:center; justify-content:center; font-size:16px; pointer-events:none; box-shadow:0 4px 12px rgba(0,0,0,.25);';
    indicator.textContent = '🔄';
    document.body.appendChild(indicator);
    return indicator;
  }
  function reset(){
    if(indicator){ indicator.style.opacity = '0'; indicator.style.transform = 'translateX(-50%) scale(.6)'; }
    startY = null; pulling = false;
  }

  document.addEventListener('touchstart', e=>{
    const main = document.getElementById('main');
    if(!main || !roomId || main.scrollTop > 0){ startY = null; return; }
    startY = e.touches[0].clientY;
    pulling = false;
  }, { passive:true });

  document.addEventListener('touchmove', e=>{
    if(startY === null) return;
    const main = document.getElementById('main');
    if(!main || main.scrollTop > 0) return;
    const dy = e.touches[0].clientY - startY;
    if(dy <= 0) return;
    pulling = true;
    const ind = ensureIndicator();
    const pull = Math.min(dy, 120);
    ind.style.transition = 'none';
    ind.style.opacity = Math.min(1, pull / THRESHOLD);
    ind.style.transform = `translateX(-50%) translateY(${Math.min(pull,60)}px) scale(${0.6 + Math.min(pull/THRESHOLD,1)*0.4}) rotate(${pull*2}deg)`;
  }, { passive:true });

  document.addEventListener('touchend', ()=>{
    if(pulling && indicator){
      indicator.style.transition = 'opacity .2s, transform .2s';
      const pulledEnough = parseFloat(indicator.style.opacity || '0') >= 1;
      if(pulledEnough){
        indicator.textContent = '⏳';
        refreshState(true).finally(()=>{ reset(); setTimeout(()=>{ if(indicator) indicator.textContent = '🔄'; }, 300); });
        return;
      }
    }
    reset();
  }, { passive:true });
})();

/* ============ INIT ============ */
boot();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    // Tjek for opdatering med det samme ved åbning, ikke kun når appen senere
    // kommer i forgrunden igen — ellers kræver en opdatering altid mindst én
    // baggrund/forgrund-cyklus efter en frisk åbning, før den overhovedet
    // opdages.
    reg.update().catch(()=>{});
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) reg.update().catch(()=>{}); });
    reg.addEventListener('updatefound', ()=>{
      const nw = reg.installing;
      if(!nw) return;
      nw.addEventListener('statechange', ()=>{
        if(nw.state === 'installed' && navigator.serviceWorker.controller){
          toast('🔄 Ny version klar — opdaterer...');
          setTimeout(()=>location.reload(), 900);
        }
      });
    });
  }).catch(()=>{});
  let swRefreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(swRefreshed) return;
    swRefreshed = true;
    location.reload();
  });
}
</script>
